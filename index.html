<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://www.youtube.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #ytFrameContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fa5252; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="ytFrameContainer"></div>
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR DE REPRODUCCIÓN</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>
    </div>

    <!-- CARGA DE LA API OFICIAL DE YOUTUBE -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        try {
            Object.defineProperty(document, 'hidden', { get: () => false });
            Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        } catch (e) {}

        window.addEventListener('visibilitychange', (e) => {
            e.stopImmediatePropagation();
        }, true);

        const params = new URLSearchParams(window.location.search);
        const initialVid = params.get('v');
        const wantsAutoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t')) || 0;

        const playerHost = document.getElementById('playerHost');
        const container = document.getElementById('ytFrameContainer');
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let ytPlayer = null;
        let currentVid = initialVid || null;
        let isApiReady = false;
        let pendingLoad = null;
        let hasActiveError = false;
        let isReadyReported = false;
        let isPlayingConfirmed = false;
        let userWantsPlayback = wantsAutoplay;
        let progressInterval = null;
        let loadWatchdogTimer = null;
        const LOAD_TIMEOUT_MS = 12000;

        const ERRORS_MAP = {
            150: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            101: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            100: 'El video fue eliminado o configurado como privado.',
            2: 'Identificador de video de YouTube no válido.',
            5: 'Error de decodificación en el reproductor HTML5.'
        };

        function log(msg) {
            console.log('[X-Player]', msg);
        }

        function postToParent(data) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) {}
        }

        function showSpinner() {
            if (!hasActiveError) spinner.classList.add('active');
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function clearLoadWatchdog() {
            if (loadWatchdogTimer) {
                clearTimeout(loadWatchdogTimer);
                loadWatchdogTimer = null;
            }
        }

        function startLoadWatchdog() {
            clearLoadWatchdog();
            loadWatchdogTimer = setTimeout(function() {
                if (hasActiveError || isPlayingConfirmed) return;
                log('Watchdog timeout alcanzado.');
                triggerError(150);
            }, LOAD_TIMEOUT_MS);
        }

        function triggerError(code) {
            if (hasActiveError) return;
            log('triggerError: ' + code);
            hasActiveError = true;
            clearLoadWatchdog();
            stopProgressTracking();
            hideSpinner();
            videoCover.classList.remove('hidden');

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? 'ERROR ' + num : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
        }

        function clearError() {
            hasActiveError = false;
            errorView.classList.remove('active');
            clearLoadWatchdog();
        }

        function startProgressTracking() {
            stopProgressTracking();
            progressInterval = setInterval(function() {
                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
                try {
                    const time = ytPlayer.getCurrentTime() || 0;
                    const dur = ytPlayer.getDuration() || 0;
                    const state = ytPlayer.getPlayerState();
                    const isPlaying = state === YT.PlayerState.PLAYING;
                    
                    if (time > 0) hideSpinner();

                    postToParent({
                        type: 'progress',
                        time: Number(time) || 0,
                        duration: Number(dur) || 0,
                        playing: isPlaying
                    });
                } catch(e) {}
            }, 250);
        }

        function stopProgressTracking() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function markPlaybackStarted() {
            if (hasActiveError) return;
            log('Playback confirmado.');
            isPlayingConfirmed = true;
            clearLoadWatchdog();
            hideSpinner();
            videoCover.classList.add('hidden');
            clearError();
            startProgressTracking();

            const dur = (ytPlayer && typeof ytPlayer.getDuration === 'function') ? ytPlayer.getDuration() : 0;
            const time = (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') ? ytPlayer.getCurrentTime() : 0;

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(dur) || 0,
                    time: Number(time) || 0
                });
            }
        }

        function destroyPlayer() {
            clearLoadWatchdog();
            stopProgressTracking();
            if (ytPlayer) {
                try { ytPlayer.destroy(); } catch (e) {}
                ytPlayer = null;
            }
            container.innerHTML = '';
        }

        function createPlayer(vid, timeSec, autoplay) {
            destroyPlayer();
            currentVid = vid;

            const targetDiv = document.createElement('div');
            targetDiv.id = 'ytPlayerInstance';
            container.appendChild(targetDiv);

            // AQUÍ SE CREA EL IFRAME NATIVO CON AUTOPLAY=1 REAL EN LA URL
            ytPlayer = new YT.Player('ytPlayerInstance', {
                width: '100%',
                height: '100%',
                videoId: vid,
                playerVars: {
                    autoplay: autoplay ? 1 : 0,  // <-- 100% REAL PARA YOUTUBE
                    start: Math.max(0, Math.floor(timeSec)),
                    controls: 0,
                    rel: 0,
                    playsinline: 1,
                    enablejsapi: 1,
                    iv_load_policy: 3,
                    disablekb: 1,
                    fs: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: function(e) {
                        log('YouTube API onReady');
                        const dur = ytPlayer.getDuration() || 0;
                        postToParent({ type: 'ready', duration: dur, time: timeSec });
                        if (dur > 0) postToParent({ type: 'duration', duration: dur });

                        if (autoplay) {
                            ytPlayer.playVideo();
                        } else {
                            hideSpinner();
                        }
                    },
                    onStateChange: function(e) {
                        log('YouTube StateChange: ' + e.data);
                        // 1 = Reproduciendo, 3 = Buffering
                        if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING) {
                            markPlaybackStarted();
                        } else if (e.data === YT.PlayerState.ENDED) {
                            userWantsPlayback = false;
                            postToParent({ type: 'ended' });
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            if (userWantsPlayback && !hasActiveError) {
                                ytPlayer.playVideo();
                            }
                        }
                    },
                    onError: function(e) {
                        log('YouTube Error Real detectado: ' + e.data);
                        triggerError(e.data);
                    }
                }
            });
        }

        function loadVideoDirectly(vid, timeSec, autoplay) {
            log('loadVideoDirectly: vid=' + vid + ' autoplay=' + autoplay);
            currentVid = vid;
            isPlayingConfirmed = false;
            isReadyReported = false;
            userWantsPlayback = !!autoplay;
            
            showSpinner();
            videoCover.classList.remove('hidden');
            errorView.classList.remove('active');
            hasActiveError = false;

            if (autoplay) startLoadWatchdog();

            if (isApiReady) {
                createPlayer(vid, timeSec, autoplay);
            } else {
                pendingLoad = { vid: vid, timeSec: timeSec, autoplay: autoplay };
            }
        }

        // Callback que invoca automáticamente la librería de YouTube al cargar
        window.onYouTubeIframeAPIReady = function() {
            log('YouTube Iframe API cargada en memoria.');
            isApiReady = true;
            if (pendingLoad) {
                createPlayer(pendingLoad.vid, pendingLoad.timeSec, pendingLoad.autoplay);
                pendingLoad = null;
            }
        };

        // Escucha de comandos del padre (voz eva)
        window.addEventListener('message', function(ev) {
            var data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            var action = data.cmd || data.type;

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;
                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    if (ytPlayer && !hasActiveError && typeof ytPlayer.playVideo === 'function') {
                        ytPlayer.playVideo();
                    }
                    break;
                case 'pause':
                    userWantsPlayback = false;
                    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                        ytPlayer.pauseVideo();
                    }
                    hideSpinner();
                    break;
                case 'seek':
                    if (ytPlayer && typeof data.time !== 'undefined' && typeof ytPlayer.seekTo === 'function') {
                        ytPlayer.seekTo(Number(data.time), true);
                    }
                    break;
                case 'setVolume':
                    if (ytPlayer && typeof data.volume !== 'undefined' && typeof ytPlayer.setVolume === 'function') {
                        var v = Math.max(0, Math.min(100, Number(data.volume)));
                        ytPlayer.setVolume(v);
                    }
                    break;
                case 'mute':
                    if (ytPlayer && typeof ytPlayer.mute === 'function') {
                        ytPlayer.mute();
                    }
                    break;
                case 'unmute':
                    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
                        ytPlayer.unMute();
                    }
                    break;
                case 'stop':
                    userWantsPlayback = false;
                    isPlayingConfirmed = false;
                    destroyPlayer();
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        });

        if (initialVid) {
            loadVideoDirectly(initialVid, startTime, wantsAutoplay);
        } else {
            hideSpinner();
        }
    </script>
</body>
</html>
