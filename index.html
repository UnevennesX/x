<!DOCTYPE html>
<html lang="es">
<head>
    <meta="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
 <script type="module" src="https://cdn.vidstack/player"></script>

    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0 width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
 }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        .video-cover {
            position: absolute; inset: 0; background #000000;
            z: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top: #4c65;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity .25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text: uppercase; color: #fa5252; margin: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner"="minimal-spinner active"></div>

        <div iderrorView" class="minimal-error">
            <span id="errCode" classerror-tag">ERROR DE REDUCCIÓN</span>
            <p iderrText" class="error-msg">No se pudo reproducir este video.</p>
        </div>
    </div>

    <script        try {
            Object.defineProperty(document, 'hidden', { get: function() { return false; } });
            Object.defineProperty(document 'visibilityState', get: function() { return 'visible'; } });
        } catch (e) {}

        window.addEventListener('visibilitychange', function(e) {
            e.stopImmediatePropagation();
        }, true);

        var params = new URL(window.location.search);
        var initialVid = params.get('v');
        var wantsAutoplay = params.get('autoplay') === '1';
        var startTime = Number(params.get('t')) || 0;

        var playerHost = document.getElementById('playerHost');
        videoCover = document.getElementById('videoCover');
        var spinner document.getElementById('loadingSpinner');
        var errorView = document.getElementById('errorView');
        var errCode = document.getElementById('errCode');
        var errText = document.getElementById('errText');

        var player = null;
        var currentVid = initialVid ||;
        var playerVid =;
        var hasActiveError = false;
        varReadyReported = false;
        var userWantsPlayback = wantsAutoplay;

        var loadWatchdogTimer = null;
        var isPlayingConfirmed = false;
        var LOAD_TIMEOUT_MS = 20000; // FIX: 12s -> 20s
        var ytBubbleHandler = null;
        var ytCaptureHandler = null        // FIX: control de reintentos para no saturar el iframe con play()
        var playRetryCount = 0;
        var PLAY_RETRY_MAX = 5;
        // FIX: no forzar replay durante buffering
        var isBuffering = false;

        var ERRORS_MAP = {
            150: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            101: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            100: 'El video fue eliminado o configurado como privado.',
            2: 'Identificador de video de YouTube no válido.',
            5: 'Error de decodificación en el reproductor HTML5.'
        };

        function log(msg) {
            console.log('[X-Player]', msg, 'vid=' + currentVid, 'err=' + hasActiveError, 'ready=' + isReadyReported, 'playing=' + isPlayingConfirmed);
        }

        function postToParent(data) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) {}
        }

        function showSpinner() {
            if (!hasActiveError) spinner.classList.add('active');
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function clearLoadWatchdog() {
            if (loadWatchdogTimer) {
                clearTimeout(loadWatchdogTimer);
                loadWatchdogTimer = null;
            }
        }

        function startLoadWatchdog() {
            clearLoadWatchdog();
            loadWatchdogTimer = setTimeout(function() {
                if (hasActiveError || isPlayingConfirmed) return;
                log('watchdog FIRED');
                var detectedErr = detectVidstackError();
                triggerError(detectedErr || 150);
            }, LOAD_TIMEOUT_MS);
        }

        function detectVidstackError() {
            if (!player) return null;
            try {
                var e = player.error;
                if (e) {
                    // FIX: filtrar errores no fatales (AbortError del autoplay, etc.)
                    if (e.name === 'AbortError') return null;
                    if (e.code === 0 || e.code === 1) return null;
                    return e.code || e.message || e;
                }
            } catch (ex) {}
            try {
                if (player.state && player.state.error) {
                    var e2 = player.state.error;
                    if (e2.name === 'AbortError') return null;
                    if (e2.code === 0 || e2.code === 1) return null;
                    return e2.code || e2.message || e2;
                }
            } catch (ex) {}
            return null;
        }

        // FIX: solo errores realmente fatales se muestran al usuario
        function isFatalError(code) {
            var num = Number(code);
            // Códigos reales de YouTube
            if (num === 2 || num === 5 || num === 100 || num === 101 || num === 150) return true;
            // MediaError: 4 = src no soportado (fatal)
            if (num === 4) return true;
            // Strings: solo fatales si el mensaje lo indica claramente
            if (typeof code === 'string' && isNaN(num)) {
                var s = code.toLowerCase();
                if (s.indexOf('blocked') !== -1 || s.indexOf('not available') !== -1 ||
                    s.indexOf('removed') !== -1 || s.indexOf('private') !== -1 ||
                    s.indexOf('no supported source') !== -1) return true;
                return false;
            }
            return false;
        }

        function triggerError(code) {
            if (hasActiveError) return;
            // FIX: ignorar errores no fatales
            if (!isFatalError(code)) {
                log('triggerError IGNORADO (no fatal): ' + code);
                return;
            }
            log('triggerError: ' + code);
            hasActiveError = true;
            clearLoadWatchdog();
            hideSpinner();
            videoCover.classList.remove('hidden');

            var num = Number(code);
            var msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? 'ERROR ' + num : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
        }

        function clearError() {
            hasActiveError = false;
            errorView.classList.remove('active');
            clearLoadWatchdog();
        }

        function getActiveYouTubeIframe() {
            if (!player) return null;
            var frame = player.querySelector('iframe');
            if (!frame && player.shadowRoot) {
                frame = player.shadowRoot.querySelector('iframe');
            }
            if (!frame) {
                var provider = player.querySelector('media-provider');
                if (provider) {
                    frame = provider.querySelector('iframe') || (provider.shadowRoot && provider.shadowRoot.querySelector('iframe'));
                }
            }
            return frame;
        }

        function sendDirectCommand(funcName, args) {
            try {
                var frame = getActiveYouTubeIframe();
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: funcName,
                        args: args || []
                    }), '*');
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            userWantsPlayback = true;
            // FIX: limitar reintentos
            if (playRetryCount >= PLAY_RETRY_MAX) {
                log('safePlay: máximo de reintentos alcanzado');
                return;
            }
            playRetryCount++;
            sendDirectCommand('playVideo');
            try {
                var prom = player.play();
                if (prom && typeof prom.catch === 'function') {
                    prom.catch(function(err) {
                        // FIX: AbortError no es error real
                        if (err && err.name === 'AbortError') {
                            log('safePlay: AbortError ignorado');
                            return;
                        }
                        sendDirectCommand('playVideo');
                    });
                }
            } catch (e) {
                sendDirectCommand('playVideo');
            }
        }

        function resetPlayRetries() {
            playRetryCount = 0;
        }

        function forceSeek(timeSec) {
            var target = Math.max(0, Number(timeSec) || 0);
            if (player) { try { player.currentTime = target; } catch (e) {} }
            sendDirectCommand('seekTo', [target, true]);
        }

        function markPlaybackStarted() {
            if (hasActiveError) return;
            log('markPlaybackStarted');
            isPlayingConfirmed = true;
            isBuffering = false;
            resetPlayRetries();
            clearLoadWatchdog();
            hideSpinner();
            videoCover.classList.add('hidden');
            clearError();

            postToParent({
                type: 'progress',
                time: Number(player ? player.currentTime : 0) || 0,
                duration: Number(player ? player.duration : 0) || 0,
                playing: true
            });

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(player ? player.duration : 0) || 0,
                    time: Number(player ? player.currentTime : 0) || 0
                });
            }
        }

        // FIX: estado "cued" (5) de YT = video cargado correctamente
        // Cancela el watchdog para que NO dispare el falso error 150
        function markVideoCued() {
            if (hasActiveError || isPlayingConfirmed) return;
            log('markVideoCued: video cargado OK, esperando reproducción');
            clearLoadWatchdog();
            hideSpinner();

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(player ? player.duration : 0) || 0,
                    time: Number(player ? player.currentTime : 0) || 0
                });
            }

            if (userWantsPlayback) safePlay();
        }

        function destroyPlayer() {
            playerVid = null;
            resetPlayRetries();
            isBuffering = false;
            if (player) {
                try { player.pause(); } catch (e) {}
                try { player.removeAttribute('src'); } catch (e) {}
                try { player.load(); } catch (e) {}
                try { player.remove(); } catch (e) {}
                player = null;
            }
        }

        function createPlayer(vid, timeSec, autoplay) {
            destroyPlayer();
            playerVid = vid;

            var mp = document.createElement('media-player');
            mp.id = 'rmExternalPlayer';
            mp.className = 'vds-player';
            mp.setAttribute('load', 'eager');
            mp.setAttribute('stream-type', 'on-demand');
            mp.setAttribute('log-level', 'silent');
            mp.setAttribute('crossorigin', '');
            mp.setAttribute('playsinline', '');
            mp.setAttribute('tabindex', '0');
            mp.setAttribute('role', 'region');
            mp.setAttribute('aria-label', 'Video Player');
            mp.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#000;';

            var prov = document.createElement('media-provider');
            prov.setAttribute('keep-alive', '');
            mp.appendChild(prov);

            playerHost.appendChild(mp);
            player = mp;

            mp.addEventListener('playing', function() {
                if (playerVid !== currentVid) return;
                log('EVENT: playing');
                markPlaybackStarted();
            });

            mp.addEventListener('waiting', function() {
                if (playerVid !== currentVid) return;
                log('EVENT: waiting (buffering)');
                isBuffering = true;
            });

            mp.addEventListener('pause', function() {
                if (playerVid !== currentVid) return;
                log('EVENT: pause userWants=' + userWantsPlayback + ' err=' + hasActiveError);
                // FIX: no forzar replay durante buffering ni si se agotaron reintentos
                if (userWantsPlayback && !hasActiveError && !isBuffering && playRetryCount < PLAY_RETRY_MAX) {
                    sendDirectCommand('playVideo');
                    setTimeout(function() {
                        if (userWantsPlayback && player && player.paused && !isBuffering) {
                            safePlay();
                        }
                    }, 250);
                }
            });

            mp.addEventListener('time-update', function() {
                if (playerVid !== currentVid) return;
                if (player && player.currentTime > 0) hideSpinner();
                // FIX: reproducción activa resetea el contador de reintentos
                if (player && !player.paused) resetPlayRetries();
                var dur = Number(player ? player.duration : 0) || 0;
                var isPlaying = player ? !player.paused : false;
                postToParent({
                    type: 'progress',
                    time: Number(player ? player.currentTime : 0) || 0,
                    duration: dur,
                    playing: isPlaying
                });
            });

            mp.addEventListener('loaded-metadata', function() {
                if (playerVid !== currentVid) return;
                var dur = Number(player ? player.duration : 0) || 0;
                if (dur > 0) postToParent({ type: 'duration', duration: dur });
            });

            mp.addEventListener('ended', function() {
                if (playerVid !== currentVid) return;
                log('EVENT: ended');
                userWantsPlayback = false;
                postToParent({ type: 'ended' });
            });

            mp.addEventListener('error', function(ev) {
                if (playerVid !== currentVid) return;
                var detail = ev && ev.detail;
                var code = detail && (detail.code || 0);
                log('EVENT: error code=' + code);
                // FIX: solo códigos >= 4 (fatales). 0 y 1 se ignoran.
                if (code >= 4) {
                    var err = (detail && (detail.message || detail.error)) || 'Playback Error';
                    triggerError(err);
                }
            });

            mp.src = 'youtube/' + vid;
            log('createPlayer: player.src set to youtube/' + vid);
        }

        function loadVideoDirectly(vid, timeSec, autoplay) {
            log('loadVideoDirectly: vid=' + vid + ' time=' + timeSec + ' autoplay=' + autoplay);
            currentVid = vid;
            isPlayingConfirmed = false;
            isReadyReported = false;
            userWantsPlayback = !!autoplay;
            resetPlayRetries();
            isBuffering = false;
            showSpinner();
            videoCover.classList.remove('hidden');
            errorView.classList.remove('active');
            hasActiveError = false;
            startLoadWatchdog();

            var t = Number(timeSec) || 0;

            var onCanPlay = function() {
                log('can-play fired for ' + vid);
                player.removeEventListener('can-play', onCanPlay);
                // FIX: can-play = video cargó bien -> cancelar watchdog
                clearLoadWatchdog();
                if (t > 0) forceSeek(t);
                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
                isReadyReported = true;
                if (autoplay) safePlay();
                else hideSpinner();
            };

            createPlayer(vid, t, autoplay);
            player.addEventListener('can-play', onCanPlay);
        }

        if (ytBubbleHandler) window.removeEventListener('message', ytBubbleHandler);
        if (ytCaptureHandler) window.removeEventListener('message', ytCaptureHandler, true);

        ytBubbleHandler = function(ev) {
            if (typeof ev.data === 'string') {
                if (ev.data.indexOf('onError') !== -1) {
                    try {
                        var ytErr = JSON.parse(ev.data);
                        if (ytErr.event === 'onError' && ytErr.info) {
                            log('YT onError: ' + ytErr.info);
                            if (playerVid !== currentVid) return;
                            triggerError(ytErr.info);
                        }
                    } catch (e) {}
                }
                if (ev.data.indexOf('onStateChange') !== -1) {
                    try {
                        var ytState = JSON.parse(ev.data);
                        log('YT onStateChange: ' + ytState.info);
                        if (playerVid !== currentVid) return;
                        // FIX: estado 5 (cued) = cargado OK
                        if (ytState.info === 5) markVideoCued();
                        if (ytState.info === 1 || ytState.info === 3) {
                            isBuffering = (ytState.info === 3);
                            markPlaybackStarted();
                        }
                        if (ytState.info === 2 && userWantsPlayback && !hasActiveError && playRetryCount < PLAY_RETRY_MAX) {
                            sendDirectCommand('playVideo');
                        }
                    } catch (e) {}
                }
                return;
            }

            var data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            var action = data.cmd || data.type;

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;
                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    // FIX: comando externo = interacción -> resetea reintentos
                    resetPlayRetries();
                    if (!hasActiveError) safePlay();
                    break;
                case 'pause':
                    userWantsPlayback = false;
                    if (player) try { player.pause(); } catch (e) {}
                    sendDirectCommand('pauseVideo');
                    hideSpinner();
                    break;
                case 'seek':
                    if (typeof data.time !== 'undefined') forceSeek(Number(data.time));
                    break;
                case 'setVolume':
                    if (typeof data.volume !== 'undefined') {
                        var v = Math.max(0, Math.min(100, Number(data.volume)));
                        if (player) player.volume = v / 100;
                        sendDirectCommand('setVolume', [v]);
                    }
                    break;
                case 'mute':
                    if (player) player.muted = true;
                    sendDirectCommand('mute');
                    break;
                case 'unmute':
                    if (player) player.muted = false;
                    sendDirectCommand('unMute');
                    break;
                case 'stop':
                    userWantsPlayback = false;
                    isPlayingConfirmed = false;
                    clearLoadWatchdog();
                    destroyPlayer();
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        };
        window.addEventListener('message', ytBubbleHandler);

        ytCaptureHandler = function(ev) {
            if (hasActiveError) return;
            if (playerVid !== currentVid) return;
            if (typeof ev.data !== 'string') return;
            if (ev.data.indexOf('onError') === -1) return;
            try {
                var ytData = JSON.parse(ev.data);
                if (ytData.event === 'onError' && ytData.info) {
                    triggerError(ytData.info);
                }
            } catch (e) {}
        };
        window.addEventListener('message', ytCaptureHandler, true);

        if (initialVid) {
            loadVideoDirectly(initialVid, startTime, wantsAutoplay);
        } else {
            hideSpinner();
        }
    </script>
</body>
</html>
