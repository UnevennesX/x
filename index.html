<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Player</title>

    <!-- Vidstack Player CSS & JS Oficiales (Sin 404) -->
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://www.youtube.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            inset: 0;
            background-color: #000000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        #rmExternalPlayer.vds-visible {
            opacity: 1;
            visibility: visible;
        }

        media-player, media-player * {
            max-width: 100%;
        }

        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* Cortina Protectora */
        .rm-curtain {
            position: absolute;
            inset: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .rm-curtain.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .rm-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .rm-idle-layer {
            position: absolute;
            inset: 0;
            background-color: #000000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
            color: #555555;
            font-size: 0.88rem;
        }

        .rm-idle-layer.active {
            display: flex;
        }

        /* Capa de Error */
        .rm-error-layer {
            position: absolute;
            inset: 0;
            background-color: #0a0a0a;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
        }

        .rm-error-layer.active {
            display: flex;
        }

        .rm-error-box {
            max-width: 420px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .rm-error-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .rm-error-reason {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #888888;
            word-break: break-word;
        }

        .rm-error-code {
            font-size: 0.75rem;
            font-family: monospace;
            color: #555555;
            margin-top: 2px;
        }

        .rm-countdown-msg {
            display: none;
            font-size: 0.82rem;
            color: #777777;
            margin-top: 6px;
        }

        .rm-countdown-msg.visible {
            display: block;
        }

        .rm-countdown-sec {
            font-weight: 600;
            color: #ffffff;
        }

        .rm-btn-skip {
            margin-top: 10px;
            padding: 8px 18px;
            background: #1c1c1c;
            color: #eeeeee;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .rm-btn-skip:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Cortina inicial -->
        <div id="rmCurtain" class="rm-curtain">
            <div class="rm-spinner"></div>
        </div>

        <!-- Capa sin video -->
        <div id="rmIdleOverlay" class="rm-idle-layer">
            <span>En espera de video...</span>
        </div>

        <!-- Reproductor Vidstack -->
        <media-player id="rmExternalPlayer" playsinline crossorigin>
            <media-provider></media-provider>
            <media-video-layout></media-video-layout>
        </media-player>

        <!-- Capa de Error -->
        <div id="rmErrorOverlay" class="rm-error-layer">
            <div class="rm-error-box">
                <div id="rmErrorTitle" class="rm-error-title">No se pudo reproducir</div>
                <div id="rmErrorReason" class="rm-error-reason">Ocurrió un error al cargar el video.</div>
                <div id="rmErrorCode" class="rm-error-code"></div>
                <div id="rmCountdownBox" class="rm-countdown-msg">
                    Siguiente video en <span id="rmCountdownSec" class="rm-countdown-sec">5</span>s
                </div>
                <button id="rmBtnSkip" class="rm-btn-skip" style="display: none;">Saltar video</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialVideoId = urlParams.get('v') || urlParams.get('videoId') || null;
        const initialAutoplay = urlParams.get('autoplay') === '1';
        const initialStartTime = Math.max(0, Number(urlParams.get('t') || urlParams.get('time')) || 0);

        const player = document.getElementById('rmExternalPlayer');
        const curtain = document.getElementById('rmCurtain');
        const idleOverlay = document.getElementById('rmIdleOverlay');
        const errorOverlay = document.getElementById('rmErrorOverlay');
        const errorTitle = document.getElementById('rmErrorTitle');
        const errorReason = document.getElementById('rmErrorReason');
        const errorCodeTag = document.getElementById('rmErrorCode');
        const countdownBox = document.getElementById('rmCountdownBox');
        const countdownSec = document.getElementById('rmCountdownSec');
        const btnSkip = document.getElementById('rmBtnSkip');

        let currentVid = null;
        let isFatalError = false;
        let hasNextInQueue = false;
        let countdownTimer = null;
        let watchdogTimer = null;
        let reportedReady = false;
        let endedThisVideo = false;
        let endedReported = false;
        let lastExpectedAutoplay = false;

        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return '';
            const match = String(urlOrId).match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (match && match[1]) return match[1];
            return String(urlOrId).trim();
        }

        function getRealErrorMessage(code, rawMsg) {
            if (rawMsg && typeof rawMsg === 'string' && rawMsg.trim().length > 0 && !rawMsg.includes('[object')) {
                return {
                    title: 'Error de reproducción',
                    reason: rawMsg
                };
            }

            const numericCode = Number(code);
            switch (numericCode) {
                case 2:
                    return {
                        title: 'Parámetro no válido',
                        reason: 'El ID del video contiene caracteres no válidos o es incorrecto.'
                    };
                case 5:
                    return {
                        title: 'Error de HTML5',
                        reason: 'El contenido no se puede reproducir en el reproductor HTML5.'
                    };
                case 100:
                    return {
                        title: 'Video no encontrado',
                        reason: 'El video no existe, ha sido eliminado o está marcado como privado.'
                    };
                case 101:
                case 150:
                    return {
                        title: 'Inserción no permitida',
                        reason: 'El propietario del video no permite reproducirlo fuera de YouTube.'
                    };
                case 153:
                case 155:
                    return {
                        title: 'Restricción de región',
                        reason: 'Este video no está disponible en este sitio o país.'
                    };
                case 408:
                    return {
                        title: 'Tiempo de espera agotado',
                        reason: 'El video tardó demasiado en responder al conectar.'
                    };
                default:
                    return {
                        title: 'Error de reproducción',
                        reason: 'No se pudo cargar el video debido a una falla inesperada del reproductor.'
                    };
            }
        }

        function postToParent(msg) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'room-player', ...msg }, '*');
                }
            } catch (e) {}
        }

        function showCurtain() {
            idleOverlay.classList.remove('active');
            curtain.classList.remove('hidden');
            player.classList.remove('vds-visible');
        }

        function hideCurtain() {
            curtain.classList.add('hidden');
            player.classList.add('vds-visible');
        }

        function hideOverlay() {
            errorOverlay.classList.remove('active');
            countdownBox.classList.remove('visible');
            btnSkip.style.display = 'none';
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            isFatalError = false;
        }

        function startHangWatchdog() {
            clearHangWatchdog();
            watchdogTimer = setTimeout(function () {
                if (!reportedReady && !isFatalError) {
                    triggerCustomError(408, 'Tiempo de espera agotado al conectar con el servidor.');
                }
            }, 14000);
        }

        function clearHangWatchdog() {
            if (watchdogTimer) {
                clearTimeout(watchdogTimer);
                watchdogTimer = null;
            }
        }

        function startCountdown() {
            let left = 5;
            countdownSec.textContent = left;
            countdownBox.classList.add('visible');
            btnSkip.style.display = 'inline-block';

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(function () {
                left--;
                if (left <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    skipVideo();
                } else {
                    countdownSec.textContent = left;
                }
            }, 1000);
        }

        btnSkip.addEventListener('click', skipVideo);

        function triggerCustomError(code, customMessage) {
            clearHangWatchdog();
            isFatalError = true;

            // Oculta el reproductor para que jamás destelle el iframe nativo
            player.classList.remove('vds-visible');
            curtain.classList.add('hidden');

            const errorInfo = getRealErrorMessage(code, customMessage);
            errorTitle.textContent = errorInfo.title;
            errorReason.textContent = errorInfo.reason;
            errorCodeTag.textContent = code ? `Código: ${code}` : '';

            errorOverlay.classList.add('active');

            try { player.pause(); } catch (e) {}
            postToParent({ type: 'error', code: Number(code) || 150, videoId: currentVid, message: errorInfo.reason });

            if (hasNextInQueue) {
                startCountdown();
            } else {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                countdownBox.classList.remove('visible');
            }
        }

        function skipVideo() {
            hideOverlay();
            clearHangWatchdog();
            postToParent({ type: 'skip_fatal', videoId: currentVid });
        }

        // Intercepción inmediata de errores de YouTube
        window.addEventListener('message', function (ev) {
            try {
                let data = ev.data;
                if (typeof data === 'string') data = JSON.parse(data);
                if (data) {
                    if (data.event === 'onError' || [2, 5, 100, 101, 150, 153, 155].includes(Number(data.info))) {
                        const code = data.info || (data.data && data.data.code) || 150;
                        const msg = data.data && data.data.message ? data.data.message : null;
                        triggerCustomError(code, msg);
                    }
                }
            } catch (err) {}
        });

        function safePlay() {
            if (!player || isFatalError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {
                        player.muted = true;
                        player.play().catch(function () {});
                    });
                }
            } catch (e) {}
        }

        function loadVideo(vid, shouldAutoplay, seekTime) {
            const cleanId = extractYouTubeId(vid);
            if (!cleanId) {
                hideCurtain();
                idleOverlay.classList.add('active');
                return;
            }

            hideOverlay();
            showCurtain();
            clearHangWatchdog();

            currentVid = cleanId;
            endedThisVideo = false;
            endedReported = false;
            reportedReady = false;
            lastExpectedAutoplay = !!shouldAutoplay;

            if (shouldAutoplay) {
                player.setAttribute('autoplay', '');
            } else {
                player.removeAttribute('autoplay');
            }

            // Carga nativa de YouTube en Vidstack
            player.src = 'youtube/' + cleanId;
            startHangWatchdog();

            const startTimeSec = Math.max(0, Number(seekTime) || 0);
            const onReady = function () {
                player.removeEventListener('can-play', onReady);
                if (startTimeSec > 0) {
                    try { player.currentTime = startTimeSec; } catch (e) {}
                }
                if (lastExpectedAutoplay) {
                    safePlay();
                }
            };
            player.addEventListener('can-play', onReady);
        }

        function onPlaybackConfirmed() {
            if (isFatalError) return;
            clearHangWatchdog();
            hideOverlay();
            hideCurtain();

            if (!reportedReady) {
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
        }

        player.addEventListener('can-play', onPlaybackConfirmed);
        player.addEventListener('playing', onPlaybackConfirmed);
        player.addEventListener('time-update', function () {
            if (player.currentTime > 0.05 && !isFatalError) {
                onPlaybackConfirmed();
            }
        });

        player.addEventListener('error', function (ev) {
            const detail = ev.detail || ev;
            let ytCode = 150;
            let errorMsg = null;

            if (detail) {
                if (typeof detail.code === 'number') ytCode = detail.code;
                else if (typeof detail.data === 'number') ytCode = detail.data;
                else if (detail.cause && typeof detail.cause.data === 'number') ytCode = detail.cause.data;

                if (detail.message) errorMsg = detail.message;
                else if (detail.cause && detail.cause.message) errorMsg = detail.cause.message;
            }
            triggerCustomError(ytCode, errorMsg);
        });

        player.addEventListener('ended', function () {
            endedThisVideo = true;
            if (!endedReported) {
                endedReported = true;
                postToParent({ type: 'ended', videoId: currentVid });
            }
        });

        function reportDuration() {
            const d = player.duration;
            if (d && isFinite(d) && d > 0 && !isFatalError) {
                postToParent({ type: 'duration', videoId: currentVid, duration: d });
                return true;
            }
            return false;
        }

        player.addEventListener('durationchange', reportDuration);
        player.addEventListener('loadedmetadata', reportDuration);

        // Inicialización
        if (initialVideoId) {
            loadVideo(initialVideoId, initialAutoplay, initialStartTime);
        } else {
            hideCurtain();
            idleOverlay.classList.add('active');
        }

        // Mensajes recibidos
        window.addEventListener('message', function (ev) {
            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            switch (data.type) {
                case 'load':
                    hasNextInQueue = !!data.hasNext;
                    loadVideo(data.videoId, data.autoplay, data.time);
                    break;
                case 'queue_state':
                    hasNextInQueue = !!data.hasNext;
                    if (isFatalError && hasNextInQueue && !countdownTimer) {
                        startCountdown();
                    } else if (isFatalError && !hasNextInQueue && countdownTimer) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        countdownBox.classList.remove('visible');
                    }
                    break;
                case 'play':
                    if (!isFatalError) {
                        lastExpectedAutoplay = true;
                        safePlay();
                    }
                    break;
                case 'pause':
                    if (!isFatalError) {
                        lastExpectedAutoplay = false;
                        try { player.pause(); } catch (e) {}
                    }
                    break;
                case 'seek':
                    if (!isFatalError) {
                        player.currentTime = Math.max(0, Number(data.time) || 0);
                    }
                    break;
                case 'stop':
                    hideOverlay();
                    showCurtain();
                    clearHangWatchdog();
                    lastExpectedAutoplay = false;
                    try { player.pause(); } catch (e) {}
                    player.currentTime = 0;
                    break;
                case 'mute':
                    player.muted = true;
                    break;
                case 'unmute':
                    player.muted = false;
                    break;
                case 'setVolume':
                    player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                    break;
            }
        });
    </script>
</body>
</html>
