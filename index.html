<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Headless Player</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Contenedor que recorta cualquier barra o título forzado por YouTube */
        #playerHost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Desactiva interacción de mouse/touch para que YouTube no muestre overlays */
            user-select: none;
        }

        /* Escalado sutil para ocultar los márgenes de 1-2px donde YouTube coloca títulos o marcas */
        #ytWrapper {
            width: 100%;
            height: 100%;
            transform: scale(1.05);
            transform-origin: center center;
        }

        #ytWrapper iframe,
        #ytPlayer {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="ytWrapper">
            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let videoId = params.get('v') || '';
        let autoplay = params.get('autoplay') === '1';
        let startTime = parseFloat(params.get('t')) || 0;

        let player = null;
        let isReady = false;
        let currentVid = videoId;
        let endedReported = false;
        let durationPollInterval = null;

        function postToParent(m) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*');
            } catch (e) {}
        }

        // Carga dinámica y ligera de la API oficial de YouTube (Sin frameworks externos)
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('ytPlayer', {
                width: '100%',
                height: '100%',
                videoId: videoId,
                playerVars: {
                    autoplay: autoplay ? 1 : 0,
                    controls: 0,          // 0 interfaz de reproducción
                    disablekb: 1,         // Desactiva teclado
                    fs: 0,                // Desactiva botón pantalla completa
                    iv_load_policy: 3,    // Oculta anotaciones y tarjetas
                    modestbranding: 1,    // Minimiza logos
                    rel: 0,               // Evita videos relacionados de otros canales
                    playsinline: 1,
                    origin: window.location.origin,
                    start: Math.floor(startTime)
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        function onPlayerReady() {
            isReady = true;
            postToParent({ type: 'ready' });
            reportDuration();

            if (autoplay) {
                try { player.playVideo(); } catch (e) {}
            }
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState.PLAYING = 1
            if (event.data === 1) {
                endedReported = false;
                reportDuration();
            }
            // YT.PlayerState.ENDED = 0
            if (event.data === 0) {
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            }
        }

        function onPlayerError(event) {
            postToParent({
                type: 'error',
                videoId: currentVid,
                message: 'YouTube Error Code: ' + event.data
            });
        }

        function reportDuration() {
            if (!player || typeof player.getDuration !== 'function') return false;
            try {
                const d = player.getDuration();
                if (d && isFinite(d) && d > 0) {
                    postToParent({ type: 'duration', videoId: currentVid, duration: d });
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // Sondeo para asegurar reporte de duración preciso
        function scheduleReportDuration() {
            if (durationPollInterval) clearInterval(durationPollInterval);
            let retries = 0;
            durationPollInterval = setInterval(() => {
                if (reportDuration() || retries > 25) {
                    clearInterval(durationPollInterval);
                    durationPollInterval = null;
                }
                retries++;
            }, 800);
        }

        // Listener de comandos postMessage ('voice-eva')
        window.addEventListener('message', function (ev) {
            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            try {
                switch (data.type) {
                    case 'load':
                        if (data.videoId) {
                            currentVid = data.videoId;
                            endedReported = false;
                            const startAt = Math.max(0, Number(data.time) || 0);

                            if (player && typeof player.loadVideoById === 'function') {
                                if (data.autoplay) {
                                    player.loadVideoById({
                                        videoId: data.videoId,
                                        startSeconds: startAt
                                    });
                                } else {
                                    player.cueVideoById({
                                        videoId: data.videoId,
                                        startSeconds: startAt
                                    });
                                }
                                scheduleReportDuration();
                            }
                        }
                        break;

                    case 'play':
                        if (player && typeof player.playVideo === 'function') {
                            player.playVideo();
                        }
                        break;

                    case 'pause':
                        if (player && typeof player.pauseVideo === 'function') {
                            player.pauseVideo();
                        }
                        break;

                    case 'seek':
                        if (player && typeof player.seekTo === 'function') {
                            player.seekTo(Math.max(0, Number(data.time) || 0), true);
                        }
                        break;

                    case 'stop':
                        if (player && typeof player.stopVideo === 'function') {
                            player.stopVideo();
                        }
                        break;

                    case 'mute':
                        if (player && typeof player.mute === 'function') {
                            player.mute();
                        }
                        break;

                    case 'unmute':
                        if (player && typeof player.unMute === 'function') {
                            player.unMute();
                        }
                        break;

                    case 'setVolume':
                        if (player && typeof player.setVolume === 'function') {
                            const vol = Math.max(0, Math.min(100, Number(data.volume) || 0));
                            player.setVolume(vol);
                        }
                        break;
                }
            } catch (err) {}
        });
    </script>
</body>
</html>
