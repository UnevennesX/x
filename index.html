<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #rmExternalPlayer {
            width: 100% !important; height: 100% !important;
            max-width: none !important; margin: 0 !important;
            --media-font-family: inherit;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fa5252; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR DE REPRODUCCIÓN</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" autoplay muted load="eager" stream-type="on-demand" log-level="silent" crossorigin playsinline data-media-player tabindex="0" role="region" aria-label="Video Player">
            <media-provider keep-alive data-media-provider></media-provider>
        </media-player>
    </div>

    <script>
        const LOG_ENDPOINT = "https://voice-eva.koyeb.app/api/video-error-log";

        try {
            Object.defineProperty(document, 'hidden', { get: () => false });
            Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
            Object.defineProperty(Document.prototype, 'hidden', { get: () => false });
            Object.defineProperty(Document.prototype, 'visibilityState', { get: () => 'visible' });
        } catch (e) {}

        document.addEventListener('visibilitychange', (e) => { e.stopImmediatePropagation(); }, true);
        window.addEventListener('visibilitychange', (e) => { e.stopImmediatePropagation(); }, true);

        const params = new URLSearchParams(window.location.search);
        const initialVid = params.get('v');
        const wantsAutoplay = params.get('autoplay') !== '0';
        const startTime = Number(params.get('t')) || 0;
        
        let rawVol = params.get('vol');
        let currentVolume = (rawVol !== null && rawVol !== '' && Number(rawVol) >= 0) ? Math.max(0, Math.min(100, Number(rawVol))) : 100;
        let desiredMuted = params.get('muted') === '1';

        const player = document.getElementById('rmExternalPlayer');
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let currentVid = initialVid || null;
        let hasActiveError = false;
        let isReadyReported = false;
        let isPlayingConfirmed = false;
        let isMediaReady = false;
        let userWantsPlayback = wantsAutoplay;
        let unmutedSuccessfully = false;
        let loadWatchdogTimer = null;
        let _playRetryTimer = null;
        const LOAD_TIMEOUT_MS = 6000;

        const YT_ERRORS = {
            2:   { scope: 'content', msg: 'Identificador de video de YouTube no válido.' },
            5:   { scope: 'local',   msg: 'Error de decodificación en el reproductor HTML5.' },
            100: { scope: 'content', msg: 'El video fue eliminado o configurado como privado.' },
            101: { scope: 'embed',   msg: 'El autor bloqueó la reproducción externa o el video está restringido en tu región.' },
            150: { scope: 'embed',   msg: 'El autor bloqueó la reproducción externa o el video está restringido en tu región.' }
        };

        function postToParent(data) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) {}
        }

        function reportErrorToServer(code, message) {
            try {
                const payload = {
                    videoId: currentVid,
                    errorCode: code,
                    message: message,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    url: window.location.href,
                    referrer: document.referrer || "direct"
                };
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(LOG_ENDPOINT, blob);
                } else {
                    fetch(LOG_ENDPOINT, { method: 'POST', body: blob, keepalive: true }).catch(() => {});
                }
            } catch (err) {}
        }

        function showSpinner() { if (!hasActiveError) spinner.classList.add('active'); }
        function hideSpinner() { spinner.classList.remove('active'); }

        function clearLoadWatchdog() {
            if (loadWatchdogTimer) { clearTimeout(loadWatchdogTimer); loadWatchdogTimer = null; }
        }

        function startLoadWatchdog() {
            clearLoadWatchdog();
            loadWatchdogTimer = setTimeout(() => {
                if (hasActiveError || isPlayingConfirmed) return;
                console.log('[X-Player] Watchdog reintentando arranque forzado...');
                forceStartPlayback();
            }, LOAD_TIMEOUT_MS);
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            clearLoadWatchdog();
            hideSpinner();
            videoCover.classList.remove('hidden');

            const num = Number(code);
            const msg = (!isNaN(num) && YT_ERRORS[num]) ? YT_ERRORS[num].msg : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
            reportErrorToServer(code, msg);
        }

        function clearError() {
            hasActiveError = false;
            errorView.classList.remove('active');
            clearLoadWatchdog();
        }

        function getActiveYouTubeIframe() {
            let frame = player.querySelector('iframe');
            if (!frame && player.shadowRoot) frame = player.shadowRoot.querySelector('iframe');
            if (!frame) {
                const provider = player.querySelector('media-provider');
                if (provider) frame = provider.querySelector('iframe') || (provider.shadowRoot && provider.shadowRoot.querySelector('iframe'));
            }
            if (!frame) frame = document.querySelector('iframe[src*="youtube"]');
            return frame;
        }

        function sendDirectCommand(funcName, args) {
            try {
                const frame = getActiveYouTubeIframe();
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: funcName,
                        args: args || []
                    }), '*');
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // HACK: Desmuteo garantizado una vez que los frames comenzaron a fluir
        function unlockAudioNow() {
            if (desiredMuted || unmutedSuccessfully) return;
            try {
                player.muted = false;
                player.volume = currentVolume / 100;
                sendDirectCommand('unMute');
                sendDirectCommand('setVolume', [currentVolume]);
                unmutedSuccessfully = true;
            } catch (e) {}
        }

        // HACK CLAVE: Arrancar SIEMPRE silenciado para que Chromium jamás bloquee la promesa play(),
        // e inmediatamente soltar el audio al reproducir.
        function forceStartPlayback() {
            if (!player || hasActiveError) return;
            userWantsPlayback = true;

            // Iniciar muteado para evitar el NotAllowedError de Chrome en dominios cruzados
            player.muted = true;
            sendDirectCommand('mute');
            sendDirectCommand('playVideo');

            try {
                const p = player.play();
                if (p && p.catch) {
                    p.catch(() => {
                        sendDirectCommand('mute');
                        sendDirectCommand('playVideo');
                    });
                }
            } catch (e) {}

            if (_playRetryTimer) clearTimeout(_playRetryTimer);
            _playRetryTimer = setTimeout(() => {
                if (!hasActiveError && !isPlayingConfirmed && userWantsPlayback) {
                    forceStartPlayback();
                }
            }, 1200);
        }

        function forceSeek(timeSec) {
            const target = Math.max(0, Number(timeSec) || 0);
            try { player.currentTime = target; } catch (e) {}
            sendDirectCommand('seekTo', [target, true]);
        }

        function markPlaybackStarted() {
            if (hasActiveError) return;
            isPlayingConfirmed = true;
            isMediaReady = true;
            clearLoadWatchdog();

            if (_playRetryTimer) {
                clearTimeout(_playRetryTimer);
                _playRetryTimer = null;
            }

            hideSpinner();
            videoCover.classList.add('hidden');
            clearError();

            // Desmutear con ráfagas consecutivas apenas confirma reproducción
            unlockAudioNow();
            setTimeout(unlockAudioNow, 200);
            setTimeout(unlockAudioNow, 600);

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
            }
        }

        function loadVideoDirectly(vid, timeSec, autoplay) {
            if (currentVid === vid && isPlayingConfirmed && !hasActiveError) {
                if (autoplay) forceStartPlayback();
                return;
            }

            currentVid = vid;
            isMediaReady = false;
            unmutedSuccessfully = false;
            clearError();
            hasActiveError = false;
            isPlayingConfirmed = false;
            isReadyReported = false;
            userWantsPlayback = !!autoplay;
            
            showSpinner();
            videoCover.classList.remove('hidden');

            const t = Number(timeSec) || 0;

            if (autoplay) {
                startLoadWatchdog();
            }

            // Mute de entrada para saltar la barrera de Chromium
            player.muted = true;
            sendDirectCommand('mute');

            player.src = 'youtube/' + vid;

            let readyFired = false;
            const fireReady = () => {
                if (readyFired) return;
                readyFired = true;
                isMediaReady = true;
                player.removeEventListener('can-play', onLoaded);
                if (t > 0) forceSeek(t);

                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || t || 0
                });
                isReadyReported = true;

                if (autoplay) {
                    forceStartPlayback();
                } else {
                    hideSpinner();
                }
            };

            const onLoaded = () => { fireReady(); };
            player.addEventListener('can-play', onLoaded, { once: true });

            setTimeout(() => {
                if (!readyFired && !hasActiveError) {
                    fireReady();
                }
            }, 800);
        }

        // Si el usuario toca el iframe, desbloqueo instantáneo
        window.addEventListener('click', () => { unlockAudioNow(); }, { passive: true });
        window.addEventListener('touchstart', () => { unlockAudioNow(); }, { passive: true });

        if (player) {
            if (initialVid) {
                loadVideoDirectly(initialVid, startTime, wantsAutoplay);
            } else {
                hideSpinner();
            }

            player.addEventListener('playing', markPlaybackStarted);

            player.addEventListener('time-update', () => {
                if (player.currentTime > 0) {
                    hideSpinner();
                    // En el instante en que el tiempo avanza (>0.05s), soltamos el audio
                    if (!unmutedSuccessfully && !desiredMuted) {
                        unlockAudioNow();
                    }
                }

                postToParent({
                    type: 'progress',
                    time: Number(player.currentTime) || 0,
                    duration: Number(player.duration) || 0,
                    playing: !player.paused
                });
            });

            player.addEventListener('pause', () => {
                if (userWantsPlayback && !hasActiveError && isMediaReady) {
                    setTimeout(() => {
                        if (userWantsPlayback && player.paused && isMediaReady) {
                            forceStartPlayback();
                        }
                    }, 100);
                    return;
                }
                postToParent({ type: 'paused' });
            });

            player.addEventListener('loaded-metadata', () => {
                const dur = Number(player.duration) || 0;
                if (dur > 0) postToParent({ type: 'duration', duration: dur });
            });

            player.addEventListener('ended', () => {
                userWantsPlayback = false;
                postToParent({ type: 'ended' });
            });

            player.addEventListener('error', (ev) => {
                const detail = ev && ev.detail;
                if (!detail) return;
                const msg = String(detail.message || detail || '');
                const name = String(detail.name || '');

                if (name === 'AbortError' || msg.includes('interrupted') || msg.includes('play()')) return;
                if (name === 'NotAllowedError' || msg.includes('interact') || msg.includes('not ready')) return;

                const code = detail.code || 0;
                if (code >= 4) {
                    triggerError(detail.message || detail.error || code || 'Playback Error');
                }
            });
        }

        window.addEventListener('message', (ev) => {
            if (typeof ev.data === 'string') {
                if (ev.data.includes('onReady')) {
                    if (userWantsPlayback && !isPlayingConfirmed) {
                        forceStartPlayback();
                    }
                }
                if (ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.event === 'onError' && typeof ytData.info !== 'undefined') {
                            const errCodeNum = Number(ytData.info);
                            if (errCodeNum === 150 || errCodeNum === 101 || errCodeNum === 100 || errCodeNum === 2 || errCodeNum === 5) {
                                triggerError(errCodeNum);
                            }
                        }
                    } catch (e) {}
                }
                if (ev.data.includes('onStateChange')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.info === 1) {
                            markPlaybackStarted();
                        }
                    } catch (e) {}
                }
                return;
            }

            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            const action = data.cmd || data.type;

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        if (typeof data.volume !== 'undefined') currentVolume = Math.max(0, Math.min(100, Number(data.volume)));
                        if (typeof data.muted !== 'undefined') desiredMuted = !!data.muted;
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;
                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    forceStartPlayback();
                    break;
                case 'pause':
                    userWantsPlayback = false;
                    try { player.pause(); } catch (e) {}
                    sendDirectCommand('pauseVideo');
                    hideSpinner();
                    break;
                case 'seek':
                    if (typeof data.time !== 'undefined') forceSeek(Number(data.time));
                    break;
                case 'setVolume':
                    if (typeof data.volume !== 'undefined') {
                        currentVolume = Math.max(0, Math.min(100, Number(data.volume)));
                        player.volume = currentVolume / 100;
                        sendDirectCommand('setVolume', [currentVolume]);
                    }
                    break;
                case 'mute':
                    desiredMuted = true;
                    player.muted = true;
                    sendDirectCommand('mute');
                    break;
                case 'unmute':
                    desiredMuted = false;
                    unlockAudioNow();
                    break;
                case 'stop':
                    userWantsPlayback = false;
                    clearLoadWatchdog();
                    try { player.pause(); } catch (e) {}
                    sendDirectCommand('stopVideo');
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        });
    </script>
</body>
</html>
