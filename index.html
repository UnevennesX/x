<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #rmExternalPlayer {
            width: 100% !important; height: 100% !important;
            max-width: none !important; margin: 0 !important;
            --media-font-family: inherit;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fa5252; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR DE REPRODUCCIÓN</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" load="eager" stream-type="on-demand" log-level="silent" crossorigin playsinline data-media-player tabindex="0" role="region" aria-label="Video Player">
            <media-provider keep-alive data-media-provider></media-provider>
        </media-player>
    </div>

    <script>
        try {
            Object.defineProperty(document, 'hidden', { get: () => false });
            Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        } catch (e) {}

        window.addEventListener('visibilitychange', (e) => {
            e.stopImmediatePropagation();
        }, true);

        const params = new URLSearchParams(window.location.search);
        const initialVid = params.get('v');
        const wantsAutoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t')) || 0;

        const player = document.getElementById('rmExternalPlayer');
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let currentVid = initialVid || null;
        let hasActiveError = false;
        let isReadyReported = false;
        let userWantsPlayback = wantsAutoplay;
        let isVidstackInitialized = false;
        let usingDirectYT = false;

        var loadWatchdogTimer = null;
        var isPlayingConfirmed = false;
        var LOAD_TIMEOUT_MS = 12000;

        const ERRORS_MAP = {
            150: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            101: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            100: 'El video fue eliminado o configurado como privado.',
            2: 'Identificador de video de YouTube no válido.',
            5: 'Error de decodificación en el reproductor HTML5.'
        };

        function log(msg) {
            console.log('[X-Player]', msg, 'vid=' + currentVid, 'err=' + hasActiveError, 'ready=' + isReadyReported, 'playing=' + isPlayingConfirmed, 'init=' + isVidstackInitialized);
        }

        function postToParent(data) {
            try {
                log('postToParent: ' + JSON.stringify(data));
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) { log('postToParent error: ' + e); }
        }

        function showSpinner() {
            if (!hasActiveError) spinner.classList.add('active');
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function clearLoadWatchdog() {
            if (loadWatchdogTimer) {
                clearTimeout(loadWatchdogTimer);
                loadWatchdogTimer = null;
            }
        }

        function startLoadWatchdog() {
            clearLoadWatchdog();
            log('startLoadWatchdog: timeout=' + LOAD_TIMEOUT_MS + 'ms');
            loadWatchdogTimer = setTimeout(function() {
                if (hasActiveError || isPlayingConfirmed) { log('watchdog: skipped (err=' + hasActiveError + ' playing=' + isPlayingConfirmed + ')'); return; }
                var detectedErr = detectVidstackError();
                log('watchdog FIRED: detectedErr=' + JSON.stringify(detectedErr));
                triggerError(detectedErr || 150);
            }, LOAD_TIMEOUT_MS);
        }

        function detectVidstackError() {
            try {
                if (player.error) {
                    var e = player.error;
                    return e.code || e.message || e;
                }
            } catch(ex) {}
            try {
                if (player.state && player.state.error) {
                    var e = player.state.error;
                    return e.code || e.message || e;
                }
            } catch(ex) {}
            return null;
        }

        function triggerError(code) {
            if (hasActiveError) { log('triggerError BLOCKED (already active): ' + code); return; }
            log('triggerError: ' + code);
            hasActiveError = true;
            isVidstackInitialized = false;
            clearLoadWatchdog();
            hideSpinner();
            videoCover.classList.remove('hidden');
            try { player.style.visibility = 'hidden'; } catch(e) {}

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
        }

        function clearError() {
            if (hasActiveError) log('clearError');
            hasActiveError = false;
            errorView.classList.remove('active');
            try { player.style.visibility = ''; } catch(e) {}
            clearLoadWatchdog();
        }

        function hideVidstackSpinner() {
            try {
                var els = player.querySelectorAll('media-loading-indicator, .vds-loading-indicator, .vds-loading-spinner, [data-media-loading-indicator]');
                for (var i = 0; i < els.length; i++) els[i].style.display = 'none';
                if (player.shadowRoot) {
                    var slEls = player.shadowRoot.querySelectorAll('media-loading-indicator, .vds-loading-indicator, .vds-loading-spinner, [data-media-loading-indicator]');
                    for (var j = 0; j < slEls.length; j++) slEls[j].style.display = 'none';
                }
                var provider = player.querySelector('media-provider');
                if (provider && provider.shadowRoot) {
                    var pvEls = provider.shadowRoot.querySelectorAll('media-loading-indicator, .vds-loading-indicator, .vds-loading-spinner');
                    for (var k = 0; k < pvEls.length; k++) pvEls[k].style.display = 'none';
                }
            } catch(e) {}
        }

        function markPlaybackStarted() {
            if (hasActiveError) { log('markPlaybackStarted BLOCKED (err)'); return; }
            log('markPlaybackStarted');
            isPlayingConfirmed = true;
            clearLoadWatchdog();
            hideSpinner();
            hideVidstackSpinner();
            videoCover.classList.add('hidden');
            clearError();

            postToParent({
                type: 'progress',
                time: Number(player.currentTime) || 0,
                duration: Number(player.duration) || 0,
                playing: true
            });

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
            }
        }

        function getActiveYouTubeIframe() {
            let frame = player.querySelector('iframe');
            if (!frame && player.shadowRoot) {
                frame = player.shadowRoot.querySelector('iframe');
            }
            if (!frame) {
                const provider = player.querySelector('media-provider');
                if (provider) {
                    frame = provider.querySelector('iframe') || (provider.shadowRoot && provider.shadowRoot.querySelector('iframe'));
                }
            }
            if (!frame) log('getActiveYouTubeIframe: NOT FOUND');
            return frame;
        }

        function sendDirectCommand(funcName, args) {
            try {
                const frame = getActiveYouTubeIframe();
                if (frame && frame.contentWindow) {
                    log('sendDirectCommand: ' + funcName + ' args=' + JSON.stringify(args));
                    frame.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: funcName,
                        args: args || []
                    }), '*');
                    return true;
                } else {
                    log('sendDirectCommand FAILED: no frame found');
                }
            } catch (e) { log('sendDirectCommand error: ' + e); }
            return false;
        }

        function safePlay() {
            if (!player || hasActiveError) { log('safePlay BLOCKED: player=' + !!player + ' err=' + hasActiveError); return; }
            log('safePlay: attempting play');
            userWantsPlayback = true;

            sendDirectCommand('playVideo');

            try {
                const prom = player.play();
                if (prom && typeof prom.catch === 'function') {
                    prom.catch((e) => { log('safePlay: player.play() rejected: ' + e); sendDirectCommand('playVideo'); });
                }
            } catch (e) {
                log('safePlay: player.play() threw: ' + e);
                sendDirectCommand('playVideo');
            }
        }

        function forceSeek(timeSec) {
            const target = Math.max(0, Number(timeSec) || 0);
            try { player.currentTime = target; } catch (e) {}
            sendDirectCommand('seekTo', [target, true]);
        }

        function loadVideoDirectly(vid, timeSec, autoplay) {
            log('loadVideoDirectly START: vid=' + vid + ' time=' + timeSec + ' autoplay=' + autoplay);
            currentVid = vid;
            clearError();
            isReadyReported = false;
            isPlayingConfirmed = false;
            usingDirectYT = false;
            userWantsPlayback = !!autoplay;
            showSpinner();
            videoCover.classList.remove('hidden');
            if (autoplay) startLoadWatchdog();

            const t = Number(timeSec) || 0;

            const iframe = getActiveYouTubeIframe();
            log('loadVideoDirectly: isVidstackInitialized=' + isVidstackInitialized + ' iframe=' + !!iframe);

            if (isVidstackInitialized && iframe) {
                log('loadVideoDirectly: using sendDirectCommand loadVideoById');
                usingDirectYT = true;
                sendDirectCommand('loadVideoById', [{
                    videoId: vid,
                    startSeconds: t
                }]);
                
                if (autoplay) {
                    sendDirectCommand('playVideo');
                    setTimeout(function() {
                        if (!isPlayingConfirmed && !hasActiveError) {
                            log('loadVideoDirectly: retry playVideo #1');
                            sendDirectCommand('playVideo');
                        }
                    }, 500);
                    setTimeout(function() {
                        if (!isPlayingConfirmed && !hasActiveError) {
                            log('loadVideoDirectly: retry playVideo #2');
                            sendDirectCommand('playVideo');
                        }
                    }, 1500);
                } else {
                    hideSpinner();
                }
                return;
            }

            log('loadVideoDirectly: setting player.src (fresh)');
            isVidstackInitialized = true;
            isPlayingConfirmed = false;
            usingDirectYT = false;
            player.src = 'youtube/' + vid;

            const onLoaded = () => {
                log('loadVideoDirectly: can-play fired');
                player.removeEventListener('can-play', onLoaded);
                if (t > 0) forceSeek(t);

                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
                isReadyReported = true;

                if (autoplay) safePlay();
                else hideSpinner();
            };
            player.addEventListener('can-play', onLoaded);
        }

        if (player) {
            if (initialVid) {
                log('Init: loading initialVid=' + initialVid);
                loadVideoDirectly(initialVid, startTime, wantsAutoplay);
            } else {
                log('Init: no initialVid, hiding spinner');
                hideSpinner();
            }

            player.addEventListener('playing', () => { log('EVENT: playing'); markPlaybackStarted(); });

            player.addEventListener('pause', () => {
                log('EVENT: pause userWants=' + userWantsPlayback + ' err=' + hasActiveError + ' directYT=' + usingDirectYT);
                if (usingDirectYT) return;
                if (userWantsPlayback && !hasActiveError) {
                    sendDirectCommand('playVideo');
                    setTimeout(() => {
                        if (userWantsPlayback && player.paused && !usingDirectYT) {
                            safePlay();
                        }
                    }, 80);
                }
            });

            player.addEventListener('time-update', () => {
                if (player.currentTime > 0) hideSpinner();
                var dur = Number(player.duration) || 0;
                var isPlaying = usingDirectYT ? !hasActiveError && userWantsPlayback : !player.paused;
                if (usingDirectYT) {
                    hideVidstackSpinner();
                    if (dur === 0) {
                        try {
                            var frame = getActiveYouTubeIframe();
                            if (frame && frame.contentWindow) {
                                frame.contentWindow.postMessage(JSON.stringify({event:'command',func:'getDuration',args:[]}), '*');
                            }
                        } catch(e) {}
                    }
                }
                postToParent({
                    type: 'progress',
                    time: Number(player.currentTime) || 0,
                    duration: dur,
                    playing: isPlaying
                });
            });

            player.addEventListener('loaded-metadata', () => {
                const dur = Number(player.duration) || 0;
                log('EVENT: loaded-metadata dur=' + dur);
                if (dur > 0) postToParent({ type: 'duration', duration: dur });
            });

            player.addEventListener('ended', () => {
                log('EVENT: ended');
                userWantsPlayback = false;
                postToParent({ type: 'ended' });
            });

            player.addEventListener('error', (ev) => {
                const detail = ev && ev.detail;
                const code = detail && (detail.code || 0);
                log('EVENT: error code=' + code + ' detail=' + JSON.stringify(detail));
                if (code >= 4 || code === 0) {
                    const err = (detail && (detail.message || detail.error)) || 'Playback Error';
                    triggerError(err);
                }
            });
        }

        // BUBBLE: comandos de Voice-Eva + YouTube state change
        window.addEventListener('message', (ev) => {
            if (typeof ev.data === 'string') {
                if (ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        log('YT onError: ' + JSON.stringify(ytData));
                        if (ytData.event === 'onError' && ytData.info) triggerError(ytData.info);
                    } catch (e) {}
                }
                if (ev.data.includes('onStateChange')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        log('YT onStateChange: info=' + ytData.info);
                        if (ytData.info === 1 || ytData.info === 3) markPlaybackStarted();
                        if (ytData.info === 2 && userWantsPlayback && !hasActiveError) {
                            sendDirectCommand('playVideo');
                        }
                    } catch (e) {}
                }
                if (ev.data.includes('infoDelivery')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.info && typeof ytData.info.duration === 'number' && ytData.info.duration > 0) {
                            log('YT infoDelivery: duration=' + ytData.info.duration);
                            postToParent({ type: 'duration', duration: ytData.info.duration });
                        }
                    } catch (e) {}
                }
                return;
            }

            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            const action = data.cmd || data.type;
            log('CMD received: ' + action + ' vid=' + data.videoId);

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;

                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    if (!hasActiveError) {
                        if (usingDirectYT) {
                            sendDirectCommand('playVideo');
                        } else {
                            safePlay();
                        }
                    }
                    break;

                case 'pause':
                    userWantsPlayback = false;
                    try { player.pause(); } catch (e) {}
                    sendDirectCommand('pauseVideo');
                    hideSpinner();
                    break;

                case 'seek':
                    if (typeof data.time !== 'undefined') {
                        forceSeek(Number(data.time));
                    }
                    break;

                case 'setVolume':
                    if (typeof data.volume !== 'undefined') {
                        const v = Math.max(0, Math.min(100, Number(data.volume)));
                        player.volume = v / 100;
                        sendDirectCommand('setVolume', [v]);
                    }
                    break;

                case 'mute':
                    player.muted = true;
                    sendDirectCommand('mute');
                    break;

                case 'unmute':
                    player.muted = false;
                    sendDirectCommand('unMute');
                    break;

                case 'stop':
                    userWantsPlayback = false;
                    isPlayingConfirmed = false;
                    isVidstackInitialized = false;
                    usingDirectYT = false;
                    clearLoadWatchdog();
                    try {
                        player.pause();
                    } catch (e) {}
                    sendDirectCommand('stopVideo');
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        });

        // CAPTURE PHASE: interceptar errores de YouTube ANTES de que Vidstack los consuma
        window.addEventListener('message', function(ev) {
            if (hasActiveError) return;
            if (typeof ev.data !== 'string') return;
            if (ev.data.indexOf('onError') === -1) return;
            try {
                var ytData = JSON.parse(ev.data);
                log('CAPTURE onError: ' + JSON.stringify(ytData));
                if (ytData.event === 'onError' && ytData.info) {
                    triggerError(ytData.info);
                }
            } catch (e) {}
        }, true);
    </script>
</body>
</html>
