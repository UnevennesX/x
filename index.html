<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <!-- Vidstack Web Components -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@vidstack/cdn@latest/player.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #playerHost,
    media-player,
    media-provider {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow: hidden;
      background: #000;
    }

    #playerHost {
      position: fixed;
      inset: 0;
      background: #000;
    }

    media-player,
    media-provider {
      display: block;
      max-width: none !important;
      max-height: none !important;
      background: #000;
    }

    /*
     * El proveedor de YouTube utiliza un iframe.
     * Estas reglas intentan cubrir completamente el contenedor.
     */
    media-provider iframe,
    media-provider video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      object-fit: cover !important;
    }
  </style>
</head>

<body>
  <div id="playerHost">
    <media-player
      id="player"
      view-type="video"
      stream-type="on-demand"
      log-level="warn"
      crossorigin
      playsinline
      title="Voice Eva"
    >
      <!-- Sin media-video-layout: no hay interfaz ni controles -->
      <media-provider></media-provider>
    </media-player>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const initialVideoId = params.get("v");
    const initialAutoplay = params.get("autoplay") === "1";
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const player = document.getElementById("player");

    let currentVideoId = "";
    let shouldAutoplay = false;
    let pendingTime = 0;
    let endedReported = false;

    function postParent(message) {
      try {
        window.parent.postMessage(message, "*");
      } catch {}
    }

    function playSafely() {
      if (!player) return;

      try {
        const promise = player.play();

        if (promise?.catch) {
          promise.catch(() => {
            /*
             * Los navegadores pueden bloquear el autoplay con sonido.
             * No se activa mute automáticamente porque se solicitó sin mute.
             */
            postParent({
              source: "x-player",
              type: "autoplay-blocked",
              videoId: currentVideoId
            });
          });
        }
      } catch {}
    }

    function seek(time) {
      const value = Number(time);

      if (!Number.isFinite(value) || value < 0) return;

      try {
        player.currentTime = value;
      } catch {}
    }

    function loadVideo(videoId, autoplay = false, time = 0) {
      if (!player || !videoId) return;

      currentVideoId = String(videoId).trim();
      shouldAutoplay = Boolean(autoplay);
      pendingTime = Math.max(0, Number(time) || 0);
      endedReported = false;

      /*
       * Formato oficial del proveedor YouTube de Vidstack.
       */
      player.src = `youtube/${currentVideoId}`;
      player.title = currentVideoId;

      /*
       * No se usa muted. El navegador decidirá si permite
       * autoplay con sonido.
       */
      player.muted = false;

      if (shouldAutoplay) {
        player.setAttribute("autoplay", "");
      } else {
        player.removeAttribute("autoplay");
      }
    }

    function handleParentMessage(event) {
      const data = event?.data;

      if (!data || data.source !== "voice-eva") return;

      switch (data.type) {
        case "load":
          loadVideo(
            data.videoId,
            Boolean(data.autoplay),
            Number(data.time) || 0
          );
          break;

        case "play":
          playSafely();
          break;

        case "pause":
          try {
            player.pause();
          } catch {}
          break;

        case "seek":
          seek(data.time);
          break;

        case "stop":
          try {
            player.pause();
            player.currentTime = 0;
            endedReported = false;
          } catch {}
          break;

        case "mute":
          try {
            player.muted = true;
          } catch {}
          break;

        case "unmute":
          try {
            player.muted = false;
          } catch {}
          break;

        case "setVolume": {
          const volume = Number(data.volume);

          if (Number.isFinite(volume)) {
            try {
              player.volume = Math.min(1, Math.max(0, volume / 100));
            } catch {}
          }
          break;
        }
      }
    }

    player.addEventListener("can-play", () => {
      if (pendingTime > 0) {
        seek(pendingTime);
        pendingTime = 0;
      }

      postParent({
        source: "x-player",
        type: "ready",
        videoId: currentVideoId
      });

      if (shouldAutoplay) {
        playSafely();
      }
    });

    player.addEventListener("time-update", () => {
      postParent({
        source: "x-player",
        type: "time-update",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0,
        duration: Number(player.duration) || 0
      });
    });

    player.addEventListener("play", () => {
      endedReported = false;

      postParent({
        source: "x-player",
        type: "state",
        state: "playing",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("pause", () => {
      postParent({
        source: "x-player",
        type: "state",
        state: "paused",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("ended", () => {
      if (endedReported) return;

      endedReported = true;

      postParent({
        source: "x-player",
        type: "ended",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("error", (event) => {
      postParent({
        source: "x-player",
        type: "error",
        videoId: currentVideoId,
        message: event?.detail?.message || "No se pudo reproducir el video."
      });
    });

    window.addEventListener("message", handleParentMessage);

    /*
     * No existe video predeterminado.
     * Solo carga cuando la URL contiene ?v=VIDEO_ID.
     */
    if (initialVideoId) {
      loadVideo(initialVideoId, initialAutoplay, initialTime);
    }
  </script>
</body>
</html>
