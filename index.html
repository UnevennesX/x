<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <!-- Tema por defecto de Vidstack + layout de video -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/vidstack@latest/styles/default/theme.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/vidstack@latest/styles/default/layouts/video.css"
  />

  <!-- Runtime de Vidstack (web components) -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@vidstack/cdn@latest/player.js"
  ></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* El reproductor ocupa toda la ventana */
    media-player {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      display: block;
      background: #000;

      /* Colores del layout default */
      --media-brand: #ffffff;
      --media-focus-ring: rgba(255, 255, 255, 0.3);
      --media-controls-color: #ffffff;
    }

    media-provider {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #000;
    }

    /* Que el iframe de YouTube llene el contenedor */
    media-provider iframe,
    media-provider video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }

    /* Aviso opcional cuando el autoplay arranca muteado */
    #soundHint {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 14px;
      color: #fff;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #soundHint.show { opacity: 1; }

    /* Mensaje si falta ?v= */
    #msg {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #msg.show { display: grid; }
  </style>
</head>

<body>
  <div id="stage">
    <media-player
      id="player"
      view-type="video"
      stream-type="on-demand"
      log-level="warn"
      crossorigin
      playsinline
      title="Voice Eva"
    >
      <media-provider></media-provider>

      <!-- Interfaz completa: controles, botones, tiempo, volumen, fullscreen, menú -->
      <media-video-layout></media-video-layout>
    </media-player>

    <div id="soundHint">Toca para activar el sonido</div>
    <div id="msg">
      Falta el parámetro <code>?v=VIDEO_ID</code> en la URL.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialVideoId = (params.get("v") || "").trim();
    const initialAutoplay = params.get("autoplay") === "1";
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const player = document.getElementById("player");
    const soundHint = document.getElementById("soundHint");
    const msg = document.getElementById("msg");

    let currentVideoId = "";
    let wantsAutoplay = false;
    let pendingSeek = 0;
    let endedReported = false;
    let soundUnlocked = false;

    function post(m) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, m),
          "*"
        );
      } catch {}
    }

    function safePlay() {
      try {
        const p = player.play();
        if (p?.catch) p.catch(() => {});
      } catch {}
    }

    function showHint() { soundHint.classList.add("show"); }
    function hideHint() { soundHint.classList.remove("show"); }

    function unlockSound() {
      if (soundUnlocked) return;
      soundUnlocked = true;
      try {
        player.muted = false;
        if (player.volume === 0) player.volume = 1;
      } catch {}
      safePlay();
      hideHint();
      window.removeEventListener("pointerdown", unlockSound);
      window.removeEventListener("keydown", unlockSound);
      window.removeEventListener("touchstart", unlockSound);
    }

    function armUnlockOnFirstInteraction() {
      window.addEventListener("pointerdown", unlockSound, { passive: true });
      window.addEventListener("keydown", unlockSound);
      window.addEventListener("touchstart", unlockSound, { passive: true });
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      currentVideoId = String(id).trim();
      wantsAutoplay = !!autoplay;
      pendingSeek = Math.max(0, Number(time) || 0);
      endedReported = false;
      soundUnlocked = false;

      // Formato del proveedor YouTube de Vidstack
      player.src = `youtube/${currentVideoId}`;
      player.title = currentVideoId;

      if (wantsAutoplay) player.setAttribute("autoplay", "");
      else player.removeAttribute("autoplay");
    }

    // Eventos del reproductor
    player.addEventListener("can-play", () => {
      if (pendingSeek > 0) {
        try { player.currentTime = pendingSeek; } catch {}
        pendingSeek = 0;
      }

      post({ type: "ready", videoId: currentVideoId });

      if (wantsAutoplay) {
        // Intento con sonido
        try { player.muted = false; } catch {}
        try {
          const p = player.play();
          if (p?.then) {
            p.then(() => {
              soundUnlocked = true;
              hideHint();
            }).catch(() => {
              // Bloqueado: arranca muteado y desbloquea al primer toque
              try { player.muted = true; } catch {}
              safePlay();
              showHint();
              armUnlockOnFirstInteraction();
            });
          }
        } catch {
          try { player.muted = true; } catch {}
          safePlay();
          showHint();
          armUnlockOnFirstInteraction();
        }
      }
    });

    player.addEventListener("time-update", () => {
      post({
        type: "time-update",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0,
        duration: Number(player.duration) || 0
      });
    });

    player.addEventListener("play", () => {
      endedReported = false;
      post({
        type: "state",
        state: "playing",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("pause", () => {
      post({
        type: "state",
        state: "paused",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("ended", () => {
      if (endedReported) return;
      endedReported = true;
      post({
        type: "ended",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("error", (e) => {
      post({
        type: "error",
        videoId: currentVideoId,
        message: e?.detail?.message || "Error al reproducir."
      });
    });

    // Control desde la página padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva") return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, !!data.autoplay, Number(data.time) || 0);
          break;
        case "play":
          safePlay();
          break;
        case "pause":
          try { player.pause(); } catch {}
          break;
        case "stop":
          try {
            player.pause();
            player.currentTime = 0;
            endedReported = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time))) {
            try { player.currentTime = Number(data.time); } catch {}
          }
          break;
        case "mute":
          try { player.muted = true; } catch {}
          break;
        case "unmute":
          try { player.muted = false; } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v)) {
            try {
              player.volume = Math.min(1, Math.max(0, v / 100));
            } catch {}
          }
          break;
        }
      }
    });

    // Inicio
    if (initialVideoId) {
      loadVideo(initialVideoId, initialAutoplay, initialTime);
    } else {
      msg.classList.add("show");
    }
  </script>
</body>
</html>
