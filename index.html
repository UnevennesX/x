<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Engine</title>
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #playerHost {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; display: flex; align-items: center; justify-content: center;
        }
        #rmExternalPlayer {
            width: 100% !important; height: 100% !important; border: 0;
        }
        .spinner {
            position: absolute; width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.7s linear infinite; display: none; z-index: 20;
        }
        .spinner.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="loadingSpinner" class="spinner active"></div>
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" playsinline crossorigin>
            <media-provider></media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t')) || 0;

        const player = document.getElementById('rmExternalPlayer');
        const spinner = document.getElementById('loadingSpinner');

        function post(msg) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player' }, msg), '*');
            } catch (e) {}
        }

        if (player && videoId) {
            player.src = 'youtube/' + videoId;
            player.currentTime = startTime;

            player.addEventListener('can-play', () => {
                spinner.classList.remove('active');
                post({ type: 'canplay', duration: player.duration });
                if (autoplay) {
                    player.play().catch(() => {
                        console.warn('[Vidstack] Autoplay interceptado por política de usuario.');
                    });
                }
            });

            player.addEventListener('loaded-metadata', () => {
                if (player.duration > 0) {
                    post({ type: 'duration', duration: player.duration });
                }
            });

            player.addEventListener('time-update', () => {
                post({
                    type: 'progress',
                    time: player.currentTime,
                    duration: player.duration
                });
            });

            player.addEventListener('ended', () => {
                post({ type: 'ended' });
            });

            player.addEventListener('error', (err) => {
                spinner.classList.remove('active');
                post({ type: 'error', error: err.detail || 'Playback Error' });
            });
        }

        // Receptor de Comandos
        window.addEventListener('message', (ev) => {
            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            switch (data.type) {
                case 'play':
                    player.play().catch(() => {});
                    break;
                case 'pause':
                    player.pause();
                    break;
                case 'seek':
                    if (Number.isFinite(data.time)) {
                        player.currentTime = Math.max(0, Number(data.time));
                    }
                    break;
                case 'setVolume':
                    if (Number.isFinite(data.volume)) {
                        player.volume = Math.max(0, Math.min(1, data.volume / 100));
                    }
                    break;
                case 'mute':
                    player.muted = true;
                    break;
                case 'unmute':
                    player.muted = false;
                    break;
                case 'stop':
                    player.pause();
                    player.src = '';
                    break;
            }
        });
    </script>
</body>
</html>
