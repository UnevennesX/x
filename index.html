<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    <script type="module" src="https://cdn.vidstack.io/icons"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin="true">
    <link rel="preconnect" href="https://static.doubleclick.net" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "YouTube Sans", "Roboto", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            color: #f1f1f1;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            width: 100% !important;
            height: 100% !important;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            position: absolute;
            inset: 0;
            visibility: hidden !important;
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }

        #rmExternalPlayer.vds-visible {
            visibility: visible !important;
            opacity: 1;
        }

        /* Cortina de carga inicial */
        .rm-curtain {
            position: absolute;
            inset: 0;
            z-index: 90;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .rm-curtain.hidden {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .rm-spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #4c6ef5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Barra de Progreso Integrada */
        .rm-native-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 80;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 1rem 0.65rem;
            color: #b0b0b0;
            font-size: 0.72rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.88));
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        #playerHost:hover .rm-native-progress,
        #playerHost.show-controls .rm-native-progress {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .rm-native-slider {
            width: 100%;
            height: 5px;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
            outline: none;
            cursor: pointer;
            accent-color: #4c6ef5;
        }

        .rm-native-slider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4c6ef5;
            border: 2px solid #2346b8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .rm-native-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4c6ef5;
            border: 2px solid #2346b8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .rm-native-slider:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Capa de Error */
        .rm-error-layer {
            position: absolute;
            inset: 0;
            z-index: 100;
            background-color: #121212;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .rm-error-layer.active {
            display: flex !important;
        }

        .rm-yt-error-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 460px;
            width: 100%;
            gap: 14px;
        }

        .rm-yt-icon {
            width: 52px;
            height: 52px;
            color: #e03131;
            margin-bottom: 2px;
        }

        .rm-yt-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            width: 100%;
        }

        .rm-yt-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f1f1;
            line-height: 1.25;
        }

        .rm-yt-reason {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #aaaaaa;
            max-width: 360px;
        }

        .rm-yt-countdown-msg {
            margin-top: 10px;
            font-size: 0.84rem;
            color: #888888;
        }

        .rm-yt-countdown-msg strong {
            color: #f1f1f1;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="rmCurtain" class="rm-curtain">
            <div class="rm-spinner"></div>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="warn" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" data-orientation="landscape">
            <media-provider></media-provider>
        </media-player>

        <div class="rm-native-progress" id="rmNativeProgress">
            <span id="rmCurTime">--:--</span>
            <input type="range" id="rmProgressSlider" class="rm-native-slider" min="0" max="100" step="0.1" value="0" disabled>
            <span id="rmDurTime">--:--</span>
        </div>

        <div id="rmErrorOverlay" class="rm-error-layer">
            <div class="rm-yt-error-box">
                <svg class="rm-yt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>

                <div class="rm-yt-details">
                    <h2 class="rm-yt-title" id="rmErrorTitle">Video no disponible</h2>
                    <p class="rm-yt-reason" id="rmErrorReason">Este video tiene restricción de derechos de autor o inserción bloqueada.</p>
                    <p class="rm-yt-countdown-msg" id="rmCountdownBox">
                        Saltando video en <strong id="rmCountdownNumber">3</strong> s...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = parseFloat(params.get('t')) || 0;

        const host = document.getElementById('playerHost');
        const player = document.getElementById('rmExternalPlayer');
        const curtain = document.getElementById('rmCurtain');

        const curTimeEl = document.getElementById('rmCurTime');
        const durTimeEl = document.getElementById('rmDurTime');
        const progressSlider = document.getElementById('rmProgressSlider');

        const errorOverlay = document.getElementById('rmErrorOverlay');
        const errorTitle = document.getElementById('rmErrorTitle');
        const errorReason = document.getElementById('rmErrorReason');
        const countdownNumber = document.getElementById('rmCountdownNumber');

        let countdownTimer = null;
        let countdownSec = 3;
        let currentVid = videoId || null;
        let shouldAutoplay = autoplay === '1';
        let isFatalError = false;
        let endedReported = false;
        let reportedReady = false;
        let isDraggingProgress = false;
        let hideControlsTimer = null;
        let loadWatchdogTimer = null;
        let lastReportedTime = 0;
        let pendingStartTime = startTime;

        function fmtDuration(sec) {
            sec = Math.max(0, Math.floor(Number(sec) || 0));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return (h ? h + ':' : '') + (m < 10 && h ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function showCurtain() {
            curtain.classList.remove('hidden');
            player.classList.remove('vds-visible');
        }

        function hideCurtain() {
            curtain.classList.add('hidden');
            player.classList.add('vds-visible');
        }

        function hideErrorOverlay() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            isFatalError = false;
            errorOverlay.classList.remove('active');
        }

        function clearLoadWatchdog() {
            if (loadWatchdogTimer) {
                clearTimeout(loadWatchdogTimer);
                loadWatchdogTimer = null;
            }
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownSec = 3;
            if (countdownNumber) countdownNumber.textContent = countdownSec;

            countdownTimer = setInterval(function () {
                countdownSec--;
                if (countdownNumber) countdownNumber.textContent = Math.max(0, countdownSec);
                if (countdownSec <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    skipVideo();
                }
            }, 1000);
        }

        function triggerFatalError(code) {
            if (isFatalError) return;
            isFatalError = true;

            player.classList.remove('vds-visible');
            curtain.classList.add('hidden');

            const num = Number(code);
            let reason = 'No se pudo reproducir este video en la sala.';
            if (num === 2) reason = 'El enlace o ID del video no es válido.';
            if (num === 100) reason = 'El video fue eliminado o es privado.';
            if (num === 101 || num === 150) reason = 'Este video tiene restricción de derechos de autor o inserción bloqueada.';

            errorTitle.textContent = 'Video no disponible';
            errorReason.textContent = reason;
            errorOverlay.classList.add('active');

            try { player.pause(); } catch (e) {}
            startCountdown();
        }

        function skipVideo() {
            hideErrorOverlay();
            postToParent({ type: 'skip_fatal', videoId: currentVid });
        }

        function onPlaybackSuccess() {
            if (isFatalError) return;
            clearLoadWatchdog();
            hideErrorOverlay();
            hideCurtain();

            if (!reportedReady) {
                reportedReady = true;
                postToParent({ type: 'ready', videoId: currentVid });
            }
        }

        function notifyEnded() {
            if (endedReported || isFatalError) return;
            endedReported = true;
            shouldAutoplay = false;
            postToParent({ type: 'ended', videoId: currentVid });
        }

        function updateProgressUI() {
            if (!player || isFatalError) return;
            const cur = Math.max(0, Number(player.currentTime) || 0);
            const dur = Math.max(0, Number(player.duration) || 0);

            if (dur > 0) {
                progressSlider.disabled = false;
                progressSlider.max = dur;
                if (!isDraggingProgress) {
                    progressSlider.value = cur;
                }
                curTimeEl.textContent = fmtDuration(cur);
                durTimeEl.textContent = fmtDuration(dur);
            } else {
                progressSlider.disabled = true;
                progressSlider.value = 0;
                curTimeEl.textContent = (cur > 0) ? fmtDuration(cur) : '--:--';
                durTimeEl.textContent = '--:--';
            }
        }

        function showControlsTemp() {
            host.classList.add('show-controls');
            if (hideControlsTimer) clearTimeout(hideControlsTimer);
            hideControlsTimer = setTimeout(function () {
                host.classList.remove('show-controls');
                hideControlsTimer = null;
            }, 1800);
        }

        host.addEventListener('mousemove', showControlsTemp);
        host.addEventListener('touchstart', showControlsTemp, { passive: true });

        progressSlider.addEventListener('input', function () {
            isDraggingProgress = true;
            curTimeEl.textContent = fmtDuration(this.value);
        });

        progressSlider.addEventListener('change', function () {
            const target = Number(this.value) || 0;
            if (player) {
                try { player.currentTime = target; } catch (e) {}
            }
            postToParent({ type: 'user_seek', videoId: currentVid, time: target });
            isDraggingProgress = false;
        });

        function safePlay() {
            if (!player || isFatalError) return;
            try {
                const playPromise = player.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(function () {
                        player.muted = true;
                        player.play().catch(function () {});
                    });
                }
            } catch (e) {}
        }

        function reportDuration() {
            if (!player) return;
            const d = player.duration;
            if (d && isFinite(d) && d > 0 && !isFatalError) {
                clearLoadWatchdog();
                updateProgressUI();
                postToParent({ type: 'duration', videoId: currentVid, duration: d });
            }
        }

        function initTrack(vid, auto, startAt) {
            currentVid = vid;
            shouldAutoplay = !!auto;
            pendingStartTime = Math.max(0, Number(startAt) || 0);
            endedReported = false;
            reportedReady = false;
            lastReportedTime = 0;
            isFatalError = false;

            hideErrorOverlay();
            showCurtain();
            updateProgressUI();

            player.src = 'youtube/' + vid;
            if (shouldAutoplay) {
                player.setAttribute('autoplay', '');
            } else {
                player.removeAttribute('autoplay');
            }

            const attemptStart = function () {
                if (pendingStartTime > 0) {
                    try { player.currentTime = pendingStartTime; } catch (e) {}
                }
                reportDuration();
                if (shouldAutoplay) safePlay();
            };

            player.addEventListener('loadedmetadata', attemptStart, { once: true });
            player.addEventListener('can-play', attemptStart, { once: true });
            setTimeout(attemptStart, 800);

            clearLoadWatchdog();
            loadWatchdogTimer = setTimeout(function () {
                if (!isFatalError && currentVid === vid && (!player.duration || player.duration <= 0) && player.currentTime <= 0.05) {
                    triggerFatalError(100);
                }
            }, 5000);
        }

        // Vigilante continuo de fin de pista (evita quedarse trabado en 4:11 / 4:11)
        setInterval(function () {
            if (endedReported || isFatalError || !player) return;
            const cur = player.currentTime;
            const dur = player.duration;
            if (dur && dur > 3 && cur >= (dur - 0.75)) {
                notifyEnded();
            }
        }, 400);

        // Intercepción de mensajes del IFrame de YouTube
        window.addEventListener('message', function (ev) {
            try {
                let data = ev.data;
                if (typeof data === 'string') data = JSON.parse(data);
                if (!data) return;

                if (data.event === 'onStateChange') {
                    if (data.info === 1 || data.data === 1) onPlaybackSuccess();
                    else if (data.info === 0 || data.data === 0) notifyEnded();
                } else if (data.event === 'infoDelivery' && data.info) {
                    if (data.info.playerState === 1) onPlaybackSuccess();
                    else if (data.info.playerState === 0) notifyEnded();
                } else if (data.event === 'onError') {
                    triggerFatalError(data.info || (data.data && data.data.code) || 150);
                }
            } catch (err) {}
        });

        if (player) {
            if (videoId) {
                initTrack(videoId, autoplay === '1', startTime);
            }

            player.addEventListener('time-update', function () {
                if (player.currentTime > 0.05 && !isFatalError) {
                    onPlaybackSuccess();
                    updateProgressUI();

                    const nowSec = player.currentTime;
                    if (Math.abs(nowSec - lastReportedTime) >= 2) {
                        lastReportedTime = nowSec;
                        postToParent({
                            type: 'time',
                            videoId: currentVid,
                            time: nowSec,
                            duration: player.duration || 0,
                            paused: player.paused
                        });
                    }
                }
            });

            player.addEventListener('playing', function () {
                if (!isFatalError) onPlaybackSuccess();
            });

            player.addEventListener('error', function (ev) {
                const detail = ev.detail || ev;
                let ytCode = 150;
                if (detail) {
                    if (typeof detail.code === 'number') ytCode = detail.code;
                    else if (typeof detail.data === 'number') ytCode = detail.data;
                    else if (detail.cause && typeof detail.cause.data === 'number') ytCode = detail.cause.data;
                }
                triggerFatalError(ytCode);
            });

            ['ended', 'vds-ended'].forEach(function(evtName) {
                player.addEventListener(evtName, notifyEnded);
            });

            player.addEventListener('durationchange', reportDuration);
            player.addEventListener('duration-change', reportDuration);
            player.addEventListener('loadedmetadata', reportDuration);
            player.addEventListener('can-play', reportDuration);

            window.addEventListener('message', function (ev) {
                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                initTrack(data.videoId, !!data.autoplay, data.time);
                            }
                            break;

                        case 'play':
                            if (!isFatalError) {
                                shouldAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                            if (!isFatalError) {
                                shouldAutoplay = false;
                                try { player.pause(); } catch (e) {}
                            }
                            break;
                        case 'seek':
                            if (!isFatalError) {
                                const targetTime = Math.max(0, Number(data.time) || 0);
                                if (Math.abs(player.currentTime - targetTime) > 4.0) {
                                    player.currentTime = targetTime;
                                    updateProgressUI();
                                }
                            }
                            break;
                        case 'stop':
                            hideErrorOverlay();
                            showCurtain();
                            shouldAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            player.currentTime = 0;
                            updateProgressUI();
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
