<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #rmExternalPlayer {
            width: 100% !important; height: 100% !important;
            max-width: none !important; margin: 0 !important;
            --media-font-family: inherit;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fa5252; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR DE REPRODUCCIÓN</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" load="eager" stream-type="on-demand" log-level="silent" crossorigin playsinline data-media-player tabindex="0" role="region" aria-label="Video Player">
            <media-provider keep-alive data-media-provider></media-provider>
        </media-player>
    </div>

    <script>
        try {
            Object.defineProperty(document, 'hidden', { get: () => false });
            Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        } catch (e) {}

        window.addEventListener('visibilitychange', (e) => {
            e.stopImmediatePropagation();
        }, true);

        const params = new URLSearchParams(window.location.search);
        const initialVid = params.get('v');
        const wantsAutoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t')) || 0;

        const player = document.getElementById('rmExternalPlayer');
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let currentVid = initialVid || null;
        let hasActiveError = false;
        let isReadyReported = false;
        let isPlayingConfirmed = false;
        let userWantsPlayback = wantsAutoplay;
        let isVidstackInitialized = false;

        // VARIABLES DEL AUTO-REFRESCO
        let autoReloadTimer = null;
        let reloadAttempts = 0;
        const MAX_RELOAD_ATTEMPTS = 3;

        const ERRORS_MAP = {
            150: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            101: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            100: 'El video fue eliminado o configurado como privado.',
            2: 'Identificador de video de YouTube no válido.',
            5: 'Error de decodificación en el reproductor HTML5.'
        };

        function log(msg) {
            console.log('[X-Player]', msg);
        }

        function postToParent(data) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) {}
        }

        function showSpinner() {
            if (!hasActiveError) spinner.classList.add('active');
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            clearAutoReloadWatcher();
            hideSpinner();
            videoCover.classList.remove('hidden');

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
        }

        function clearError() {
            hasActiveError = false;
            errorView.classList.remove('active');
            clearAutoReloadWatcher();
        }

        // ==============================================================
        // MECANISMO DE AUTO-REFRESCO (EL F5 INTERNO AUTOMÁTICO)
        // ==============================================================
        function startAutoReloadWatcher(vid, timeSec) {
            clearAutoReloadWatcher();

            autoReloadTimer = setTimeout(() => {
                // Si el video ya está sonando o hay error, no hacemos nada
                if (isPlayingConfirmed || hasActiveError) return;

                if (reloadAttempts < MAX_RELOAD_ATTEMPTS) {
                    reloadAttempts++;
                    log(`[Auto-Refresco] Video trabado en el spinner. Aplicando F5 interno (Intento ${reloadAttempts}/${MAX_RELOAD_ATTEMPTS})...`);

                    const iframe = getActiveYouTubeIframe();
                    if (iframe) {
                        // Forzamos la recarga del stream de YouTube
                        sendDirectCommand('loadVideoById', [vid, Number(timeSec) || 0]);
                        sendDirectCommand('playVideo');
                    } else {
                        player.src = '';
                        setTimeout(() => {
                            player.src = 'youtube/' + vid;
                            safePlay();
                        }, 50);
                    }
                    safePlay();

                    // Vuelve a vigilar por si necesita otro empujón
                    startAutoReloadWatcher(vid, timeSec);
                } else {
                    log('[Auto-Refresco] Se agotaron los reintentos. Mostrando error real.');
                    triggerError(150);
                }
            }, 2500); // Espera 2.5 segundos antes de forzar el refresco interno
        }

        function clearAutoReloadWatcher() {
            if (autoReloadTimer) {
                clearTimeout(autoReloadTimer);
                autoReloadTimer = null;
            }
        }

        function markPlaybackStarted() {
            if (hasActiveError) return;
            log('markPlaybackStarted: Video reproduciéndose correctamente.');
            isPlayingConfirmed = true;
            clearAutoReloadWatcher();
            reloadAttempts = 0;

            hideSpinner();
            videoCover.classList.add('hidden'); // Quita la pantalla negra
            clearError();

            if (!isReadyReported) {
                isReadyReported = true;
                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
            }
        }

        function getActiveYouTubeIframe() {
            let frame = player.querySelector('iframe');
            if (!frame && player.shadowRoot) {
                frame = player.shadowRoot.querySelector('iframe');
            }
            if (!frame) {
                const provider = player.querySelector('media-provider');
                if (provider) {
                    frame = provider.querySelector('iframe') || (provider.shadowRoot && provider.shadowRoot.querySelector('iframe'));
                }
            }
            return frame;
        }

        function sendDirectCommand(funcName, args) {
            try {
                const frame = getActiveYouTubeIframe();
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: funcName,
                        args: args || []
                    }), '*');
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            userWantsPlayback = true;

            sendDirectCommand('playVideo');

            try {
                const prom = player.play();
                if (prom && typeof prom.catch === 'function') {
                    prom.catch(() => {
                        sendDirectCommand('playVideo');
                    });
                }
            } catch (e) {
                sendDirectCommand('playVideo');
            }
        }

        function forceSeek(timeSec) {
            const target = Math.max(0, Number(timeSec) || 0);
            try { player.currentTime = target; } catch (e) {}
            sendDirectCommand('seekTo', [target, true]);
        }

        function loadVideoDirectly(vid, timeSec, autoplay) {
            currentVid = vid;
            clearError();
            isPlayingConfirmed = false;
            isReadyReported = false;
            userWantsPlayback = !!autoplay;
            reloadAttempts = 0;
            
            showSpinner();
            videoCover.classList.remove('hidden');

            const t = Number(timeSec) || 0;

            // Iniciamos la vigilancia del Auto-Refresco
            if (autoplay) {
                startAutoReloadWatcher(vid, t);
            } else {
                clearAutoReloadWatcher();
            }

            const iframe = getActiveYouTubeIframe();
            if (isVidstackInitialized && iframe) {
                sendDirectCommand('loadVideoById', [vid, t]);
                
                if (autoplay) {
                    safePlay();
                } else {
                    hideSpinner();
                }
                return;
            }

            isVidstackInitialized = true;
            player.src = 'youtube/' + vid;

            const onLoaded = () => {
                player.removeEventListener('can-play', onLoaded);
                if (t > 0) forceSeek(t);

                postToParent({
                    type: 'ready',
                    duration: Number(player.duration) || 0,
                    time: Number(player.currentTime) || 0
                });
                isReadyReported = true;

                if (autoplay) safePlay();
                else hideSpinner();
            };
            player.addEventListener('can-play', onLoaded);
        }

        if (player) {
            if (initialVid) {
                loadVideoDirectly(initialVid, startTime, wantsAutoplay);
            } else {
                hideSpinner();
            }

            // Solo destapamos la pantalla cuando REALMENTE esté corriendo el video
            player.addEventListener('playing', markPlaybackStarted);

            player.addEventListener('pause', () => {
                if (userWantsPlayback && !hasActiveError && isReadyReported) {
                    sendDirectCommand('playVideo');
                }
            });

            player.addEventListener('time-update', () => {
                if (player.currentTime > 0) hideSpinner();
                postToParent({
                    type: 'progress',
                    time: Number(player.currentTime) || 0,
                    duration: Number(player.duration) || 0,
                    playing: !player.paused
                });
            });

            player.addEventListener('loaded-metadata', () => {
                const dur = Number(player.duration) || 0;
                if (dur > 0) postToParent({ type: 'duration', duration: dur });
            });

            player.addEventListener('ended', () => {
                userWantsPlayback = false;
                postToParent({ type: 'ended' });
            });

            // Filtro para ignorar advertencias y promesas canceladas
            player.addEventListener('error', (ev) => {
                const detail = ev && ev.detail;
                if (!detail) return;
                
                const msg = String(detail.message || detail || '');
                const name = String(detail.name || '');

                if (name === 'AbortError' || msg.includes('interrupted') || msg.includes('The play() request')) return;
                if (name === 'NotAllowedError' || msg.includes('interact')) return;

                const code = detail.code || 0;
                if (code >= 4) {
                    const err = detail.message || detail.error || code || 'Playback Error';
                    triggerError(err);
                }
            });
        }

        window.addEventListener('message', (ev) => {
            if (typeof ev.data === 'string') {
                if (ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.event === 'onError' && typeof ytData.info !== 'undefined') {
                            const errCodeNum = Number(ytData.info);
                            if (errCodeNum === 150 || errCodeNum === 101 || errCodeNum === 100 || errCodeNum === 2 || errCodeNum === 5) {
                                triggerError(errCodeNum);
                            }
                        }
                    } catch (e) {}
                }
                if (ev.data.includes('onStateChange')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        // Estado 1 = PLAYING (reproduciendo con éxito)
                        if (ytData.info === 1) {
                            markPlaybackStarted();
                        }
                        if (ytData.info === 2 && userWantsPlayback && !hasActiveError && isReadyReported) {
                            sendDirectCommand('playVideo');
                        }
                    } catch (e) {}
                }
                return;
            }

            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            const action = data.cmd || data.type;

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;
                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    if (!hasActiveError) safePlay();
                    break;
                case 'pause':
                    userWantsPlayback = false;
                    clearAutoReloadWatcher();
                    try { player.pause(); } catch (e) {}
                    sendDirectCommand('pauseVideo');
                    hideSpinner();
                    break;
                case 'seek':
                    if (typeof data.time !== 'undefined') {
                        forceSeek(Number(data.time));
                    }
                    break;
                case 'setVolume':
                    if (typeof data.volume !== 'undefined') {
                        const v = Math.max(0, Math.min(100, Number(data.volume)));
                        player.volume = v / 100;
                        sendDirectCommand('setVolume', [v]);
                    }
                    break;
                case 'mute':
                    player.muted = true;
                    sendDirectCommand('mute');
                    break;
                case 'unmute':
                    player.muted = false;
                    sendDirectCommand('unMute');
                    break;
                case 'stop':
                    userWantsPlayback = false;
                    clearAutoReloadWatcher();
                    try { player.pause(); } catch (e) {}
                    sendDirectCommand('stopVideo');
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        });
    </script>
</body>
</html>
