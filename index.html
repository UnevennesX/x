<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <!-- Estilos de Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* El contenedor y reproductor llenan toda la pantalla */
    .plyr-container {
      width: 100%;
      height: 100%;
    }

    .plyr {
      width: 100% !important;
      height: 100% !important;
      background: #000;
      --plyr-color-main: #00b3ff; /* Color de acento / barra de progreso */
      --plyr-video-background: #000;
    }

    .plyr__video-wrapper {
      height: 100% !important;
    }

    .plyr iframe {
      pointer-events: none; /* Permite que los clics usen los controles de Plyr */
    }

    /* Aviso cuando el autoplay inicia muteado por políticas del navegador */
    #soundHint {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 14px;
      color: #fff;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(8px);
    }
    #soundHint.show {
      opacity: 1;
    }

    /* Mensaje si falta el parámetro ?v= */
    #msg {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #msg.show {
      display: grid;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div class="plyr-container" id="playerWrapper">
      <div id="player"></div>
    </div>

    <div id="soundHint">🔊 Toca para activar el sonido</div>
    <div id="msg">
      Falta el parámetro <code>?v=VIDEO_ID</code> en la URL.
    </div>
  </div>

  <!-- Librería Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialVideoId = (params.get("v") || "").trim();
    const initialAutoplay = params.get("autoplay") === "1";
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const soundHint = document.getElementById("soundHint");
    const msg = document.getElementById("msg");

    let player = null;
    let currentVideoId = "";
    let wantsAutoplay = false;
    let pendingSeek = 0;
    let endedReported = false;
    let soundUnlocked = false;

    function post(m) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, m),
          "*"
        );
      } catch {}
    }

    function showHint() { soundHint.classList.add("show"); }
    function hideHint() { soundHint.classList.remove("show"); }

    function safePlay() {
      if (!player) return;
      try {
        const p = player.play();
        if (p?.catch) p.catch(() => {});
      } catch {}
    }

    function unlockSound() {
      if (soundUnlocked || !player) return;
      soundUnlocked = true;
      try {
        player.muted = false;
        if (player.volume === 0) player.volume = 1;
      } catch {}
      safePlay();
      hideHint();
      window.removeEventListener("pointerdown", unlockSound);
      window.removeEventListener("keydown", unlockSound);
      window.removeEventListener("touchstart", unlockSound);
    }

    function armUnlockOnFirstInteraction() {
      window.addEventListener("pointerdown", unlockSound, { passive: true });
      window.addEventListener("keydown", unlockSound);
      window.addEventListener("touchstart", unlockSound, { passive: true });
    }

    function initPlyrInstance() {
      player = new Plyr("#player", {
        autoplay: wantsAutoplay,
        muted: false,
        hideControls: true,
        tooltips: { controls: true, seek: true },
        // Controles que incluyen selector de calidad, velocidad y ajustes
        controls: [
          'play-large',
          'restart',
          'rewind',
          'play',
          'fast-forward',
          'progress',
          'current-time',
          'duration',
          'mute',
          'volume',
          'captions',
          'settings',
          'pip',
          'airplay',
          'fullscreen'
        ],
        // El menú de ajustes incluye Quality (calidad), Speed y Captions
        settings: ['quality', 'speed', 'loop', 'captions'],
        quality: {
          default: 1080,
          options: [4320, 2160, 1440, 1080, 720, 576, 480, 360, 240]
        },
        speed: {
          selected: 1,
          options: [0.5, 0.75, 1, 1.25, 1.5, 2]
        },
        youtube: {
          noCookie: false,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          modestbranding: 1
        }
      });

      // Eventos de Plyr
      player.on("ready", () => {
        if (pendingSeek > 0) {
          try { player.currentTime = pendingSeek; } catch {}
          pendingSeek = 0;
        }

        post({ type: "ready", videoId: currentVideoId });

        if (wantsAutoplay) {
          try {
            const p = player.play();
            if (p?.then) {
              p.then(() => {
                soundUnlocked = true;
                hideHint();
              }).catch(() => {
                try { player.muted = true; } catch {}
                safePlay();
                showHint();
                armUnlockOnFirstInteraction();
              });
            }
          } catch {
            try { player.muted = true; } catch {}
            safePlay();
            showHint();
            armUnlockOnFirstInteraction();
          }
        }
      });

      player.on("timeupdate", () => {
        post({
          type: "time-update",
          videoId: currentVideoId,
          time: Number(player.currentTime) || 0,
          duration: Number(player.duration) || 0
        });
      });

      player.on("playing", () => {
        endedReported = false;
        post({
          type: "state",
          state: "playing",
          videoId: currentVideoId,
          time: Number(player.currentTime) || 0
        });
      });

      player.on("pause", () => {
        post({
          type: "state",
          state: "paused",
          videoId: currentVideoId,
          time: Number(player.currentTime) || 0
        });
      });

      player.on("ended", () => {
        if (endedReported) return;
        endedReported = true;
        post({
          type: "ended",
          videoId: currentVideoId,
          time: Number(player.currentTime) || 0
        });
      });

      player.on("error", (e) => {
        post({
          type: "error",
          videoId: currentVideoId,
          message: "Error al reproducir el video."
        });
      });
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      currentVideoId = String(id).trim();
      wantsAutoplay = !!autoplay;
      pendingSeek = Math.max(0, Number(time) || 0);
      endedReported = false;
      soundUnlocked = false;

      if (!player) {
        // Primera inicialización
        const playerEl = document.getElementById("player");
        playerEl.setAttribute("data-plyr-provider", "youtube");
        playerEl.setAttribute("data-plyr-embed-id", currentVideoId);
        initPlyrInstance();
      } else {
        // Cambio dinámico de video
        player.source = {
          type: 'video',
          sources: [
            {
              src: currentVideoId,
              provider: 'youtube'
            }
          ]
        };
      }
    }

    // Receptor de mensajes del contenedor padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva") return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, !!data.autoplay, Number(data.time) || 0);
          break;
        case "play":
          safePlay();
          break;
        case "pause":
          try { player?.pause(); } catch {}
          break;
        case "stop":
          try {
            if (player) {
              player.pause();
              player.currentTime = 0;
            }
            endedReported = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time)) && player) {
            try { player.currentTime = Number(data.time); } catch {}
          }
          break;
        case "mute":
          try { if (player) player.muted = true; } catch {}
          break;
        case "unmute":
          try { if (player) player.muted = false; } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v) && player) {
            try {
              player.volume = Math.min(1, Math.max(0, v / 100));
            } catch {}
          }
          break;
        }
      }
    });

    // Iniciar con los parámetros iniciales
    if (initialVideoId) {
      loadVideo(initialVideoId, initialAutoplay, initialTime);
    } else {
      msg.classList.add("show");
    }
  </script>
</body>
</html>
