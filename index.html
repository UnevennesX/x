<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            --media-font-family: inherit;
        }

        /* --- SI HAY ERROR: DESAPARECER CUALQUIER BARRA O CONTROL --- */
        #playerHost.is-error #rmExternalPlayer,
        #playerHost.is-error media-player,
        #playerHost.is-error media-controls,
        #playerHost.is-error .vds-time-slider,
        #playerHost.is-error .vds-controls,
        #playerHost.is-error .vds-slider,
        #playerHost.is-error [data-media-slider] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Telón negro protector: cubre YouTube mientras carga */
        .video-cover {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 10;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .video-cover.hidden {
            opacity: 0 !important;
        }

        /* --- Spinner Minimalista --- */
        .minimal-spinner {
            position: absolute;
            z-index: 50;
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .minimal-spinner.active {
            display: block !important;
            opacity: 1 !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Pantalla de Error (Ocupa el 100% con fondo negro sólido) --- */
        .minimal-error {
            position: absolute;
            inset: 0;
            z-index: 99999;
            background: #000000 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .minimal-error.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .error-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #777777;
            margin-bottom: 8px;
        }

        .error-msg {
            font-size: 14px;
            font-weight: 400;
            color: #e5e5e5;
            max-width: 340px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Telón negro protector -->
        <div id="videoCover" class="video-cover"></div>

        <!-- Spinner -->
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <!-- Pantalla de Error Absoluta -->
        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <!-- Reproductor Vidstack -->
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="silent" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <media-provider keep-alive="" data-media-provider="">
                <iframe id="ytIframe" tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = Number(params.get('t')) || 0;
        const playerHost = document.getElementById('playerHost');
        const player = document.getElementById('rmExternalPlayer');
        const ytIframe = document.getElementById('ytIframe');

        // Elementos UI
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        // Estados
        let hasActiveError = false;
        let isRealPlaybackActive = false;
        let currentVid = videoId || null;
        let lastExpectedAutoplay = autoplay === '1';
        let endedReported = false;
        let reportedReady = false;
        let autoPlayCheckInterval = null;

        const ERRORS_MAP = {
            150: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            101: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            100: 'El video no existe o fue configurado como privado.',
            2: 'El enlace o identificador de video no es válido.',
            5: 'Error de formato en el reproductor HTML5.'
        };

        function showSpinner() {
            if (!hasActiveError && !isRealPlaybackActive) {
                spinner.classList.add('active');
            }
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            isRealPlaybackActive = false;
            lastExpectedAutoplay = false;

            if (autoPlayCheckInterval) {
                clearInterval(autoPlayCheckInterval);
                autoPlayCheckInterval = null;
            }

            // Ocultar cualquier rastro del reproductor y barras
            playerHost.classList.add('is-error');
            videoCover.classList.remove('hidden');
            hideSpinner();

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'Error al reproducir el contenido.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR DE REPRODUCCIÓN';
            errText.textContent = msg;

            errorView.classList.add('active');

            try {
                if (player) {
                    player.pause();
                    player.currentTime = 0;
                    player.src = '';
                }
                if (ytIframe) ytIframe.src = 'about:blank';
            } catch (e) {}

            console.error(`[Player Error] Code: ${code} | Video: ${currentVid}`);
            postToParent({
                type: 'error',
                videoId: currentVid,
                code: code,
                message: msg,
                position: 0,
                isPlaying: false
            });
        }

        function triggerPlaybackStarted() {
            if (hasActiveError || isRealPlaybackActive) return;
            isRealPlaybackActive = true;
            
            playerHost.classList.remove('is-error');
            videoCover.classList.add('hidden');
            hideSpinner();
            errorView.classList.remove('active');

            if (!reportedReady) {
                reportedReady = true;
                postToParent({ type: 'ready', videoId: currentVid });
            }
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                showSpinner();
                videoCover.classList.remove('hidden');
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
                if (startTime > 0) {
                    const onInitialReady = function () {
                        player.removeEventListener('can-play', onInitialReady);
                        if (!hasActiveError) player.currentTime = startTime;
                    };
                    player.addEventListener('can-play', onInitialReady);
                }
            } else {
                hideSpinner();
            }

            // Eventos Vidstack
            player.addEventListener('playing', function() {
                if (hasActiveError) {
                    try { player.pause(); } catch(e) {}
                    return;
                }
                triggerPlaybackStarted();
            });

            player.addEventListener('time-update', function() {
                if (hasActiveError) {
                    try { player.pause(); player.currentTime = 0; } catch(e) {}
                    return;
                }
                if (!isRealPlaybackActive && player.currentTime > 0) {
                    triggerPlaybackStarted();
                }
            });

            player.addEventListener('waiting', function() {
                if (!hasActiveError && !isRealPlaybackActive) {
                    showSpinner();
                }
            });

            player.addEventListener('error', function(event) {
                const detail = event && event.detail;
                const err = (detail && (detail.code || detail.message || detail.error)) || 'Playback Error';
                triggerError(err);
            });

            player.addEventListener('ended', function () {
                if (!endedReported && !hasActiveError) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            autoPlayCheckInterval = setInterval(function () {
                if (hasActiveError || isRealPlaybackActive) {
                    clearInterval(autoPlayCheckInterval);
                    autoPlayCheckInterval = null;
                    return;
                }
                if (lastExpectedAutoplay && player.paused) {
                    safePlay();
                }
            }, 800);

            // Mensajes YouTube API y ventana padre
            window.addEventListener('message', function (ev) {
                if (typeof ev.data === 'string') {
                    if (ev.data.includes('onError')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            if (ytData.event === 'onError' && ytData.info) {
                                triggerError(ytData.info);
                            }
                        } catch (e) {}
                    }
                    if (ev.data.includes('onStateChange') || ev.data.includes('infoDelivery')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            const state = ytData.info && ytData.info.playerState !== undefined ? ytData.info.playerState : ytData.info;
                            if (state === 1) {
                                if (!hasActiveError) triggerPlaybackStarted();
                            }
                        } catch (e) {}
                    }
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                hasActiveError = false;
                                isRealPlaybackActive = false;
                                playerHost.classList.remove('is-error');
                                
                                videoCover.classList.remove('hidden');
                                errorView.classList.remove('active');
                                
                                currentVid = data.videoId;
                                endedReported = false;
                                reportedReady = false;
                                
                                showSpinner();
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (hasActiveError) return;
                                    if (typeof data.time !== 'undefined' && Number(data.time) > 0) {
                                        player.currentTime = Number(data.time);
                                    }
                                    if (lastExpectedAutoplay && !hasActiveError) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                            } else {
                                hasActiveError = false;
                                isRealPlaybackActive = false;
                                currentVid = null;
                                hideSpinner();
                                videoCover.classList.remove('hidden');
                                playerHost.classList.remove('is-error');
                                try {
                                    player.pause();
                                    player.currentTime = 0;
                                    player.src = '';
                                } catch (e) {}
                            }
                            break;
                        case 'play':
                            if (!hasActiveError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'seek':
                            if (player && typeof data.time !== 'undefined' && !hasActiveError) {
                                player.currentTime = Number(data.time) || 0;
                            }
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
