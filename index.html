<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Eva Player</title>
    <style>
        :root {
            --bg: #000000;
            --panel: #0e0e11;
            --muted: rgba(255,255,255,0.7);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 38%),
                linear-gradient(180deg, #040404 0%, #000 100%);
        }

        #playerHost {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        #youtubePlayer,
        #youtubePlayer > iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0;
            display: block;
            background: #000;
            outline: none;
        }

        #youtubePlayer {
            position: absolute;
            inset: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="youtubePlayer"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t') || 0);
        let player = null;
        let currentVideoId = null;
        let playerReady = false;

        function postParent(message) {
            try {
                window.parent.postMessage(message, '*');
            } catch (e) {}
        }

        function setVideo(videoIdValue, shouldAutoplay) {
            if (!videoIdValue || !player) return;
            currentVideoId = videoIdValue;
            player.loadVideoById({
                videoId: videoIdValue,
                startSeconds: Number.isFinite(startTime) ? startTime : 0,
                suggestedQuality: 'hd1080'
            });
            if (shouldAutoplay) {
                setTimeout(() => {
                    try { player.playVideo(); } catch (e) {}
                }, 250);
            }
        }

        function handleParentMessage(event) {
            const data = event && event.data;
            if (!data || data.source !== 'voice-eva') return;

            switch (data.type) {
                case 'load':
                    if (data.videoId) {
                        setVideo(data.videoId, !!data.autoplay);
                    }
                    break;
                case 'play':
                    if (player) try { player.playVideo(); } catch (e) {}
                    break;
                case 'pause':
                    if (player) try { player.pauseVideo(); } catch (e) {}
                    break;
                case 'seek':
                    if (player && Number.isFinite(Number(data.time))) {
                        try { player.seekTo(Number(data.time), true); } catch (e) {}
                    }
                    break;
                case 'stop':
                    if (player) {
                        try { player.stopVideo(); } catch (e) {}
                        try { player.seekTo(0, true); } catch (e) {}
                    }
                    break;
                case 'mute':
                    if (player) try { player.mute(); } catch (e) {}
                    break;
                case 'unmute':
                    if (player) try { player.unMute(); } catch (e) {}
                    break;
                case 'setVolume':
                    if (player && Number.isFinite(Number(data.volume))) {
                        try { player.setVolume(Number(data.volume)); } catch (e) {}
                    }
                    break;
                default:
                    break;
            }
        }

        function onPlayerStateChange(event) {
            const stateMap = {
                '-1': 'unstarted',
                '0': 'ended',
                '1': 'playing',
                '2': 'paused',
                '3': 'buffering',
                '5': 'video cued'
            };

            const state = stateMap[String(event.data)] || 'unknown';
            postParent({
                source: 'x-player',
                type: 'state',
                state: state,
                videoId: currentVideoId,
                time: player && typeof player.getCurrentTime === 'function' ? player.getCurrentTime() : 0,
                duration: player && typeof player.getDuration === 'function' ? player.getDuration() : 0,
                muted: player && typeof player.isMuted === 'function' ? player.isMuted() : false,
                volume: player && typeof player.getVolume === 'function' ? player.getVolume() : 0
            });
        }

        function onPlayerReady() {
            playerReady = true;
            postParent({
                source: 'x-player',
                type: 'ready',
                videoId: currentVideoId
            });

            if (player && currentVideoId) {
                try {
                    if (autoplay) player.playVideo();
                    if (startTime > 0) player.seekTo(startTime, true);
                } catch (e) {}
            }
        }

        function initPlayer() {
            if (!videoId) return;
            const playerContainer = document.getElementById('youtubePlayer');
            if (!playerContainer) return;

            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(script);

            window.onYouTubeIframeAPIReady = function () {
                player = new YT.Player('youtubePlayer', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: autoplay ? 1 : 0,
                        playsinline: 1,
                        controls: 1,
                        rel: 0,
                        modestbranding: 1,
                        fs: 1,
                        iv_load_policy: 3,
                        disablekb: 0,
                        cc_load_policy: 0,
                        origin: window.location.origin || 'https://unevennesx.github.io'
                    },
                    events: {
                        onReady: onPlayerReady,
                        onStateChange: onPlayerStateChange,
                        onError: function () {
                            postParent({ source: 'x-player', type: 'error', videoId: currentVideoId||videoId });
                        }
                    }
                });

                currentVideoId = videoId;
                if (startTime > 0) {
                    setTimeout(() => {
                        try { player.seekTo(startTime, true); } catch (e) {}
                    }, 600);
                }
            };
        }

        window.addEventListener('message', handleParentMessage, false);
        initPlayer();

        if (videoId && !window.YT) {
            const fallback = document.createElement('iframe');
            fallback.src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=' + (autoplay ? '1' : '0') + '&playsinline=1&controls=1&rel=0&modestbranding=1';
            fallback.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen');
            fallback.setAttribute('allowfullscreen', 'true');
            fallback.style.width = '100%';
            fallback.style.height = '100%';
            fallback.style.border = '0';
            document.getElementById('youtubePlayer').appendChild(fallback);
        }
    </script>
</body>
</html>
