<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vidstack Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    <script type="module" src="https://cdn.vidstack.io/icons"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin="true">
    <link rel="preconnect" href="https://static.doubleclick.net" crossorigin="true">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #playerHost,
        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            position: relative;
        }

        /* --- Pantalla de Error Super Profesional --- */
        .player-error-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at center, rgba(20, 20, 26, 0.94) 0%, rgba(5, 5, 8, 0.98) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .player-error-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            animation: cardScaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardScaleIn {
            from { transform: scale(0.94) translateY(8px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .error-icon-wrapper {
            width: 60px;
            height: 60px;
            margin: 0 auto 18px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
        }

        .error-icon-wrapper svg {
            width: 30px;
            height: 30px;
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .error-title {
            font-size: 19px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #f8fafc;
            line-height: 1.35;
        }

        .error-description {
            font-size: 13.5px;
            line-height: 1.55;
            color: #94a3b8;
            margin: 0 0 22px;
        }

        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .error-btn-primary {
            background: #ff0000;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(255, 0, 0, 0.3);
        }

        .error-btn-primary:hover {
            background: #e60000;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 0, 0, 0.4);
        }

        .error-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .error-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Capa de Error UI -->
        <div id="errorOverlay" class="player-error-overlay" aria-live="assertive">
            <div class="error-card">
                <div class="error-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                </div>
                <div>
                    <span id="errBadge" class="error-badge">ERROR 150</span>
                </div>
                <h3 id="errTitle" class="error-title">Reproducción no permitida</h3>
                <p id="errDesc" class="error-description">El propietario de este video no permite que se reproduzca en sitios web o reproductores externos.</p>
                
                <div id="errActions" class="error-actions">
                    <a id="ytDirectBtn" href="#" target="_blank" rel="noopener noreferrer" class="error-btn error-btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                        Ver en YouTube
                    </a>
                </div>
            </div>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="warn" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" data-orientation="landscape">
            <media-provider keep-alive="" data-media-provider="">
                <iframe tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
            <media-controls class="vds-controls" role="group" style="pointer-events: none;">
                <media-controls-group class="vds-controls-group top-right" style="pointer-events: auto;">
                    <media-menu class="vds-menu" data-root="" data-disabled="" style="display: contents;">
                        <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video" tabindex="0" role="button" id="media-menu-button-1" aria-haspopup="menu" aria-expanded="false" data-root="" aria-disabled="true" type="button">
                            <media-icon class="vds-icon" type="settings">
                                <svg width="100%" height="100%" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M13.5722 5.33333C13.2429 5.33333 12.9629 5.57382 12.9132 5.89938L12.4063 9.21916C12.4 9.26058 12.3746 9.29655 12.3378 9.31672C12.2387 9.37118 12.1409 9.42779 12.0444 9.48648C12.0086 9.5083 11.9646 9.51242 11.9255 9.49718L8.79572 8.27692C8.48896 8.15732 8.14083 8.27958 7.9762 8.56472L5.5491 12.7686C5.38444 13.0538 5.45271 13.4165 5.70981 13.6223L8.33308 15.7225C8.3658 15.7487 8.38422 15.7887 8.38331 15.8306C8.38209 15.8867 8.38148 15.9429 8.38148 15.9993C8.38148 16.0558 8.3821 16.1121 8.38332 16.1684C8.38423 16.2102 8.36582 16.2503 8.33313 16.2765L5.7103 18.3778C5.45334 18.5836 5.38515 18.9462 5.54978 19.2314L7.97688 23.4352C8.14155 23.7205 8.48981 23.8427 8.79661 23.723L11.926 22.5016C11.9651 22.4864 12.009 22.4905 12.0449 22.5123C12.1412 22.5709 12.2388 22.6274 12.3378 22.6818C12.3745 22.7019 12.4 22.7379 12.4063 22.7793L12.9132 26.0993C12.9629 26.4249 13.2429 26.6654 13.5722 26.6654H18.4264C18.7556 26.6654 19.0356 26.425 19.0854 26.0995L19.5933 22.7801C19.5997 22.7386 19.6252 22.7027 19.6619 22.6825C19.7614 22.6279 19.8596 22.5711 19.9564 22.5121C19.9923 22.4903 20.0362 22.4862 20.0754 22.5015L23.2035 23.7223C23.5103 23.842 23.8585 23.7198 24.0232 23.4346L26.4503 19.2307C26.6149 18.9456 26.5467 18.583 26.2898 18.3771L23.6679 16.2766C23.6352 16.2504 23.6168 16.2104 23.6177 16.1685C23.619 16.1122 23.6196 16.0558 23.6196 15.9993C23.619 15.9429 23.619 15.8866 23.6177 15.8305C23.6168 15.7886 23.6353 15.7486 23.668 15.7224L26.2903 13.623C26.5474 13.4172 26.6156 13.0544 26.451 12.7692L24.0239 8.56537C23.8592 8.28023 23.5111 8.15797 23.2043 8.27757L20.0758 9.49734C20.0367 9.51258 19.9927 9.50846 19.9569 9.48664C19.8599 9.42762 19.7616 9.37071 19.6618 9.31596C19.6251 9.2958 19.5997 9.25984 19.5933 9.21843L19.0854 5.89915C19.0356 5.57369 18.7556 5.33333 18.4264 5.33333H13.5722ZM16.0001 20.2854C18.3672 20.2854 20.2862 18.3664 20.2862 15.9993C20.2862 13.6322 18.3672 11.7132 16.0001 11.7132C13.6329 11.7132 11.714 13.6322 11.714 15.9993C11.714 18.3664 13.6329 20.2854 16.0001 20.2854Z" fill="currentColor"></path>
                                </svg>
                            </media-icon>
                        </media-menu-button>
                        <media-menu-items class="vds-menu-items" id="media-menu-1" role="menu" tabindex="-1" data-root="" aria-hidden="true" style="display: none; --menu-height: 24px;">
                            <media-quality-radio-group class="vds-radio-group" value="auto">
                                <template>
                                    <media-radio class="vds-radio">
                                        <media-icon class="vds-icon" type="radio-check"></media-icon>
                                        <span class="vds-radio-label" data-part="label"></span>
                                        <span class="vds-badge" data-part="bitrate"></span>
                                    </media-radio>
                                </template>
                                <media-radio class="vds-radio" value="auto" tabindex="-1" role="menuitemradio" aria-checked="true" data-checked="">
                                    <media-icon class="vds-icon" type="radio-check"><svg width="100%" height="100%" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"></svg></media-icon>
                                    <span class="vds-radio-label" data-part="label">Auto</span>
                                    <span class="vds-badge" data-part="bitrate"></span>
                                </media-radio>
                            </media-quality-radio-group>
                        </media-menu-items>
                    </media-menu>
                </media-controls-group>
            </media-controls>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const player = document.getElementById('rmExternalPlayer');

        // Elementos de la interfaz de Error
        const overlay = document.getElementById('errorOverlay');
        const errBadge = document.getElementById('errBadge');
        const errTitle = document.getElementById('errTitle');
        const errDesc = document.getElementById('errDesc');
        const ytDirectBtn = document.getElementById('ytDirectBtn');

        // Diccionario semántico de errores
        const ERROR_DEFINITIONS = {
            150: {
                badge: 'Código 150 · Restricción de inserción',
                title: 'Reproducción restringida por el autor',
                desc: 'El propietario del video ha bloqueado su reproducción en reproductores o sitios web insertados.',
                showYoutubeBtn: true
            },
            101: {
                badge: 'Código 101 · Restricción de inserción',
                title: 'Reproducción restringida por el autor',
                desc: 'Este contenido no puede ser reproducido de manera externa debido a políticas de inserción del canal.',
                showYoutubeBtn: true
            },
            100: {
                badge: 'Código 100 · No encontrado',
                title: 'Video no disponible o eliminado',
                desc: 'El video solicitado no existe, ha sido dado de baja o está configurado como privado.',
                showYoutubeBtn: false
            },
            2: {
                badge: 'Código 2 · Parámetro inválido',
                title: 'Identificador de video inválido',
                desc: 'El ID proporcionado contiene caracteres incorrectos o no se encuentra bien formado.',
                showYoutubeBtn: false
            },
            5: {
                badge: 'Código 5 · Error HTML5',
                title: 'Error de reproducción HTML5',
                desc: 'El reproductor no ha podido procesar el códec o formato de video solicitado.',
                showYoutubeBtn: true
            }
        };

        function showVisualError(codeOrMsg, vid) {
            const num = Number(codeOrMsg);
            const def = (!isNaN(num) && ERROR_DEFINITIONS[num]) ? ERROR_DEFINITIONS[num] : {
                badge: isNaN(num) ? 'Error de reproducción' : `Código ${num}`,
                title: 'No se pudo reproducir el video',
                desc: String(codeOrMsg || 'Ha ocurrido un problema inesperado al procesar el archivo multimedia.'),
                showYoutubeBtn: true
            };

            errBadge.textContent = def.badge;
            errTitle.textContent = def.title;
            errDesc.textContent = def.desc;

            if (def.showYoutubeBtn && vid) {
                ytDirectBtn.href = 'https://www.youtube.com/watch?v=' + vid;
                ytDirectBtn.style.display = 'inline-flex';
            } else {
                ytDirectBtn.style.display = 'none';
            }

            overlay.classList.add('active');
        }

        function hideVisualError() {
            overlay.classList.remove('active');
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        let isFatalError = false;

        function safePlay() {
            if (!player || isFatalError) return;
            try {
                const playPromise = player.play();
                if (playPromise !== undefined && typeof playPromise.catch === 'function') {
                    playPromise.catch(function (err) {
                        // Silenciar error si el medio no está listo o fue abortado
                    });
                }
            } catch (e) {}
        }

        if (player) {
            let currentVid = videoId || null;
            let lastExpectedAutoplay = autoplay === '1';
            let endedReported = false;
            let reportedReady = false;

            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
            }

            function markReady() {
                if (reportedReady || isFatalError) return;
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
            player.addEventListener('can-play', markReady);
            player.addEventListener('playing', markReady);
            setTimeout(markReady, 2500);

            // Manejador centralizado de errores
            function handlePlayerError(errorInfo, rawEvent) {
                if (isFatalError) return; // Evitar duplicar llamadas
                isFatalError = true;
                lastExpectedAutoplay = false; // Detener reintentos de autoplay

                console.error('%c[Vidstack Video Error]', 'color: #ff3333; font-weight: bold; font-size: 12px;', {
                    videoId: currentVid,
                    error: errorInfo,
                    rawEvent: rawEvent
                });

                showVisualError(errorInfo, currentVid);

                postToParent({
                    type: 'error',
                    videoId: currentVid,
                    code: errorInfo,
                    message: String(errorInfo)
                });
            }

            player.addEventListener('error', function (event) {
                const detail = event && event.detail;
                const errorVal = (detail && (detail.code || detail.message || detail.error)) || (event && event.message) || 'Playback Error';
                handlePlayerError(errorVal, event);
            });

            player.addEventListener('ended', function () {
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            // Reintento de autoplay seguro (se cancela si ocurre un error fatal)
            setInterval(function () {
                if (lastExpectedAutoplay && !isFatalError && player.paused) {
                    safePlay();
                }
            }, 2500);

            // Escuchar eventos
            window.addEventListener('message', function (ev) {
                // Captura directa de mensajes de YouTube Iframe API (ej. onError: 150)
                if (typeof ev.data === 'string' && ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.event === 'onError' && ytData.info) {
                            handlePlayerError(ytData.info, ytData);
                        }
                    } catch (e) {}
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                isFatalError = false;
                                hideVisualError();
                                currentVid = data.videoId;
                                endedReported = false;
                                reportedReady = false;
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (lastExpectedAutoplay && !isFatalError) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                            }
                            break;
                        case 'play':
                            if (!isFatalError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
