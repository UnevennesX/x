<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Referrer adecuado para que YouTube valide el origen del dominio -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Player</title>

    <!-- Script Oficial de YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://www.youtube.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        /* Contenedor del Reproductor */
        #playerContainer {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            inset: 0;
            background-color: #000000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        #playerContainer.vds-visible {
            opacity: 1;
            visibility: visible;
        }

        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
        }

        /* Cortina Protectora */
        .rm-curtain {
            position: absolute;
            inset: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .rm-curtain.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .rm-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Capa Sin Video */
        .rm-idle-layer {
            position: absolute;
            inset: 0;
            background-color: #000000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
            color: #555555;
            font-size: 0.88rem;
        }

        .rm-idle-layer.active {
            display: flex;
        }

        /* Capa de Error Minimalista */
        .rm-error-layer {
            position: absolute;
            inset: 0;
            background-color: #0a0a0a;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
        }

        .rm-error-layer.active {
            display: flex;
        }

        .rm-error-box {
            max-width: 420px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .rm-error-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .rm-error-reason {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #888888;
            word-break: break-word;
        }

        .rm-error-code {
            font-size: 0.75rem;
            font-family: monospace;
            color: #555555;
            margin-top: 2px;
        }

        .rm-countdown-msg {
            display: none;
            font-size: 0.82rem;
            color: #777777;
            margin-top: 6px;
        }

        .rm-countdown-msg.visible {
            display: block;
        }

        .rm-countdown-sec {
            font-weight: 600;
            color: #ffffff;
        }

        .rm-btn-skip {
            margin-top: 10px;
            padding: 8px 18px;
            background: #1c1c1c;
            color: #eeeeee;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .rm-btn-skip:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Cortina inicial -->
        <div id="rmCurtain" class="rm-curtain">
            <div class="rm-spinner"></div>
        </div>

        <!-- Capa sin video -->
        <div id="rmIdleOverlay" class="rm-idle-layer">
            <span>En espera de video...</span>
        </div>

        <!-- Contenedor Oficial YouTube IFrame -->
        <div id="playerContainer">
            <div id="ytIframeSlot"></div>
        </div>

        <!-- Capa de Error -->
        <div id="rmErrorOverlay" class="rm-error-layer">
            <div class="rm-error-box">
                <div id="rmErrorTitle" class="rm-error-title">No se pudo reproducir</div>
                <div id="rmErrorReason" class="rm-error-reason">Ocurrió un error al cargar el video.</div>
                <div id="rmErrorCode" class="rm-error-code"></div>
                <div id="rmCountdownBox" class="rm-countdown-msg">
                    Siguiente video en <span id="rmCountdownSec" class="rm-countdown-sec">5</span>s
                </div>
                <button id="rmBtnSkip" class="rm-btn-skip" style="display: none;">Saltar video</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialVideoId = urlParams.get('v') || urlParams.get('videoId') || null;
        const initialAutoplay = urlParams.get('autoplay') === '1';
        const initialStartTime = Math.max(0, Number(urlParams.get('t') || urlParams.get('time')) || 0);

        const playerContainer = document.getElementById('playerContainer');
        const curtain = document.getElementById('rmCurtain');
        const idleOverlay = document.getElementById('rmIdleOverlay');
        const errorOverlay = document.getElementById('rmErrorOverlay');
        const errorTitle = document.getElementById('rmErrorTitle');
        const errorReason = document.getElementById('rmErrorReason');
        const errorCodeTag = document.getElementById('rmErrorCode');
        const countdownBox = document.getElementById('rmCountdownBox');
        const countdownSec = document.getElementById('rmCountdownSec');
        const btnSkip = document.getElementById('rmBtnSkip');

        let ytPlayer = null;
        let isYTReady = false;
        let pendingLoad = null;

        let currentVid = null;
        let isFatalError = false;
        let hasNextInQueue = false;
        let countdownTimer = null;
        let watchdogTimer = null;
        let reportedReady = false;
        let endedThisVideo = false;
        let endedReported = false;
        let lastExpectedAutoplay = false;
        let durationPollInterval = null;

        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return '';
            const match = String(urlOrId).match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (match && match[1]) return match[1];
            return String(urlOrId).trim();
        }

        function getRealErrorMessage(code, rawMsg) {
            if (rawMsg && typeof rawMsg === 'string' && rawMsg.trim().length > 0 && !rawMsg.includes('[object')) {
                return {
                    title: 'Error de reproducción',
                    reason: rawMsg
                };
            }

            const numericCode = Number(code);
            switch (numericCode) {
                case 2:
                    return {
                        title: 'Parámetro no válido',
                        reason: 'El ID del video contiene caracteres no válidos o es incorrecto.'
                    };
                case 5:
                    return {
                        title: 'Error de HTML5',
                        reason: 'El contenido no se puede reproducir en el reproductor HTML5.'
                    };
                case 100:
                    return {
                        title: 'Video no encontrado',
                        reason: 'El video no existe, ha sido eliminado o está marcado como privado.'
                    };
                case 101:
                case 150:
                    return {
                        title: 'Inserción no permitida',
                        reason: 'El propietario del video no permite reproducirlo fuera de YouTube.'
                    };
                case 153:
                case 155:
                    return {
                        title: 'Restricción de región',
                        reason: 'Este video no está disponible en este sitio o país.'
                    };
                case 408:
                    return {
                        title: 'Tiempo de espera agotado',
                        reason: 'El video tardó demasiado en responder al conectar.'
                    };
                default:
                    return {
                        title: 'Error de reproducción',
                        reason: 'No se pudo cargar el video debido a una falla inesperada del reproductor.'
                    };
            }
        }

        function postToParent(msg) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'room-player', ...msg }, '*');
                }
            } catch (e) {}
        }

        function showCurtain() {
            idleOverlay.classList.remove('active');
            curtain.classList.remove('hidden');
            playerContainer.classList.remove('vds-visible');
        }

        function hideCurtain() {
            curtain.classList.add('hidden');
            playerContainer.classList.add('vds-visible');
        }

        function hideOverlay() {
            errorOverlay.classList.remove('active');
            countdownBox.classList.remove('visible');
            btnSkip.style.display = 'none';
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            isFatalError = false;
        }

        function startHangWatchdog() {
            clearHangWatchdog();
            watchdogTimer = setTimeout(function () {
                if (!reportedReady && !isFatalError) {
                    triggerCustomError(408, 'Tiempo de espera agotado al conectar con YouTube.');
                }
            }, 14000);
        }

        function clearHangWatchdog() {
            if (watchdogTimer) {
                clearTimeout(watchdogTimer);
                watchdogTimer = null;
            }
        }

        function startCountdown() {
            let left = 5;
            countdownSec.textContent = left;
            countdownBox.classList.add('visible');
            btnSkip.style.display = 'inline-block';

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(function () {
                left--;
                if (left <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    skipVideo();
                } else {
                    countdownSec.textContent = left;
                }
            }, 1000);
        }

        btnSkip.addEventListener('click', skipVideo);

        function triggerCustomError(code, customMessage) {
            clearHangWatchdog();
            isFatalError = true;

            playerContainer.classList.remove('vds-visible');
            curtain.classList.add('hidden');

            const errorInfo = getRealErrorMessage(code, customMessage);
            errorTitle.textContent = errorInfo.title;
            errorReason.textContent = errorInfo.reason;
            errorCodeTag.textContent = code ? `Código: ${code}` : '';

            errorOverlay.classList.add('active');

            try {
                if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            } catch (e) {}

            postToParent({ type: 'error', code: Number(code) || 150, videoId: currentVid, message: errorInfo.reason });

            if (hasNextInQueue) {
                startCountdown();
            } else {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                countdownBox.classList.remove('visible');
            }
        }

        function skipVideo() {
            hideOverlay();
            clearHangWatchdog();
            postToParent({ type: 'skip_fatal', videoId: currentVid });
        }

        function startDurationReporting() {
            if (durationPollInterval) clearInterval(durationPollInterval);
            durationPollInterval = setInterval(function () {
                try {
                    if (ytPlayer && ytPlayer.getDuration) {
                        const d = ytPlayer.getDuration();
                        if (d && isFinite(d) && d > 0 && !isFatalError) {
                            postToParent({ type: 'duration', videoId: currentVid, duration: d });
                            clearInterval(durationPollInterval);
                            durationPollInterval = null;
                        }
                    }
                } catch (e) {}
            }, 1000);
        }

        function onPlaybackConfirmed() {
            if (isFatalError) return;
            clearHangWatchdog();
            hideOverlay();
            hideCurtain();

            if (!reportedReady) {
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
            startDurationReporting();
        }

        // Inicialización de la API de YouTube oficial
        window.onYouTubeIframeAPIReady = function () {
            isYTReady = true;
            if (pendingLoad) {
                const req = pendingLoad;
                pendingLoad = null;
                loadVideo(req.vid, req.autoplay, req.seek);
            }
        };

        function createOrUpdatePlayer(cleanId, shouldAutoplay, seekTime) {
            const originHost = window.location.origin && window.location.origin !== 'null' ? window.location.origin : 'https://www.youtube.com';

            if (!ytPlayer) {
                ytPlayer = new YT.Player('ytIframeSlot', {
                    videoId: cleanId,
                    width: '100%',
                    height: '100%',
                    playerVars: {
                        autoplay: shouldAutoplay ? 1 : 0,
                        start: Math.max(0, Math.floor(seekTime || 0)),
                        controls: 1,
                        rel: 0,
                        enablejsapi: 1,
                        playsinline: 1,
                        origin: originHost,
                        widget_referrer: window.location.href
                    },
                    events: {
                        onReady: function () {
                            onPlaybackConfirmed();
                            if (shouldAutoplay) {
                                try { ytPlayer.playVideo(); } catch (e) {}
                            }
                        },
                        onStateChange: function (event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                onPlaybackConfirmed();
                            } else if (event.data === YT.PlayerState.ENDED) {
                                endedThisVideo = true;
                                if (!endedReported) {
                                    endedReported = true;
                                    postToParent({ type: 'ended', videoId: currentVid });
                                }
                            }
                        },
                        onError: function (event) {
                            triggerCustomError(event.data);
                        }
                    }
                });
            } else {
                try {
                    if (shouldAutoplay) {
                        ytPlayer.loadVideoById({
                            videoId: cleanId,
                            startSeconds: Math.max(0, Math.floor(seekTime || 0))
                        });
                    } else {
                        ytPlayer.cueVideoById({
                            videoId: cleanId,
                            startSeconds: Math.max(0, Math.floor(seekTime || 0))
                        });
                    }
                    setTimeout(onPlaybackConfirmed, 800);
                } catch (e) {
                    triggerCustomError(150);
                }
            }
        }

        function loadVideo(vid, shouldAutoplay, seekTime) {
            const cleanId = extractYouTubeId(vid);
            if (!cleanId) {
                hideCurtain();
                idleOverlay.classList.add('active');
                return;
            }

            if (!isYTReady) {
                pendingLoad = { vid: cleanId, autoplay: shouldAutoplay, seek: seekTime };
                showCurtain();
                return;
            }

            hideOverlay();
            showCurtain();
            clearHangWatchdog();

            currentVid = cleanId;
            endedThisVideo = false;
            endedReported = false;
            reportedReady = false;
            lastExpectedAutoplay = !!shouldAutoplay;

            startHangWatchdog();
            createOrUpdatePlayer(cleanId, shouldAutoplay, seekTime);
        }

        // Inicialización
        if (initialVideoId) {
            loadVideo(initialVideoId, initialAutoplay, initialStartTime);
        } else {
            hideCurtain();
            idleOverlay.classList.add('active');
        }

        // Comunicación por postMessage desde la app principal
        window.addEventListener('message', function (ev) {
            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            switch (data.type) {
                case 'load':
                    hasNextInQueue = !!data.hasNext;
                    loadVideo(data.videoId, data.autoplay, data.time);
                    break;
                case 'queue_state':
                    hasNextInQueue = !!data.hasNext;
                    if (isFatalError && hasNextInQueue && !countdownTimer) {
                        startCountdown();
                    } else if (isFatalError && !hasNextInQueue && countdownTimer) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        countdownBox.classList.remove('visible');
                    }
                    break;
                case 'play':
                    if (!isFatalError && ytPlayer && ytPlayer.playVideo) {
                        lastExpectedAutoplay = true;
                        try { ytPlayer.playVideo(); } catch (e) {}
                    }
                    break;
                case 'pause':
                    if (!isFatalError && ytPlayer && ytPlayer.pauseVideo) {
                        lastExpectedAutoplay = false;
                        try { ytPlayer.pauseVideo(); } catch (e) {}
                    }
                    break;
                case 'seek':
                    if (!isFatalError && ytPlayer && ytPlayer.seekTo) {
                        try { ytPlayer.seekTo(Math.max(0, Number(data.time) || 0), true); } catch (e) {}
                    }
                    break;
                case 'stop':
                    hideOverlay();
                    showCurtain();
                    clearHangWatchdog();
                    lastExpectedAutoplay = false;
                    try {
                        if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                    } catch (e) {}
                    break;
                case 'mute':
                    if (ytPlayer && ytPlayer.mute) ytPlayer.mute();
                    break;
                case 'unmute':
                    if (ytPlayer && ytPlayer.unMute) ytPlayer.unMute();
                    break;
                case 'setVolume':
                    if (ytPlayer && ytPlayer.setVolume) {
                        ytPlayer.setVolume(Math.max(0, Math.min(100, Number(data.volume) || 0)));
                    }
                    break;
            }
        });
    </script>
</body>
</html>
