<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* El iframe ocupa siempre el 100% */
    #player-frame, iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }

    /* Mensaje flotante para activar el sonido */
    #soundHint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    #soundHint.show {
      opacity: 1;
    }

    #msg {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #msg.show {
      display: grid;
    }
  </style>
</head>

<body>
  <div id="stage">
    <!-- El iframe se inyecta directamente para forzar autoplay inmediato -->
    <div id="player-container" style="width: 100%; height: 100%;"></div>

    <div id="soundHint">🔊 Toca la pantalla para activar el sonido</div>
    <div id="msg">
      Falta el parámetro <code>?v=VIDEO_ID</code> en la URL.
    </div>
  </div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialVideoId = (params.get("v") || "").trim();
    const initialAutoplay = params.get("autoplay") !== "0";
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const playerContainer = document.getElementById("player-container");
    const soundHint = document.getElementById("soundHint");
    const msg = document.getElementById("msg");

    let player = null;
    let currentVideoId = "";
    let endedReported = false;
    let soundUnlocked = false;
    let timeInterval = null;

    function post(m) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, m),
          "*"
        );
      } catch {}
    }

    function showHint() { soundHint.classList.add("show"); }
    function hideHint() { soundHint.classList.remove("show"); }

    function unlockSound() {
      if (soundUnlocked || !player) return;
      soundUnlocked = true;
      try {
        if (typeof player.unMute === "function") player.unMute();
        if (typeof player.setVolume === "function" && player.getVolume() === 0) {
          player.setVolume(100);
        }
      } catch {}
      hideHint();
      window.removeEventListener("pointerdown", unlockSound);
      window.removeEventListener("keydown", unlockSound);
      window.removeEventListener("touchstart", unlockSound);
    }

    function armUnlockOnFirstInteraction() {
      window.addEventListener("pointerdown", unlockSound, { passive: true });
      window.addEventListener("keydown", unlockSound);
      window.addEventListener("touchstart", unlockSound, { passive: true });
    }

    function startTimeTracker() {
      stopTimeTracker();
      timeInterval = setInterval(() => {
        if (player && typeof player.getCurrentTime === "function") {
          try {
            post({
              type: "time-update",
              videoId: currentVideoId,
              time: Number(player.getCurrentTime()) || 0,
              duration: Number(player.getDuration()) || 0
            });
          } catch {}
        }
      }, 250);
    }

    function stopTimeTracker() {
      if (timeInterval) {
        clearInterval(timeInterval);
        timeInterval = null;
      }
    }

    function buildIframe(videoId, startSeconds) {
      currentVideoId = videoId;
      endedReported = false;
      soundUnlocked = false;

      // Creamos el iframe directamente con autoplay=1 y mute=1 en el SRC
      playerContainer.innerHTML = `
        <iframe 
          id="player-frame"
          src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=1&enablejsapi=1&playsinline=1&rel=0&modestbranding=1&start=${startSeconds}"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;

      // Vinculamos la API al iframe ya creado
      function attachAPI() {
        if (window.YT && window.YT.Player) {
          player = new YT.Player("player-frame", {
            events: {
              onReady: (event) => {
                post({ type: "ready", videoId: currentVideoId });
                // Forzamos inicio por seguridad adicional
                try { event.target.playVideo(); } catch {}
                showHint();
                armUnlockOnFirstInteraction();
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.PLAYING) {
                  endedReported = false;
                  startTimeTracker();
                  post({
                    type: "state",
                    state: "playing",
                    videoId: currentVideoId,
                    time: Number(player.getCurrentTime()) || 0
                  });
                } else if (event.data === YT.PlayerState.PAUSED) {
                  stopTimeTracker();
                  post({
                    type: "state",
                    state: "paused",
                    videoId: currentVideoId,
                    time: Number(player.getCurrentTime()) || 0
                  });
                } else if (event.data === YT.PlayerState.ENDED) {
                  stopTimeTracker();
                  if (!endedReported) {
                    endedReported = true;
                    post({
                      type: "ended",
                      videoId: currentVideoId,
                      time: Number(player.getDuration()) || 0
                    });
                  }
                }
              },
              onError: (event) => {
                post({
                  type: "error",
                  videoId: currentVideoId,
                  code: event.data,
                  message: "Error al reproducir el video."
                });
              }
            }
          });
        } else {
          setTimeout(attachAPI, 50);
        }
      }

      attachAPI();
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      const startSec = Math.max(0, Number(time) || 0);

      if (!player) {
        buildIframe(id, startSec);
      } else {
        currentVideoId = id;
        endedReported = false;
        try {
          player.loadVideoById({
            videoId: id,
            startSeconds: startSec
          });
          player.mute();
          player.playVideo();
        } catch {
          buildIframe(id, startSec);
        }
      }
    }

    // Inicialización
    if (initialVideoId) {
      loadVideo(initialVideoId, initialAutoplay, initialTime);
    } else {
      msg.classList.add("show");
    }

    // Mensajería con la app padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva" || !player) return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, !!data.autoplay, Number(data.time) || 0);
          break;
        case "play":
          try { player.playVideo(); } catch {}
          break;
        case "pause":
          try { player.pauseVideo(); } catch {}
          break;
        case "stop":
          try {
            player.stopVideo();
            endedReported = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time))) {
            try { player.seekTo(Number(data.time), true); } catch {}
          }
          break;
        case "mute":
          try { player.mute(); } catch {}
          break;
        case "unmute":
          try { player.unMute(); } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v)) {
            try { player.setVolume(Math.min(100, Math.max(0, v))); } catch {}
          }
          break;
        }
      }
    });
  </script>
</body>
</html>
