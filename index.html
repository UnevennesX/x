<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vidstack Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    <script type="module" src="https://cdn.vidstack.io/icons"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin="true">
    <link rel="preconnect" href="https://static.doubleclick.net" crossorigin="true">

    <style>
        /* Hace que toda la ventana ocupe el 100% sin barras de scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Fuerza al contenedor y al reproductor a expandirse por completo */
        #playerHost,
        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="warn" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" data-orientation="landscape">
            <media-provider keep-alive="" data-media-provider="">
                <iframe tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
            <media-controls class="vds-controls" role="group" style="pointer-events: none;">
                <media-controls-group class="vds-controls-group top-right" style="pointer-events: auto;">
                    <media-menu class="vds-menu" data-root="" data-disabled="" style="display: contents;">
                        <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video" tabindex="0" role="button" id="media-menu-button-1" aria-haspopup="menu" aria-expanded="false" data-root="" aria-disabled="true" type="button">
                            <media-icon class="vds-icon" type="settings">
                                <svg width="100%" height="100%" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M13.5722 5.33333C13.2429 5.33333 12.9629 5.57382 12.9132 5.89938L12.4063 9.21916C12.4 9.26058 12.3746 9.29655 12.3378 9.31672C12.2387 9.37118 12.1409 9.42779 12.0444 9.48648C12.0086 9.5083 11.9646 9.51242 11.9255 9.49718L8.79572 8.27692C8.48896 8.15732 8.14083 8.27958 7.9762 8.56472L5.5491 12.7686C5.38444 13.0538 5.45271 13.4165 5.70981 13.6223L8.33308 15.7225C8.3658 15.7487 8.38422 15.7887 8.38331 15.8306C8.38209 15.8867 8.38148 15.9429 8.38148 15.9993C8.38148 16.0558 8.3821 16.1121 8.38332 16.1684C8.38423 16.2102 8.36582 16.2503 8.33313 16.2765L5.7103 18.3778C5.45334 18.5836 5.38515 18.9462 5.54978 19.2314L7.97688 23.4352C8.14155 23.7205 8.48981 23.8427 8.79661 23.723L11.926 22.5016C11.9651 22.4864 12.009 22.4905 12.0449 22.5123C12.1412 22.5709 12.2388 22.6274 12.3378 22.6818C12.3745 22.7019 12.4 22.7379 12.4063 22.7793L12.9132 26.0993C12.9629 26.4249 13.2429 26.6654 13.5722 26.6654H18.4264C18.7556 26.6654 19.0356 26.425 19.0854 26.0995L19.5933 22.7801C19.5997 22.7386 19.6252 22.7027 19.6619 22.6825C19.7614 22.6279 19.8596 22.5711 19.9564 22.5121C19.9923 22.4903 20.0362 22.4862 20.0754 22.5015L23.2035 23.7223C23.5103 23.842 23.8585 23.7198 24.0232 23.4346L26.4503 19.2307C26.6149 18.9456 26.5467 18.583 26.2898 18.3771L23.6679 16.2766C23.6352 16.2504 23.6168 16.2104 23.6177 16.1685C23.619 16.1122 23.6196 16.0558 23.6196 15.9993C23.6196 15.9429 23.619 15.8866 23.6177 15.8305C23.6168 15.7886 23.6353 15.7486 23.668 15.7224L26.2903 13.623C26.5474 13.4172 26.6156 13.0544 26.451 12.7692L24.0239 8.56537C23.8592 8.28023 23.5111 8.15797 23.2043 8.27757L20.0758 9.49734C20.0367 9.51258 19.9927 9.50846 19.9569 9.48664C19.8599 9.42762 19.7616 9.37071 19.6618 9.31596C19.6251 9.2958 19.5997 9.25984 19.5933 9.21843L19.0854 5.89915C19.0356 5.57369 18.7556 5.33333 18.4264 5.33333H13.5722ZM16.0001 20.2854C18.3672 20.2854 20.2862 18.3664 20.2862 15.9993C20.2862 13.6322 18.3672 11.7132 16.0001 11.7132C13.6329 11.7132 11.714 13.6322 11.714 15.9993C11.714 18.3664 13.6329 20.2854 16.0001 20.2854Z" fill="currentColor"></path>
                                </svg>
                            </media-icon>
                        </media-menu-button>
                        <media-menu-items class="vds-menu-items" id="media-menu-1" role="menu" tabindex="-1" data-root="" aria-hidden="true" style="display: none; --menu-height: 24px;">
                            <media-quality-radio-group class="vds-radio-group" value="auto">
                                <template>
                                    <media-radio class="vds-radio">
                                        <media-icon class="vds-icon" type="radio-check"></media-icon>
                                        <span class="vds-radio-label" data-part="label"></span>
                                        <span class="vds-badge" data-part="bitrate"></span>
                                    </media-radio>
                                </template>
                                <media-radio class="vds-radio" value="auto" tabindex="-1" role="menuitemradio" aria-checked="true" data-checked="">
                                    <media-icon class="vds-icon" type="radio-check"><svg width="100%" height="100%" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"></svg></media-icon>
                                    <span class="vds-radio-label" data-part="label">Auto</span>
                                    <span class="vds-badge" data-part="bitrate"></span>
                                </media-radio>
                            </media-quality-radio-group>
                        </media-menu-items>
                    </media-menu>
                </media-controls-group>
            </media-controls>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = parseFloat(params.get('t')) || 0;
        const player = document.getElementById('rmExternalPlayer');

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                // Usar la propiedad `src` (no setAttribute + load()): Vidstack
                // procesa el src de forma asíncrona y un load() síncrono tras el
                // setAttribute puede recargar el video anterior.
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') player.setAttribute('autoplay', '');
                if (startTime > 0) {
                    // Un solo disparo: buscar a startTime solo al primer can-play.
                    // Si no se remueve, cada can-play posterior (seek, buffer tras
                    // pause/play) vuelve a saltar al inicio y parece que el
                    // reproductor se recarga.
                    var onReadySeek = function () {
                        player.removeEventListener('can-play', onReadySeek);
                        try { player.currentTime = startTime; } catch (e) {}
                    };
                    player.addEventListener('can-play', onReadySeek);
                }
            }

            var reportedReady = false;
            function markReady() {
                if (reportedReady) return;
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
            player.addEventListener('can-play', markReady);
            player.addEventListener('playing', markReady);
            setTimeout(markReady, 2500);

            player.addEventListener('error', function () {
                postToParent({ type: 'error' });
            });

            // Lleva el videoId actual (lo usa reportDuration para no mandar la
            // duración de un video viejo después de un 'load').
            var currentVid = videoId || null;

            player.addEventListener('ended', function () {
                postToParent({ type: 'ended', videoId: currentVid });
            });

            // Reportar la duración de la pista actual para que el servidor pueda
            // auto-avanzar la cola aunque la pestaña esté minimizada (el evento
            // 'ended' del iframe se congela en segundo plano).
            function reportDuration() {
                var d = player.duration;
                if (d && isFinite(d) && d > 0) {
                    postToParent({ type: 'duration', videoId: currentVid, duration: d });
                    return true;
                }
                return false;
            }
            // Reintenta reportar la duración unas cuantas veces: en pestaña oculta
            // los eventos (durationchange/can-play) pueden tardar, y si el primer
            // reporte se pierde el servidor no puede auto-avanzar la cola.
            var durRetry = 0;
            var reportInterval = null;
            function scheduleReportDuration() {
                durRetry = 0;
                if (reportInterval) clearInterval(reportInterval);
                reportInterval = setInterval(function () {
                    if (reportDuration()) {
                        clearInterval(reportInterval);
                        reportInterval = null;
                    } else {
                        durRetry++;
                        if (durRetry > 30) {
                            clearInterval(reportInterval);
                            reportInterval = null;
                        }
                    }
                }, 1000);
            }
            player.addEventListener('durationchange', reportDuration);
            player.addEventListener('duration-change', reportDuration);
            player.addEventListener('loadedmetadata', reportDuration);
            player.addEventListener('can-play', scheduleReportDuration);
            
            var lastExpectedAutoplay = false;

            setInterval(function() {
                if (lastExpectedAutoplay && player.paused) {
                    try { if (player.play) player.play().catch(function(){}); } catch(e){}
                }
            }, 3000);

            window.addEventListener('message', function (ev) {
                var data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                currentVid = data.videoId;
                                // Cambiar de video sobre el MISMO <media-player>
                                // (keep-alive conserva el iframe de YouTube). Se usa
                                // la propiedad `src`; NO setAttribute + player.load()
                                // (el load() síncrono puede recargar el video previo
                                // porque Vidstack procesa el src en otro ciclo).
                                player.src = 'youtube/' + data.videoId;
                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }
                                // 'load' reinicia el video desde 0; retroceder a la
                                // posición deseada en el primer can-play (un solo disparo).
                                var loadStart = Math.max(0, Number(data.time) || 0);
                                if (loadStart > 0) {
                                    var onLoadSeek = function () {
                                        player.removeEventListener('can-play', onLoadSeek);
                                        try { player.currentTime = loadStart; } catch (e) {}
                                    };
                                    player.addEventListener('can-play', onLoadSeek);
                                }
                                scheduleReportDuration();
                                if (data.autoplay) {
                                    try { if (player.play) player.play().catch(function () {}); } catch (e) {}
                                }
                            }
                            break;
                        case 'play':
                            lastExpectedAutoplay = true;
                            try { player.play(); } catch (e) {}
                            break;
                        case 'pause':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'seek':
                            player.currentTime = Math.max(0, Number(data.time) || 0);
                            break;
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            player.currentTime = 0;
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
