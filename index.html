<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            --media-font-family: inherit;
        }

        .video-cover {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 10;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .video-cover.hidden {
            opacity: 0 !important;
        }

        /* --- Spinner Minimalista --- */
        .minimal-spinner {
            position: absolute;
            z-index: 50;
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .minimal-spinner.active {
            display: block !important;
            opacity: 1 !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Error Minimalista --- */
        .minimal-error {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .minimal-error.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .error-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #777777;
            margin-bottom: 8px;
        }

        .error-msg {
            font-size: 14px;
            font-weight: 400;
            color: #e5e5e5;
            max-width: 320px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Telón negro que cubre la carga -->
        <div id="videoCover" class="video-cover"></div>

        <!-- Spinner -->
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <!-- Pantalla de Error -->
        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <!-- Reproductor Vidstack -->
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="silent" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <media-provider keep-alive="" data-media-provider="">
                <iframe id="ytIframe" tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = Number(params.get('t')) || 0;
        const player = document.getElementById('rmExternalPlayer');
        const ytIframe = document.getElementById('ytIframe');

        // Elementos UI
        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        // Estados
        let hasActiveError = false;
        let isRealPlaybackActive = false;
        let currentVid = videoId || null;
        let lastExpectedAutoplay = autoplay === '1';
        let endedReported = false;
        let reportedReady = false;
        let autoPlayCheckInterval = null;
        let pendingDurationTimer = null;
        let progressReportInterval = null;

        const ERRORS_MAP = {
            150: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            101: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            100: 'El video no existe o fue configurado como privado.',
            2: 'El enlace o identificador de video no es válido.',
            5: 'Error de formato en el reproductor HTML5.'
        };

        function showSpinner() {
            if (!hasActiveError && !isRealPlaybackActive) {
                spinner.classList.add('active');
            }
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            isRealPlaybackActive = false;
            lastExpectedAutoplay = false;

            if (autoPlayCheckInterval) {
                clearInterval(autoPlayCheckInterval);
                autoPlayCheckInterval = null;
            }
            clearPendingDuration();
            if (progressReportInterval) {
                clearInterval(progressReportInterval);
                progressReportInterval = null;
            }

            videoCover.classList.remove('hidden');
            hideSpinner();

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'Error al reproducir el contenido.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR DE REPRODUCCIÓN';
            errText.textContent = msg;

            errorView.classList.add('active');

            try {
                if (player) player.src = '';
                if (ytIframe) ytIframe.src = 'about:blank';
            } catch (e) {}

            console.error(`[Player Error] Code: ${code} | Video: ${currentVid}`);
            postToParent({ type: 'error', videoId: currentVid, code: code, message: msg });
        }

        function reportDurationNow() {
            const dur = (player && Number(player.duration) > 0) ? Number(player.duration) : 0;
            if (dur > 0) {
                postToParent({ type: 'duration', videoId: currentVid, duration: dur });
                return true;
            }
            return false;
        }

        function triggerPlaybackStarted() {
            if (hasActiveError || isRealPlaybackActive) return;
            isRealPlaybackActive = true;

            if (autoPlayCheckInterval) {
                clearInterval(autoPlayCheckInterval);
                autoPlayCheckInterval = null;
            }
            
            // Destapar el video y ocultar spinner
            videoCover.classList.add('hidden');
            hideSpinner();
            errorView.classList.remove('active');

            // Solo enviar 'ready' cuando tengamos una duración real disponible.
            // Si aún no la hay, reintentar hasta obtenerla (evita reportar duration 0 al padre).
            if (!reportedReady) {
                if (reportDurationNow()) {
                    reportedReady = true;
                    const pos = (player && Number(player.currentTime) > 0) ? Number(player.currentTime) : 0;
                    postToParent({ type: 'ready', videoId: currentVid, duration: player.duration, time: pos });
                } else if (!pendingDurationTimer) {
                    pendingDurationTimer = setInterval(function () {
                        if (hasActiveError) { clearPendingDuration(); return; }
                        const dur = (player && Number(player.duration) > 0) ? Number(player.duration) : 0;
                        if (dur > 0) {
                            reportedReady = true;
                            const pos = (player && Number(player.currentTime) > 0) ? Number(player.currentTime) : 0;
                            postToParent({ type: 'ready', videoId: currentVid, duration: dur, time: pos });
                            clearPendingDuration();
                        } else if (player.paused && isRealPlaybackActive) {
                            // Si el video está pausado (autoplay bloqueado pero carga OK) sin error,
                            // aún así reportamos duración cuando esté disponible; reintentamos.
                        }
                    }, 700);
                }
            }

            startProgressReport();
        }

        function clearPendingDuration() {
            if (pendingDurationTimer) {
                clearInterval(pendingDurationTimer);
                pendingDurationTimer = null;
            }
        }

        function startProgressReport() {
            if (progressReportInterval) clearInterval(progressReportInterval);
            progressReportInterval = setInterval(function () {
                if (!isRealPlaybackActive || hasActiveError) {
                    clearInterval(progressReportInterval);
                    progressReportInterval = null;
                    return;
                }
                const t = (player && Number(player.currentTime)) || 0;
                const d = (player && Number(player.duration)) || 0;
                try {
                    postToParent({ type: 'progress', videoId: currentVid, time: t, duration: d, playing: !player.paused });
                } catch (e) {}
            }, 1000);
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } catch (e) {}
        }

        function startAutoplayWatchdog() {
            if (autoPlayCheckInterval) clearInterval(autoPlayCheckInterval);
            autoPlayCheckInterval = setInterval(function () {
                if (hasActiveError || isRealPlaybackActive) {
                    clearInterval(autoPlayCheckInterval);
                    autoPlayCheckInterval = null;
                    return;
                }
                if (lastExpectedAutoplay && player && player.paused) {
                    safePlay();
                }
            }, 800);
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                showSpinner();
                videoCover.classList.remove('hidden');
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
                if (startTime > 0) {
                    const onInitialReady = function () {
                        player.removeEventListener('can-play', onInitialReady);
                        player.currentTime = startTime;
                    };
                    player.addEventListener('can-play', onInitialReady);
                }
                startAutoplayWatchdog();
            } else {
                hideSpinner();
            }

            // Eventos nativos de Vidstack
            player.addEventListener('playing', function(){ console.log('[X] playing, ct=', player.currentTime, 'vid=', currentVid); triggerPlaybackStarted(); });

            player.addEventListener('time-update', function() {
                if (!isRealPlaybackActive && player.currentTime > 0) {
                    triggerPlaybackStarted();
                }
            });

            player.addEventListener('waiting', function() {
                if (!hasActiveError && !isRealPlaybackActive) {
                    showSpinner();
                }
            });

            player.addEventListener('error', function(event) {
                const detail = event && event.detail;
                const err = (detail && (detail.code || detail.message || detail.error)) || 'Playback Error';
                console.warn('[X] media ERROR', event, 'code=', err);
                triggerError(err);
            });
            ['loadedmetadata','loadeddata','canplay','canplaythrough','stalled','suspend','abort','emptied','loadstart','progress'].forEach(function (evName) {
                player.addEventListener(evName, function () {
                    console.log('[X] event', evName, 'ct=', player.currentTime, 'dur=', player.duration, 'err=', player.error ? (player.error.code + ':' + player.error.message) : '-', 'vid=', currentVid);
                });
            });

            player.addEventListener('ended', function () {
                if (!endedReported) {
                    console.log('[X] ENDED fired, currentTime=', player.currentTime, 'duration=', player.duration, 'vid=', currentVid);
                    endedReported = true;
                    isRealPlaybackActive = false;
                    lastExpectedAutoplay = false;
                    clearPendingDuration();
                    if (progressReportInterval) {
                        clearInterval(progressReportInterval);
                        progressReportInterval = null;
                    }
                    if (autoPlayCheckInterval) {
                        clearInterval(autoPlayCheckInterval);
                        autoPlayCheckInterval = null;
                    }
                    try { player.pause(); } catch (e) {}
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            // Reportar la duración real apenas esté disponible (solución de raíz para el "N/A")
            player.addEventListener('durationchange', function () {
                reportDurationNow();
            });
            player.addEventListener('loaded-metadata', function () {
                reportDurationNow();
            });

            // Escucha directa de mensajes
            window.addEventListener('message', function (ev) {
                if (typeof ev.data === 'string' && (ev.data.includes('onError') || ev.data.includes('onStateChange') || ev.data.includes('infoDelivery'))) {
                    console.log('[X] YT-msg', ev.data.slice(0, 160));
                }
                if (typeof ev.data === 'string' && !ev.data.includes('voice-eva')) {
                    if (ev.data.includes('onError')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            if (ytData.event === 'onError' && ytData.info) {
                                triggerError(ytData.info);
                            }
                        } catch (e) {}
                    }
                    if (ev.data.includes('onStateChange') || ev.data.includes('infoDelivery')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            const state = ytData.info && ytData.info.playerState !== undefined ? ytData.info.playerState : ytData.info;
                            if (state === 1) { // PLAYING
                                triggerPlaybackStarted();
                            }
                        } catch (e) {}
                    }
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                console.log('[X] LOAD', data.videoId, 'autoplay=', data.autoplay, 'time=', data.time);
                                hasActiveError = false;
                                isRealPlaybackActive = false;
                                clearPendingDuration();
                                if (progressReportInterval) {
                                    clearInterval(progressReportInterval);
                                    progressReportInterval = null;
                                }
                                
                                videoCover.classList.remove('hidden');
                                errorView.classList.remove('active');
                                
                                currentVid = data.videoId;
                                endedReported = false;
                                reportedReady = false;
                                
                                showSpinner();
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (typeof data.time !== 'undefined' && Number(data.time) > 0) {
                                        player.currentTime = Number(data.time);
                                    }
                                    // Reportar la duración real apenas esté disponible para evitar "N/A"
                                    reportDurationNow();
                                    if (lastExpectedAutoplay && !hasActiveError) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                                startAutoplayWatchdog();
                            }
                            break;
                        case 'play':
                            if (!hasActiveError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'show_error':
                            hasActiveError = true;
                            isRealPlaybackActive = false;
                            lastExpectedAutoplay = false;
                            if (autoPlayCheckInterval) {
                                clearInterval(autoPlayCheckInterval);
                                autoPlayCheckInterval = null;
                            }
                            clearPendingDuration();
                            if (progressReportInterval) {
                                clearInterval(progressReportInterval);
                                progressReportInterval = null;
                            }
                            videoCover.classList.remove('hidden');
                            hideSpinner();
                            errCode.textContent = 'ERROR DE REPRODUCCIÓN';
                            errText.textContent = 'No se pudo reproducir este video (posible restricción).';
                            errorView.classList.add('active');
                            try {
                                if (player) player.src = '';
                                if (ytIframe) ytIframe.src = 'about:blank';
                            } catch (e) {}
                            console.log('[X] show_error forzado por el room');
                            break;
                        case 'seek':
                            if (player && typeof data.time !== 'undefined') {
                                // Al mover el video se resetea el estado de "terminado"
                                // para que pueda volver a reproducirse y detectar su final de nuevo.
                                endedReported = false;
                                isRealPlaybackActive = false;
                                player.currentTime = Number(data.time) || 0;
                                clearPendingDuration();
                                if (lastExpectedAutoplay && !hasActiveError) {
                                    safePlay();
                                }
                                startAutoplayWatchdog();
                            }
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
