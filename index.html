<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        /* El reproductor permanece oculto hasta que el video empiece realmente */
        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            --media-font-family: inherit;
        }

        #rmExternalPlayer.is-playing {
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* --- Spinner Minimalista --- */
        .minimal-spinner {
            position: absolute;
            z-index: 50;
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .minimal-spinner.active {
            display: block !important;
            opacity: 1 !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Error Minimalista --- */
        .minimal-error {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .minimal-error.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .error-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #777777;
            margin-bottom: 8px;
        }

        .error-msg {
            font-size: 14px;
            font-weight: 400;
            color: #e5e5e5;
            max-width: 320px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Spinner -->
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <!-- Pantalla de Error -->
        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <!-- Reproductor Vidstack -->
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="silent" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <media-provider keep-alive="" data-media-provider="">
                <iframe id="ytIframe" tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const player = document.getElementById('rmExternalPlayer');
        const ytIframe = document.getElementById('ytIframe');

        // Elementos UI
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        // Estados
        let hasActiveError = false;
        let isRealPlaybackActive = false;
        let currentVid = videoId || null;
        let lastExpectedAutoplay = autoplay === '1';
        let endedReported = false;
        let reportedReady = false;

        const ERRORS_MAP = {
            150: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            101: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            100: 'El video no existe o fue configurado como privado.',
            2: 'El enlace o identificador de video no es válido.',
            5: 'Error de formato en el reproductor HTML5.'
        };

        function showSpinner() {
            if (!hasActiveError && !isRealPlaybackActive) {
                spinner.classList.add('active');
            }
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            isRealPlaybackActive = false;
            lastExpectedAutoplay = false;

            // Asegurar que el iframe de YouTube permanezca oculto
            player.classList.remove('is-playing');
            hideSpinner();

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'Error al reproducir el contenido.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR DE REPRODUCCIÓN';
            errText.textContent = msg;

            // Mostrar nuestro diseño de error
            errorView.classList.add('active');

            // Destruir el iframe para cortar cualquier proceso o renderizado interno
            try {
                if (player) player.src = '';
                if (ytIframe) ytIframe.src = 'about:blank';
            } catch (e) {}

            console.error(`[Player Error] Code: ${code} | Video: ${currentVid}`);
            postToParent({ type: 'error', videoId: currentVid, code: code, message: msg });
        }

        function triggerPlaybackStarted() {
            if (hasActiveError) return;
            isRealPlaybackActive = true;
            
            // Mostrar reproductor cuando los fotogramas ya están activos
            player.classList.add('is-playing');
            hideSpinner();
            errorView.classList.remove('active');

            if (!reportedReady) {
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                showSpinner();
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
            } else {
                hideSpinner();
            }

            // Solo mostramos el video cuando esté corriendo de verdad
            player.addEventListener('playing', function() {
                triggerPlaybackStarted();
            });

            player.addEventListener('time-update', function() {
                if (!isRealPlaybackActive && player.currentTime > 0) {
                    triggerPlaybackStarted();
                }
            });

            // Si entra en buffer y no hay error, mostrar spinner
            player.addEventListener('waiting', function() {
                if (!hasActiveError && !isRealPlaybackActive) {
                    showSpinner();
                }
            });

            player.addEventListener('error', function(event) {
                const detail = event && event.detail;
                const err = (detail && (detail.code || detail.message || detail.error)) || 'Playback Error';
                triggerError(err);
            });

            player.addEventListener('ended', function () {
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            // Reintento de autoplay seguro
            setInterval(function () {
                if (lastExpectedAutoplay && !hasActiveError && !isRealPlaybackActive && player.paused) {
                    safePlay();
                }
            }, 2000);

            // Escucha de mensajes
            window.addEventListener('message', function (ev) {
                // Captura inmediata de error 150 / 101 desde YouTube
                if (typeof ev.data === 'string' && ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.event === 'onError' && ytData.info) {
                            triggerError(ytData.info);
                        }
                    } catch (e) {}
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                hasActiveError = false;
                                isRealPlaybackActive = false;
                                
                                // Ocultar reproductor y error previo
                                player.classList.remove('is-playing');
                                errorView.classList.remove('active');
                                
                                currentVid = data.videoId;
                                endedReported = false;
                                reportedReady = false;
                                
                                // Mantener spinner activo durante la carga
                                showSpinner();
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (lastExpectedAutoplay && !hasActiveError) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                            }
                            break;
                        case 'play':
                            if (!hasActiveError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
