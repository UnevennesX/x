<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* El reproductor empieza oculto para que no se vea el pause/buffer inicial */
    #playerContainer {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Se hace visible solo cuando ya está reproduciendo */
    #playerContainer.ready-playing {
      opacity: 1;
    }

    #player, iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
    }

    /* Cartel flotante para activar el sonido */
    #soundHint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #soundHint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #msg {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #msg.show {
      display: grid;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="playerContainer">
      <div id="player"></div>
    </div>

    <div id="soundHint">🔊 Toca para activar el sonido</div>
    <div id="msg">
      Falta el parámetro <code>?v=VIDEO_ID</code> en la URL.
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialVideoId = (params.get("v") || "").trim();
    // Por defecto autoplay activado si no se especifica lo contrario
    const initialAutoplay = params.get("autoplay") !== "0"; 
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const playerContainer = document.getElementById("playerContainer");
    const soundHint = document.getElementById("soundHint");
    const msg = document.getElementById("msg");

    let player = null;
    let isApiReady = false;
    let currentVideoId = "";
    let wantsAutoplay = false;
    let pendingSeek = 0;
    let endedReported = false;
    let soundUnlocked = false;
    let timeInterval = null;

    function post(m) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, m),
          "*"
        );
      } catch {}
    }

    function showHint() { soundHint.classList.add("show"); }
    function hideHint() { soundHint.classList.remove("show"); }

    function unlockSound() {
      if (soundUnlocked || !player) return;
      soundUnlocked = true;
      try {
        player.unMute();
        if (player.getVolume() === 0) player.setVolume(100);
      } catch {}
      try { player.playVideo(); } catch {}
      hideHint();
      window.removeEventListener("pointerdown", unlockSound);
      window.removeEventListener("keydown", unlockSound);
      window.removeEventListener("touchstart", unlockSound);
    }

    function armUnlockOnFirstInteraction() {
      window.addEventListener("pointerdown", unlockSound, { passive: true });
      window.addEventListener("keydown", unlockSound);
      window.addEventListener("touchstart", unlockSound, { passive: true });
    }

    function startTimeTracker() {
      stopTimeTracker();
      timeInterval = setInterval(() => {
        if (player && typeof player.getCurrentTime === "function") {
          try {
            post({
              type: "time-update",
              videoId: currentVideoId,
              time: Number(player.getCurrentTime()) || 0,
              duration: Number(player.getDuration()) || 0
            });
          } catch {}
        }
      }, 250);
    }

    function stopTimeTracker() {
      if (timeInterval) {
        clearInterval(timeInterval);
        timeInterval = null;
      }
    }

    window.onYouTubeIframeAPIReady = function() {
      isApiReady = true;
      if (initialVideoId) {
        loadVideo(initialVideoId, initialAutoplay, initialTime);
      } else {
        msg.classList.add("show");
      }
    };

    function createPlayer(videoId) {
      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          autoplay: 1,      // Siempre fuerza autoplay
          mute: 1,          // CLAVE: Arranca muteado para que el navegador NUNCA lo pause
          controls: 1,      // Menú nativo con selector de calidad
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (event) => {
            if (pendingSeek > 0) {
              try { event.target.seekTo(pendingSeek, true); } catch {}
              pendingSeek = 0;
            }

            post({ type: "ready", videoId: currentVideoId });

            // Forzar inicio inmediato
            try {
              event.target.playVideo();
            } catch {}

            // Intentar desmutear; si el navegador lo permite lo deja con audio, si no, espera al primer clic
            try {
              event.target.unMute();
              soundUnlocked = true;
            } catch {
              showHint();
              armUnlockOnFirstInteraction();
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              endedReported = false;
              // Revelar el video suavemente solo cuando ya está rodando
              playerContainer.classList.add("ready-playing");
              startTimeTracker();

              // Si está silenciado, mostramos el aviso para activar sonido
              if (player.isMuted && player.isMuted()) {
                showHint();
                armUnlockOnFirstInteraction();
              } else {
                hideHint();
              }

              post({
                type: "state",
                state: "playing",
                videoId: currentVideoId,
                time: Number(player.getCurrentTime()) || 0
              });
            } else if (event.data === YT.PlayerState.PAUSED) {
              stopTimeTracker();
              post({
                type: "state",
                state: "paused",
                videoId: currentVideoId,
                time: Number(player.getCurrentTime()) || 0
              });
            } else if (event.data === YT.PlayerState.ENDED) {
              stopTimeTracker();
              if (!endedReported) {
                endedReported = true;
                post({
                  type: "ended",
                  videoId: currentVideoId,
                  time: Number(player.getDuration()) || 0
                });
              }
            }
          },
          onError: (event) => {
            playerContainer.classList.add("ready-playing");
            post({
              type: "error",
              videoId: currentVideoId,
              code: event.data,
              message: "Error al reproducir el video."
            });
          }
        }
      });
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      currentVideoId = String(id).trim();
      wantsAutoplay = !!autoplay;
      pendingSeek = Math.max(0, Number(time) || 0);
      endedReported = false;

      if (!isApiReady) return;

      if (!player) {
        createPlayer(currentVideoId);
      } else {
        // Al cambiar de video, ocultamos un momento hasta que arranque el nuevo
        playerContainer.classList.remove("ready-playing");
        player.loadVideoById({
          videoId: currentVideoId,
          startSeconds: pendingSeek
        });
      }
    }

    // Receptor de mensajes del padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva" || !player) return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, !!data.autoplay, Number(data.time) || 0);
          break;
        case "play":
          try { player.playVideo(); } catch {}
          break;
        case "pause":
          try { player.pauseVideo(); } catch {}
          break;
        case "stop":
          try {
            player.stopVideo();
            endedReported = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time))) {
            try { player.seekTo(Number(data.time), true); } catch {}
          }
          break;
        case "mute":
          try { player.mute(); } catch {}
          break;
        case "unmute":
          try { player.unMute(); } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v)) {
            try { player.setVolume(Math.min(100, Math.max(0, v))); } catch {}
          }
          break;
        }
      }
    });
  </script>
</body>
</html>
