<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidstack - Solo Calidad Oficial</title>

  <!-- 1. Hojas de estilo oficiales del Default Theme -->
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />

  <!-- 2. Registro de elementos e iconos oficiales -->
  <script type="module" src="https://cdn.vidstack.io/player"></script>
  <script type="module" src="https://cdn.vidstack.io/player/icons"></script>

  <style>
    /* Contenedor responsivo */
    .player-box {
      max-width: 900px;
      margin: 2rem auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Ubicar el grupo de controles arriba a la derecha */
    .vds-controls-group.top-right {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="player-box">
    <!-- 
      - load="visible": Estrategia de carga diferida oficial (Lazy load al entrar al viewport)
      - src="youtube/ID": Provider oficial de YouTube con preconexiones automáticas
      - aspect-ratio="16/9": Evita Cumulative Layout Shift (CLS)
    -->
    <media-player
      src="youtube/M7lc1UVf-VE"
      load="visible"
      aspect-ratio="16/9"
    >
      <media-provider></media-provider>

      <!-- Contenedor de controles oficial -->
      <media-controls class="vds-controls">
        <media-controls-group class="vds-controls-group top-right">
          
          <!-- Menú oficial de ajustes / calidad -->
          <media-menu class="vds-menu">
            
            <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video">
              <media-icon class="vds-icon" type="settings"></media-icon>
            </media-menu-button>

            <media-menu-items class="vds-menu-items">
              <media-quality-radio-group class="vds-radio-group">
                <template>
                  <media-radio class="vds-radio">
                    <media-icon class="vds-icon" type="radio-check"></media-icon>
                    <span class="vds-radio-label" data-part="label"></span>
                    <span class="vds-badge" data-part="bitrate"></span>
                  </media-radio>
                </template>
              </media-quality-radio-group>
            </media-menu-items>

          </media-menu>

        </media-controls-group>
      </media-controls>
    </media-player>
  </div>

</body>
</html>
