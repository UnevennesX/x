<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música YouTube</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .input-group {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .input-group button {
      padding: 10px 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .input-group button:hover {
      background: #4f46e5;
    }

    .thumbnail-container {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Iframe de YouTube minimizado o visible según prefieras */
    #youtube-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0; /* Oculto visualmente pero activo */
      pointer-events: none;
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-control {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-control:active {
      transform: scale(0.9);
    }

    .btn-play {
      background: var(--primary);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    .volume-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .volume-bar {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #334155;
      cursor: pointer;
    }

    .volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Input para pegar el enlace o ID -->
    <div class="input-group">
      <input type="text" id="videoUrlInput" placeholder="Pega el enlace o ID de YouTube...">
      <button id="loadBtn">Cargar</button>
    </div>

    <!-- Contenedor del reproductor / portada -->
    <div class="thumbnail-container">
      <img id="trackThumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Portada">
      <div id="youtube-player"></div>
    </div>

    <!-- Título -->
    <div class="track-info">
      <p class="track-title" id="trackTitle">Sin reproducir</p>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-container">
      <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <!-- Botones de Control -->
    <div class="controls">
      <button class="btn-control" id="prev10Btn">⏪ 10s</button>
      <button class="btn-control btn-play" id="playBtn">▶</button>
      <button class="btn-control" id="next10Btn">10s ⏩</button>
    </div>

    <!-- Volumen -->
    <div class="volume-container">
      <span>🔈</span>
      <input type="range" class="volume-bar" id="volumeBar" value="100" min="0" max="100">
      <span>🔊</span>
    </div>
  </div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;

    // 1. Inicializar la API de YouTube
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: 'dQw4w9WgXcQ', // Video inicial por defecto
        playerVars: {
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2. Extraer Video ID de cualquier formato de URL de YouTube
    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    // 3. Formatear segundos a MM:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function onPlayerReady(event) {
      updateTrackInfo();
    }

    function onPlayerStateChange(event) {
      const playBtn = document.getElementById('playBtn');
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = '⏸';
        startProgressTracker();
        updateTrackInfo();
      } else {
        isPlaying = false;
        playBtn.textContent = '▶';
        clearInterval(updateTimer);
      }
    }

    function updateTrackInfo() {
      if (!player || !player.getVideoData) return;
      const data = player.getVideoData();
      if (data && data.title) {
        document.getElementById('trackTitle').textContent = data.title;
      }
      if (data && data.video_id) {
        document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      }
      const duration = player.getDuration();
      document.getElementById('totalDuration').textContent = formatTime(duration);
    }

    function startProgressTracker() {
      clearInterval(updateTimer);
      updateTimer = setInterval(() => {
        if (player && isPlaying) {
          const currentTime = player.getCurrentTime();
          const duration = player.getDuration();
          
          document.getElementById('currentTime').textContent = formatTime(currentTime);
          if (duration > 0) {
            document.getElementById('progressBar').value = (currentTime / duration) * 100;
          }
        }
      }, 500);
    }

    // --- Controladores de eventos de la interfaz ---

    // Play / Pausa
    document.getElementById('playBtn').addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    // Cargar nuevo video desde el Input
    document.getElementById('loadBtn').addEventListener('click', () => {
      const urlInput = document.getElementById('videoUrlInput').value.trim();
      const videoId = extractVideoId(urlInput);

      if (videoId && player) {
        player.loadVideoById(videoId);
        document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      } else {
        alert('Ingresa una URL o ID de video válido.');
      }
    });

    // Buscar en la barra de progreso (Seek)
    document.getElementById('progressBar').addEventListener('input', (e) => {
      if (!player) return;
      const duration = player.getDuration();
      const seekTo = (e.target.value / 100) * duration;
      player.seekTo(seekTo, true);
    });

    // Retroceder / Avanzar 10 segundos
    document.getElementById('prev10Btn').addEventListener('click', () => {
      if (!player) return;
      player.seekTo(player.getCurrentTime() - 10, true);
    });

    document.getElementById('next10Btn').addEventListener('click', () => {
      if (!player) return;
      player.seekTo(player.getCurrentTime() + 10, true);
    });

    // Control de volumen
    document.getElementById('volumeBar').addEventListener('input', (e) => {
      if (!player) return;
      player.setVolume(e.target.value);
    });
  </script>
</body>
</html>
