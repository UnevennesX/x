<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Vidstack Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    <script type="module" src="https://cdn.vidstack.io/icons"></script>
</head>
<body>
    <div id="playerHost" style="max-width:860px;margin:auto;">
        <media-player
            src="youtube/{{ video_id }}"
            load="visible"
            aspect-ratio="16/9"
            playsinline
        >
            <media-provider></media-provider>
            <media-controls class="vds-controls">
                <media-controls-group class="vds-controls-group top-right">
                    <media-menu class="vds-menu">
                        <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video">
                            <media-icon class="vds-icon" type="settings"></media-icon>
                        </media-menu-button>
                        <media-menu-items class="vds-menu-items">
                            <media-quality-radio-group class="vds-radio-group">
                                <template>
                                    <media-radio class="vds-radio">
                                        <media-icon class="vds-icon" type="radio-check"></media-icon>
                                        <span class="vds-radio-label" data-part="label"></span>
                                        <span class="vds-badge" data-part="bitrate"></span>
                                    </media-radio>
                                </template>
                            </media-quality-radio-group>
                        </media-menu-items>
                    </media-menu>
                </media-controls-group>
            </media-controls>
        </media-player>
    </div>
</body>
</html>
