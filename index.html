<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    
    <!-- Librería de Vidstack Player -->
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
    <script type="module" src="https://cdn.vidstack.io/player"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        #playerHost {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Ocultamiento estricto hasta confirmar reproducción real */
        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        #rmExternalPlayer.vds-visible {
            opacity: 1;
        }

        /* Cortina de carga protectora */
        .rm-curtain {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .rm-curtain.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Spinner de carga */
        .rm-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: rm-spin 0.8s linear infinite;
        }

        @keyframes rm-spin {
            to { transform: rotate(360deg); }
        }

        /* Pantalla de Error Centrada */
        .rm-error-overlay {
            position: absolute;
            inset: 0;
            background: #0f0f0f;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: #fff;
            gap: 12px;
        }

        .rm-error-overlay.active {
            display: flex;
        }

        /* Ícono nativo centrado */
        .rm-yt-icon {
            width: 56px;
            height: 56px;
            fill: #ff0000;
            margin-bottom: 4px;
        }

        .rm-yt-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f1f1f1;
        }

        .rm-yt-reason {
            font-size: 0.9rem;
            color: #aaa;
            max-width: 360px;
            line-height: 1.4;
        }

        /* Mensaje de cuenta regresiva centrado */
        .rm-yt-countdown-msg {
            display: none;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .rm-yt-countdown-msg.visible {
            display: block;
        }

        .rm-skip-btn {
            margin-top: 10px;
            background: #272727;
            color: #fff;
            border: 1px solid #3f3f3f;
            padding: 8px 18px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .rm-skip-btn:hover {
            background: #3f3f3f;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Cortina de carga -->
        <div id="rmCurtain" class="rm-curtain">
            <div class="rm-spinner"></div>
        </div>

        <!-- Reproductor limpio sin botones que no respondan -->
        <media-player 
            id="rmExternalPlayer" 
            class="vds-player" 
            load="eager" 
            view-type="video" 
            stream-type="on-demand" 
            log-level="warn" 
            crossorigin="" 
            playsinline="" 
            data-media-player="" 
            tabindex="0" 
            role="region" 
            aria-label="Video Player" 
            data-orientation="landscape">
            
            <media-provider></media-provider>
            
            <media-controls class="vds-controls" role="group" style="pointer-events: none;">
                <media-controls-group class="vds-controls-group top-right" style="pointer-events: auto;">
                    <media-menu class="vds-menu" data-root="" data-disabled="" style="display: contents;">
                        <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video" tabindex="0" role="button" id="media-menu-button-1" aria-haspopup="menu" aria-expanded="false" data-root="" aria-disabled="true" type="button">
                            <media-icon class="vds-icon" type="settings"></media-icon>
                        </media-menu-button>
                    </media-menu>
                </media-controls-group>
            </media-controls>
        </media-player>

        <!-- Pantalla de Error Centrada -->
        <div id="errorOverlay" class="rm-error-overlay">
            <svg class="rm-yt-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <div id="errorTitle" class="rm-yt-title">Video no disponible</div>
            <div id="errorReason" class="rm-yt-reason">Restringido por derechos de autor.</div>
            <div id="countdownBox" class="rm-yt-countdown-msg">
                Pasando al siguiente en <span id="countdownSecs">3</span>s...
            </div>
            <button class="rm-skip-btn" onclick="skipVideo()">Saltar video</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoId = urlParams.get('v') || urlParams.get('videoId') || '';
        const autoplay = urlParams.get('autoplay') || '1';
        const startTime = Math.max(0, Number(urlParams.get('t') || urlParams.get('start')) || 0);

        const player = document.getElementById('rmExternalPlayer');
        const curtain = document.getElementById('rmCurtain');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorTitle = document.getElementById('errorTitle');
        const errorReason = document.getElementById('errorReason');
        const countdownBox = document.getElementById('countdownBox');
        const countdownSecs = document.getElementById('countdownSecs');

        let currentVid = videoId;
        let isFatalError = false;
        let hasNextInQueue = false;
        let endedThisVideo = false;
        let endedReported = false;
        let reportedReady = false;
        let lastExpectedAutoplay = (autoplay === '1');
        
        let hangWatchdog = null;
        let countdownTimer = null;

        function postToParent(msg) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'room-player', ...msg }, '*');
                }
            } catch (e) {}
        }

        function showCurtain() {
            curtain.classList.remove('hidden');
            player.classList.remove('vds-visible');
        }

        function hideCurtain() {
            curtain.classList.add('hidden');
            player.classList.add('vds-visible');
        }

        function hideOverlay() {
            errorOverlay.classList.remove('active');
            countdownBox.classList.remove('visible');
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            isFatalError = false;
        }

        function startHangWatchdog() {
            clearHangWatchdog();
            hangWatchdog = setTimeout(function () {
                if (!reportedReady && !isFatalError) {
                    triggerCustomError(150);
                }
            }, 12000);
        }

        function clearHangWatchdog() {
            if (hangWatchdog) {
                clearTimeout(hangWatchdog);
                hangWatchdog = null;
            }
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            let count = 3;
            countdownSecs.textContent = count;
            countdownBox.classList.add('visible');

            countdownTimer = setInterval(function () {
                count--;
                if (count <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    skipVideo();
                } else {
                    countdownSecs.textContent = count;
                }
            }, 1000);
        }

        function triggerCustomError(code) {
            clearHangWatchdog();
            isFatalError = true;

            // Ocultar iframe de YouTube para evitar destellos
            player.classList.remove('vds-visible');
            curtain.classList.add('hidden');

            errorTitle.textContent = 'Video no disponible';
            errorReason.textContent = 'Restringido o no disponible para reproducir aquí.';
            errorOverlay.classList.add('active');

            try { player.pause(); } catch (e) {}
            postToParent({ type: 'error', code: Number(code) || 150, videoId: currentVid });

            if (hasNextInQueue) {
                startCountdown();
            } else {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                countdownBox.classList.remove('visible');
            }
        }

        function skipVideo() {
            hideOverlay();
            clearHangWatchdog();
            postToParent({ type: 'skip_fatal', videoId: currentVid });
        }

        // Intercepción inmediata de eventos y mensajes de YouTube
        window.addEventListener('message', function (ev) {
            try {
                let data = ev.data;
                if (typeof data === 'string') data = JSON.parse(data);
                if (data) {
                    if (data.event === 'onError' || [2, 5, 100, 101, 150, 153, 155].includes(Number(data.info))) {
                        const code = data.info || (data.data && data.data.code) || 150;
                        triggerCustomError(code);
                    }
                }
            } catch (err) {}
        });

        function safePlay() {
            if (!player || isFatalError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') p.catch(function () {});
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                showCurtain();
                player.src = 'youtube/' + videoId;
                startHangWatchdog();

                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
                if (startTime > 0) {
                    const onReadySeek = function () {
                        player.removeEventListener('can-play', onReadySeek);
                        try { player.currentTime = startTime; } catch (e) {}
                    };
                    player.addEventListener('can-play', onReadySeek);
                }
            }

            function onPlaybackSuccess() {
                if (isFatalError) return;
                clearHangWatchdog();
                hideOverlay();
                hideCurtain();
                if (!reportedReady) {
                    reportedReady = true;
                    postToParent({ type: 'ready' });
                }
            }

            player.addEventListener('can-play', onPlaybackSuccess);
            player.addEventListener('playing', onPlaybackSuccess);
            player.addEventListener('time-update', function () {
                if (player.currentTime > 0.05 && !isFatalError) {
                    onPlaybackSuccess();
                }
            });

            player.addEventListener('error', function (ev) {
                const detail = ev.detail || ev;
                let ytCode = 150;
                if (detail) {
                    if (typeof detail.code === 'number') ytCode = detail.code;
                    else if (typeof detail.data === 'number') ytCode = detail.data;
                    else if (detail.cause && typeof detail.cause.data === 'number') ytCode = detail.cause.data;
                }
                triggerCustomError(ytCode);
            });

            player.addEventListener('ended', function () {
                endedThisVideo = true;
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            function reportDuration() {
                const d = player.duration;
                if (d && isFinite(d) && d > 0 && !isFatalError) {
                    postToParent({ type: 'duration', videoId: currentVid, duration: d });
                    return true;
                }
                return false;
            }

            let durRetry = 0;
            let reportInterval = null;
            function scheduleReportDuration() {
                durRetry = 0;
                if (reportInterval) clearInterval(reportInterval);
                reportInterval = setInterval(function () {
                    if (reportDuration()) {
                        clearInterval(reportInterval);
                        reportInterval = null;
                    } else {
                        durRetry++;
                        if (durRetry > 30) {
                            clearInterval(reportInterval);
                            reportInterval = null;
                        }
                    }
                }, 1000);
            }

            player.addEventListener('durationchange', reportDuration);
            player.addEventListener('duration-change', reportDuration);
            player.addEventListener('loadedmetadata', reportDuration);
            player.addEventListener('can-play', scheduleReportDuration);

            // Verificador de auto-play
            setInterval(function () {
                if (endedThisVideo || isFatalError || errorOverlay.classList.contains('active')) {
                    lastExpectedAutoplay = false;
                    return;
                }

                try {
                    if (player.duration && player.currentTime >= player.duration - 1) {
                        endedThisVideo = true;
                        if (!endedReported) {
                            endedReported = true;
                            postToParent({ type: 'ended', videoId: currentVid });
                        }
                        lastExpectedAutoplay = false;
                        return;
                    }
                } catch (e) {}

                if (lastExpectedAutoplay && player.paused) {
                    safePlay();
                }
            }, 2500);

            // Mensajes recibidos desde room-music.js
            window.addEventListener('message', function (ev) {
                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId && data.videoId !== currentVid) {
                                hideOverlay();
                                showCurtain();
                                clearHangWatchdog();
                                currentVid = data.videoId;
                                hasNextInQueue = !!data.hasNext;
                                endedThisVideo = false;
                                endedReported = false;
                                player.src = 'youtube/' + data.videoId;
                                startHangWatchdog();

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const loadStart = Math.max(0, Number(data.time) || 0);
                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (loadStart > 0) {
                                        try { player.currentTime = loadStart; } catch (e) {}
                                    }
                                    if (lastExpectedAutoplay) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                                scheduleReportDuration();
                            }
                            break;

                        case 'queue_state':
                            hasNextInQueue = !!data.hasNext;
                            if (isFatalError && hasNextInQueue && !countdownTimer) {
                                startCountdown();
                            } else if (isFatalError && !hasNextInQueue && countdownTimer) {
                                clearInterval(countdownTimer);
                                countdownTimer = null;
                                countdownBox.classList.remove('visible');
                            }
                            break;

                        case 'play':
                            if (!isFatalError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                            if (!isFatalError) {
                                lastExpectedAutoplay = false;
                                try { player.pause(); } catch (e) {}
                            }
                            break;
                        case 'seek':
                            if (!isFatalError) {
                                player.currentTime = Math.max(0, Number(data.time) || 0);
                            }
                            break;
                        case 'stop':
                            hideOverlay();
                            showCurtain();
                            clearHangWatchdog();
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            player.currentTime = 0;
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
