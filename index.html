<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor con Telemetría de Errores</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f0f12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: #1a1a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    /* Contenedor responsivo 16:9 */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
    }

    .player-wrapper iframe,
    .player-wrapper #youtube-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Mensaje de Error (Inicialmente oculto) */
    .error-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1e1114, #12090b);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      z-index: 10;
    }

    .error-badge {
      background-color: #ff334b;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .error-overlay h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .error-overlay p {
      font-size: 0.95rem;
      color: #b0b0b8;
      max-width: 480px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn-fallback {
      display: inline-block;
      background-color: #ffffff;
      color: #000000;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .btn-fallback:hover {
      background-color: #e0e0e0;
    }

    .status-bar {
      padding: 12px 20px;
      font-size: 0.85rem;
      color: #7b7b8f;
      background-color: #14141c;
      border-top: 1px solid #242433;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Reproductor de Telemetría</h2>
      <span id="video-id-display" style="font-size: 0.8rem; color: #888;"></span>
    </div>

    <div class="player-wrapper">
      <!-- Div que reemplazará la API de YouTube por un Iframe -->
      <div id="youtube-player"></div>

      <!-- Pantalla de Error Controlada -->
      <div id="error-overlay" class="error-overlay">
        <div id="error-badge" class="error-badge">ERROR</div>
        <h3 id="error-title">No es posible reproducir</h3>
        <p id="error-desc">Ocurrió un problema al intentar reproducir este recurso.</p>
        <a id="error-action-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-fallback" style="display: none;">
          Ver en YouTube
        </a>
      </div>
    </div>

    <div class="status-bar" id="log-status">
      Estado: Esperando inicialización del reproductor...
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN
    // ==========================================
    const LOG_ENDPOINT = "https://voice-eva.koyeb.app/api/video-error-log";
    
    // Puedes pasar un video por la URL: ?v=ID o definir uno por defecto aquí
    const urlParams = new URLSearchParams(window.location.search);
    const VIDEO_ID = urlParams.get('v') || 'M7lc1UVf-VE'; // Cambia este ID por el que desees probar

    document.getElementById('video-id-display').textContent = `Video ID: ${VIDEO_ID}`;
    const statusText = document.getElementById('log-status');

    let player;

    // ==========================================
    // 1. INICIALIZAR REPRODUCTOR YOUTUBE
    // ==========================================
    function onYouTubeIframeAPIReady() {
      statusText.textContent = "Estado: Cargando reproductor...";
      player = new YT.Player('youtube-player', {
        videoId: VIDEO_ID,
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'origin': window.location.origin
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      statusText.textContent = "Estado: Reproductor listo. Sin errores detectados.";
    }

    // ==========================================
    // 2. CAPTURA DE ERRORES EXACTOS
    // ==========================================
    function onPlayerError(event) {
      const errorCode = event.data;
      
      // Clasificación técnica del código
      let errorType = "UNKNOWN_ERROR";
      let userFriendlyTitle = "Error de reproducción";
      let userFriendlyMessage = "No se pudo procesar el video solicitado.";

      switch (errorCode) {
        case 2:
          errorType = "INVALID_PARAMETER";
          userFriendlyTitle = "Parámetro Inválido (Error 2)";
          userFriendlyMessage = "El ID del video contiene caracteres inválidos.";
          break;
        case 5:
          errorType = "HTML5_PLAYER_ERROR";
          userFriendlyTitle = "Fallo HTML5 (Error 5)";
          userFriendlyMessage = "El reproductor interno no puede renderizar este formato.";
          break;
        case 100:
          errorType = "VIDEO_NOT_FOUND_OR_REMOVED";
          userFriendlyTitle = "Video no disponible (Error 100)";
          userFriendlyMessage = "El video ha sido eliminado o marcado como estrictamente privado.";
          break;
        case 101:
        case 150:
          // Caso exacto consultado: Restricción del autor
          errorType = "EMBED_RESTRICTED_BY_OWNER";
          userFriendlyTitle = `Restricción de Inserción (Error ${errorCode})`;
          userFriendlyMessage = "El autor del video ha bloqueado la reproducción embebida en sitios externos.";
          break;
        default:
          userFriendlyTitle = `Fallo de Reproducción (Error ${errorCode})`;
          userFriendlyMessage = "Ocurrió un error inesperado al reproducir el contenido.";
      }

      // Estructura del log para Koyeb
      const payload = {
        videoId: VIDEO_ID,
        errorCode: errorCode,
        errorType: errorType,
        sourceUrl: window.location.href,
        referrer: document.referrer || "direct",
        userAgent: navigator.userAgent,
        timestamp: new Date().toISOString()
      };

      // 1. Mostrar UI local inmediatamente (sin esperar al servidor)
      renderErrorUI(errorCode, userFriendlyTitle, userFriendlyMessage);

      // 2. Transmitir el log asíncronamente a tu servidor
      sendTelemetryLog(payload);
    }

    // ==========================================
    // 3. ENVÍO AL SERVIDOR EXTERNO (KOYEB)
    // ==========================================
    function sendTelemetryLog(data) {
      statusText.textContent = `Estado: Error ${data.errorCode} reportado. Notificando a Koyeb...`;
      
      const jsonPayload = JSON.stringify(data);
      const blob = new Blob([jsonPayload], { type: 'application/json' });

      // sendBeacon es la vía recomendada: no se cancela si el usuario recarga o cierra
      let sent = false;
      if (navigator.sendBeacon) {
        sent = navigator.sendBeacon(LOG_ENDPOINT, blob);
      }

      // Fallback con fetch y keepalive
      if (!sent) {
        fetch(LOG_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: jsonPayload,
          keepalive: true
        })
        .then(response => {
          statusText.textContent = `Estado: Servidor Koyeb notificó HTTP ${response.status}. Error registrado con éxito.`;
        })
        .catch(err => {
          console.error("Fallo al contactar Koyeb:", err);
          statusText.textContent = "Estado: Error local detectado, pero falló la conexión con el servidor de logs.";
        });
      } else {
        statusText.textContent = `Estado: Telemetría (Error ${data.errorCode}) despachada exitosamente al servidor.`;
      }
    }

    // ==========================================
    // 4. ACTUALIZACIÓN VISUAL
    // ==========================================
    function renderErrorUI(code, title, message) {
      const overlay = document.getElementById('error-overlay');
      const badge = document.getElementById('error-badge');
      const titleElem = document.getElementById('error-title');
      const descElem = document.getElementById('error-desc');
      const actionBtn = document.getElementById('error-action-btn');

      badge.textContent = `CÓDIGO ${code}`;
      titleElem.textContent = title;
      descElem.textContent = message;

      // Si es error 150 o 101, le ofrecemos al usuario saltar directamente a la fuente
      if (code === 150 || code === 101) {
        actionBtn.href = `https://www.youtube.com/watch?v=${VIDEO_ID}`;
        actionBtn.style.display = "inline-block";
      }

      // Mostrar el panel de error cubriendo el reproductor roto
      overlay.style.display = "flex";
    }
  </script>

  <!-- Carga asíncrona oficial de la API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
