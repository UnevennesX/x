<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referer nativo para YouTube: evita Error 153 -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Reproductor Externo</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #playerHost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #playerHost iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
<div id="playerHost"></div>
<script>
(function () {
    'use strict';

    var player = null;
    var playerReady = false;
    var ytReady = false;
    var currentVideo = null;
    var pendingCmds = [];
    var suppressNotifyUntil = 0;
    var wantPlaying = false;
    var mutedStart = false;
    var kickTimer = null;

    function params() { return new URLSearchParams(location.search); }
    function getVideoId() {
        var p = params();
        var v = p.get('v') || p.get('video') || p.get('id');
        return (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) ? v : null;
    }
    function getAutoplay() {
        var a = params().get('autoplay');
        return a === '1' || a === 'true';
    }

    function notify(obj) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(obj, '*');
            }
        } catch (e) {}
    }

    function suppressNotify(ms) { suppressNotifyUntil = Date.now() + (ms || 800); }

    function cmdLater(fn) {
        return function () {
            if (!playerReady || !player) { pendingCmds.push(fn); return; }
            try { fn(); } catch (e) {}
        };
    }

    var doPlay = cmdLater(function () { player.playVideo(); });
    var doPause = cmdLater(function () { player.pauseVideo(); });
    var doStop = cmdLater(function () { player.stopVideo(); });
    function doSeek(t) {
        var s = Math.max(0, Number(t) || 0);
        cmdLater(function () { player.seekTo(s, true); })();
    }
    function doVolume(v) {
        v = Math.max(0, Math.min(100, Number(v) || 0));
        cmdLater(function () { player.setVolume(v); })();
    }
    var doMute = cmdLater(function () { player.mute(); });
    var doUnmute = cmdLater(function () { player.unMute(); });

    function doLoad(msg) {
        var vid = msg && msg.videoId;
        if (!vid || !/^[a-zA-Z0-9_-]{11}$/.test(vid)) return;
        var startAt = Math.max(0, Number(msg && msg.time) || 0);
        var ap = !!(msg && msg.autoplay);
        suppressNotify();
        if (!playerReady || !player) {
            ensurePlayer();
            pendingCmds.push(function () { doLoadNow(vid, startAt, ap); });
            return;
        }
        doLoadNow(vid, startAt, ap);
    }

    function doLoadNow(vid, startAt, ap) {
        currentVideo = vid;
        wantPlaying = ap;
        stopKickWatchdog();
        startHeartbeat();
        try {
            if (ap) {
                player.loadVideoById({ videoId: vid, startSeconds: startAt });
                startKickWatchdog();
            } else {
                player.cueVideoById({ videoId: vid, startSeconds: startAt });
            }
        } catch (e) {}
    }

    function startKickWatchdog() {
        stopKickWatchdog();
        var tries = 0;
        kickTimer = setInterval(function () {
            tries++;
            if (!wantPlaying || !playerReady || !player) { stopKickWatchdog(); return; }
            var ps = -1;
            try { ps = player.getPlayerState(); } catch (e) {}
            if (ps === 1 || ps === 3) { stopKickWatchdog(); return; }
            if (tries > 8) { stopKickWatchdog(); return; }
            try {
                if (!mutedStart) {
                    mutedStart = true;
                    player.mute();
                    notify({ cmd: 'autoplay_blocked', videoId: currentVideo });
                }
                player.playVideo();
            } catch (e) {}
        }, 500);
    }
    function stopKickWatchdog() {
        if (kickTimer) { clearInterval(kickTimer); kickTimer = null; }
    }

    function armUnmuteOnGesture() {
        var events = ['pointerdown', 'touchstart', 'keydown'];
        function onGesture() {
            if (mutedStart && playerReady && player) {
                mutedStart = false;
                try { player.unMute(); } catch (e) {}
            }
            for (var i = 0; i < events.length; i++) {
                document.removeEventListener(events[i], onGesture, true);
            }
        }
        for (var i = 0; i < events.length; i++) {
            document.addEventListener(events[i], onGesture, true);
        }
    }

    function getStatePayload() {
        var t = 0, stateNum = -1;
        try { t = player ? player.getCurrentTime() : 0; } catch (e) {}
        try { stateNum = player ? player.getPlayerState() : -1; } catch (e) {}
        return {
            cmd: 'state',
            videoId: currentVideo,
            time: t,
            playerState: stateNum,
            isPlaying: stateNum === 1
        };
    }

    var heartbeatTimer = null;
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(function () {
            if (!playerReady || !player || !currentVideo) return;
            notify(getStatePayload());
        }, 5000);
    }
    function stopHeartbeat() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    function safeTime() {
        try { return player ? player.getCurrentTime() : 0; } catch (e) { return 0; }
    }

window.onYouTubeIframeAPIReady = function () {
        ytReady = true;
        var autoplayWanted = getAutoplay();
        var initialVid = getVideoId();
        // Solo se crea el reproductor si ya hay un video (URL ?v=... o un
        // comando 'load' pendiente). Si la página se abre vacía, no se monta
        // el iframe de YouTube para no mostrar el error "Se produjo un error".
        if (initialVid) {
            wantPlaying = autoplayWanted;
            createPlayer(initialVid, autoplayWanted);
        }
    };

    function ensurePlayer() {
        if (!player && ytReady) {
            createPlayer(currentVideo || '', wantPlaying);
        }
    }

    function createPlayer(vid, ap) {
        if (player) return;
        player = new YT.Player('playerHost', {
            height: '100%',
            width: '100%',
            videoId: vid || '',
            playerVars: {
                enablejsapi: 1,
                autoplay: ap ? 1 : 0,
                mute: ap ? 1 : 0,
                controls: 1,
                disablekb: 0,
                fs: 1,
                rel: 0,
                modestbranding: 1,
                playsinline: 1,
                iv_load_policy: 3,
                origin: location.origin || ''
            },
            events: {
                onReady: function () {
                    playerReady = true;
                    var q = pendingCmds.slice();
                    pendingCmds.length = 0;
                    for (var i = 0; i < q.length; i++) { try { q[i](); } catch (e) {} }
                    armUnmuteOnGesture();
                    if (wantPlaying) {
                        mutedStart = true;
                        try { player.mute(); } catch (e) {}
                        startKickWatchdog();
                    }
                    startHeartbeat();
                    notify({ cmd: 'ready', videoId: currentVideo });
                },
                onStateChange: function (e) {
                    var s = e.data;
                    if (s === YT.PlayerState.PLAYING) {
                        if (mutedStart && playerReady && player) {
                            mutedStart = false;
                            stopKickWatchdog();
                            try { player.unMute(); } catch (err) {}
                        }
                        stopKickWatchdog();
                    }
                    if (Date.now() < suppressNotifyUntil) return;
                    if (s === YT.PlayerState.PLAYING) notify({ cmd: 'state', isPlaying: true, videoId: currentVideo, time: safeTime() });
                    else if (s === YT.PlayerState.PAUSED) notify({ cmd: 'state', isPlaying: false, videoId: currentVideo, time: safeTime() });
                    else if (s === YT.PlayerState.ENDED) notify({ cmd: 'ended', videoId: currentVideo });
                },
                onError: function (e) { notify({ cmd: 'error', code: e && e.data, videoId: currentVideo }); },
                onAutoplayBlocked: function () {
                    mutedStart = true;
                    try {
                        player.mute();
                        player.playVideo();
                    } catch (e) {}
                    notify({ cmd: 'autoplay_blocked', videoId: currentVideo });
                }
            }
        });
    };

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (typeof msg === 'string') {
            try { msg = JSON.parse(msg); } catch (err) { return; }
        }
        if (!msg || !msg.cmd) return;
        switch (msg.cmd) {
            case 'load': doLoad(msg); break;
            case 'play': suppressNotify(); wantPlaying = true; doPlay(); startKickWatchdog(); break;
            case 'pause': suppressNotify(); wantPlaying = false; stopKickWatchdog(); doPause(); break;
            case 'stop': suppressNotify(); wantPlaying = false; stopKickWatchdog(); doStop(); break;
            case 'seek': suppressNotify(); doSeek(msg.time); break;
            case 'setVolume': doVolume(msg.volume); break;
            case 'mute': doMute(); break;
            case 'unmute': mutedStart = false; doUnmute(); break;
            case 'getState': if (e.source && e.source.postMessage) e.source.postMessage(getStatePayload(), '*'); break;
        }
    }, false);

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    notify({ cmd: 'ready', videoId: currentVideo, early: true });
})();
</script>
</body>
</html>
