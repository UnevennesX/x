<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Eva Player</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/player@latest/styles/default/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/player@latest/styles/default/video.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@vidstack/player@latest/cdn.js"></script>

  <style>
    :root {
      --bg: #000;
      --panel: #0f0f10;
      --text: #fff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 30%), #000;
    }

    #playerHost {
      width: 100vw;
      height: 100vh;
      background: #000;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    media-player,
    media-player > * {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      display: block;
      background: #000;
    }

    media-player {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 100vw;
      max-height: 100vh;
      --media-brand: hsl(0,0%,96%);
      --media-focus-ring: rgba(255,255,255,0.3);
      --media-controls-color: #fff;
      --media-controls-background: rgba(0,0,0,0.5);
      --media-menu-item-hover-bg: rgba(255,255,255,0.08);
      --media-slider-track-bg: rgba(255,255,255,0.20);
      --media-slider-fill-bg: rgba(255,255,255,0.90);
      --media-slider-thumb-bg: #fff;
      --media-button-bg: rgba(255,255,255,0.06);
      --media-button-hover-bg: rgba(255,255,255,0.12);
    }

    .media-player[data-view-type='video'] {
      aspect-ratio: 16 / 9;
    }

    /* Aviso opcional para invitar al usuario a tocar y activar sonido */
    #soundHint {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      font-size: 14px;
      color: #fff;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
    }
    #soundHint.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="playerHost">
    <media-player
      id="player"
      class="media-player"
      view-type="video"
      stream-type="on-demand"
      log-level="warn"
      crossorigin
      playsinline
      title="Voice Eva"
      poster="https://files.vidstack.io/sprite-fight/poster.webp"
      style="width:100%;height:100%;"
    >
      <media-provider>
        <media-poster class="vds-poster"></media-poster>

        <track
          src="https://files.vidstack.io/sprite-fight/subs/english.vtt"
          kind="subtitles"
          srclang="en-US"
          label="English"
          default
        />
        <track
          src="https://files.vidstack.io/sprite-fight/subs/spanish.vtt"
          kind="subtitles"
          srclang="es-ES"
          label="Spanish"
        />
        <track
          src="https://files.vidstack.io/sprite-fight/chapters.vtt"
          kind="chapters"
          srclang="en-US"
          default
        />
      </media-provider>

      <media-video-layout
        thumbnails="https://files.vidstack.io/sprite-fight/thumbnails.vtt"
      ></media-video-layout>
    </media-player>

    <div id="soundHint">Toca para activar el sonido</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');
    const autoplay = params.get('autoplay') === '1';
    const startTime = Number(params.get('t') || 0);
    const player = document.getElementById('player');
    const soundHint = document.getElementById('soundHint');

    let lastAppliedVideoId = null;
    let lastAppliedAutoplay = false;
    let endedReported = false;
    let soundUnlocked = false;
    let startedMuted = false;

    function safePlay() {
      if (!player) return;
      try {
        const p = player.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {}
    }

    function postParent(message) {
      try { window.parent.postMessage(message, '*'); } catch (e) {}
    }

    // Desbloquea el sonido en la primera interacción real del usuario.
    function unlockSound() {
      if (soundUnlocked) return;
      soundUnlocked = true;
      try {
        player.muted = false;
        if (player.volume === 0) player.volume = 1;
      } catch (e) {}
      // Nos aseguramos de que siga reproduciendo tras desmutear.
      safePlay();
      hideSoundHint();
      removeUnlockListeners();
    }

    function showSoundHint() {
      if (soundHint) soundHint.classList.add('show');
    }
    function hideSoundHint() {
      if (soundHint) soundHint.classList.remove('show');
    }

    function addUnlockListeners() {
      window.addEventListener('pointerdown', unlockSound, { once: false, passive: true });
      window.addEventListener('keydown', unlockSound, { once: false });
      window.addEventListener('touchstart', unlockSound, { once: false, passive: true });
    }
    function removeUnlockListeners() {
      window.removeEventListener('pointerdown', unlockSound);
      window.removeEventListener('keydown', unlockSound);
      window.removeEventListener('touchstart', unlockSound);
    }

    function applyVideo(id, shouldAutoplay, options = {}) {
      if (!player || !id) return;
      const nextId = String(id);
      const forceReload = !!options.forceReload;
      const sameVideo = lastAppliedVideoId === nextId && !forceReload;
      endedReported = false;

      if (sameVideo) {
        if (Number.isFinite(options.seekTime)) {
          try { player.currentTime = Number(options.seekTime); } catch (e) {}
        }
        if (shouldAutoplay !== lastAppliedAutoplay) {
          lastAppliedAutoplay = !!shouldAutoplay;
          if (shouldAutoplay) {
            if (player.readyState >= 1) safePlay();
          } else {
            try { player.pause(); } catch (e) {}
          }
        }
        return;
      }

      lastAppliedVideoId = nextId;
      lastAppliedAutoplay = !!shouldAutoplay;
      player.src = `youtube/${nextId}`;
      player.setAttribute('title', nextId);

      if (shouldAutoplay) {
        player.setAttribute('autoplay', '');
      } else {
        player.removeAttribute('autoplay');
      }

      setTimeout(() => {
        try {
          if (Number.isFinite(options.seekTime) && options.seekTime > 0) {
            player.currentTime = Number(options.seekTime);
          }
          if (shouldAutoplay && player.readyState >= 1) {
            safePlay();
          }
        } catch (e) {}
      }, 350);
    }

    function handleParentMessage(event) {
      const data = event && event.data;
      if (!data || data.source !== 'voice-eva') return;

      switch (data.type) {
        case 'load':
          if (data.videoId) applyVideo(data.videoId, !!data.autoplay, { seekTime: Number(data.time) || 0, forceReload: true });
          break;
        case 'play':
          try { if (player.paused) player.play(); } catch (e) {}
          break;
        case 'pause':
          try { if (!player.paused) player.pause(); } catch (e) {}
          break;
        case 'seek':
          if (Number.isFinite(Number(data.time))) {
            try { player.currentTime = Number(data.time); } catch (e) {}
          }
          break;
        case 'stop':
          try { player.pause(); player.currentTime = 0; endedReported = false; } catch (e) {}
          break;
        case 'mute':
          try { player.muted = true; } catch (e) {}
          break;
        case 'unmute':
          try { player.muted = false; } catch (e) {}
          break;
        case 'setVolume':
          if (Number.isFinite(Number(data.volume))) {
            try { player.volume = Number(data.volume) / 100; } catch (e) {}
          }
          break;
      }
    }

    if (player) {
      player.addEventListener('can-play', () => {
        postParent({ source: 'x-player', type: 'ready', videoId: lastAppliedVideoId || videoId || '' });

        if (lastAppliedAutoplay) {
          // 1) Intentamos autoplay CON sonido (funciona si el navegador ya
          //    tiene permiso: sitio visitado antes, PWA, etc.)
          try { player.muted = false; } catch (e) {}
          try {
            const p = player.play();
            if (p && typeof p.then === 'function') {
              p.then(() => {
                // Autoplay con sonido permitido: no hace falta desbloquear.
                soundUnlocked = true;
                hideSoundHint();
              }).catch(() => {
                // 2) Bloqueado: arrancamos MUTEADO y desbloqueamos al primer toque.
                startedMuted = true;
                try { player.muted = true; } catch (e) {}
                safePlay();
                showSoundHint();
                addUnlockListeners();
              });
            }
          } catch (e) {
            startedMuted = true;
            try { player.muted = true; } catch (e2) {}
            safePlay();
            showSoundHint();
            addUnlockListeners();
          }
        }
      });

      player.addEventListener('time-update', () => {
        const now = Number(player.currentTime) || 0;
        postParent({ source: 'x-player', type: 'time-update', videoId: lastAppliedVideoId || videoId || '', time: now, duration: Number(player.duration) || 0 });
      });

      player.addEventListener('play', () => {
        endedReported = false;
        postParent({ source: 'x-player', type: 'state', state: 'playing', videoId: lastAppliedVideoId || videoId || '', time: Number(player.currentTime) || 0 });
      });

      player.addEventListener('pause', () => {
        postParent({ source: 'x-player', type: 'state', state: 'paused', videoId: lastAppliedVideoId || videoId || '', time: Number(player.currentTime) || 0 });
      });

      player.addEventListener('ended', () => {
        if (endedReported) return;
        endedReported = true;
        postParent({ source: 'x-player', type: 'ended', videoId: lastAppliedVideoId || videoId || '', time: Number(player.currentTime) || 0 });
      });
    }

    window.addEventListener('message', handleParentMessage, false);

    // Carga inicial: por parámetro ?v=  o el video demo por defecto.
    if (videoId) {
      applyVideo(videoId, autoplay, { seekTime: startTime || 0, forceReload: true });
    } else {
      applyVideo('_cMxraX_5RE', autoplay, { seekTime: startTime || 0, forceReload: true });
    }
  </script>
</body>
</html>
