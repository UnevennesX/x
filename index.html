<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <!--
    Solo el runtime de Vidstack. Sin theme.css ni video.css:
    esos son los que traen la interfaz. Al no incluirlos, Vidstack
    no dibuja ningún control, botón, poster ni overlay.
  -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@vidstack/cdn@latest/player.js"
  ></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    media-player,
    media-provider {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      background: #000;
    }

    /* El proveedor YouTube renderiza un iframe; que llene todo */
    media-provider iframe,
    media-provider video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }
  </style>
</head>

<body>
  <div id="stage">
    <!--
      Sin <media-video-layout>, sin <media-poster>, sin <media-controls>.
      Solo el reproductor y el proveedor. Vidstack no pinta nada por sí solo.
    -->
    <media-player
      id="player"
      view-type="video"
      stream-type="on-demand"
      log-level="warn"
      crossorigin
      playsinline
    >
      <media-provider></media-provider>
    </media-player>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = (params.get("v") || "").trim();
    const wantAutoplay = params.get("autoplay") === "1";
    const startTime = Math.max(0, Number(params.get("t")) || 0);

    const player = document.getElementById("player");

    let currentVideoId = "";
    let endedSent = false;

    function post(msg) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, msg),
          "*"
        );
      } catch {}
    }

    function safePlay() {
      try {
        const p = player.play();
        if (p?.catch) p.catch(() => {});
      } catch {}
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      currentVideoId = String(id);
      endedSent = false;

      player.src = `youtube/${currentVideoId}`;

      if (autoplay) player.setAttribute("autoplay", "");
      else player.removeAttribute("autoplay");

      if (time > 0) {
        player.addEventListener(
          "can-play",
          () => {
            try { player.currentTime = time; } catch {}
          },
          { once: true }
        );
      }
    }

    // Eventos hacia la página padre
    player.addEventListener("can-play", () => {
      post({ type: "ready", videoId: currentVideoId });
      if (wantAutoplay) safePlay();
    });

    player.addEventListener("time-update", () => {
      post({
        type: "time-update",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0,
        duration: Number(player.duration) || 0
      });
    });

    player.addEventListener("play", () => {
      endedSent = false;
      post({
        type: "state",
        state: "playing",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("pause", () => {
      post({
        type: "state",
        state: "paused",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    player.addEventListener("ended", () => {
      if (endedSent) return;
      endedSent = true;
      post({
        type: "ended",
        videoId: currentVideoId,
        time: Number(player.currentTime) || 0
      });
    });

    // Control desde la página padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva") return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, !!data.autoplay, Number(data.time) || 0);
          break;
        case "play":
          safePlay();
          break;
        case "pause":
          try { player.pause(); } catch {}
          break;
        case "stop":
          try {
            player.pause();
            player.currentTime = 0;
            endedSent = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time))) {
            try { player.currentTime = Number(data.time); } catch {}
          }
          break;
        case "mute":
          try { player.muted = true; } catch {}
          break;
        case "unmute":
          try { player.muted = false; } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v)) {
            try { player.volume = Math.min(1, Math.max(0, v / 100)); } catch {}
          }
          break;
        }
      }
    });

    if (videoId) {
      loadVideo(videoId, wantAutoplay, startTime);
    }
  </script>
</body>
</html>
