<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #rmExternalPlayer {
            width: 100% !important; height: 100% !important;
            max-width: none !important; margin: 0 !important;
            --media-font-family: inherit;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.2s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 32px; height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #ffffff;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
            text-transform: uppercase; color: #777777; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 14px; font-weight: 400; color: #e5e5e5;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="silent" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <media-provider keep-alive="" data-media-provider="">
                <iframe id="ytIframe" tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = Number(params.get('t')) || 0;
        const player = document.getElementById('rmExternalPlayer');
        const ytIframe = document.getElementById('ytIframe');

        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let hasActiveError = false;
        let isRealPlaybackActive = false;
        let currentVid = videoId || null;
        let endedReported = false;
        let reportedReady = false;
        let progressReportInterval = null;
        let lastReportedTime = -1;
        let lastReportedState = null;
        let autoplayBlocked = false;
        let pendingAutoplay = false;
        let wantsAutoplay = autoplay === '1';

        const ERRORS_MAP = {
            150: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            101: 'El contenido tiene restricciones de derechos de autor o el autor bloqueó su reproducción externa.',
            100: 'El video no existe o fue configurado como privado.',
            2: 'El enlace o identificador de video no es válido.',
            5: 'Error de formato en el reproductor HTML5.'
        };

        function showSpinner() {
            if (hasActiveError || isRealPlaybackActive) return;
            spinner.classList.add('active');
        }

        function hideSpinner() { 
            spinner.classList.remove('active'); 
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            isRealPlaybackActive = false;

            if (progressReportInterval) { clearInterval(progressReportInterval); progressReportInterval = null; }

            videoCover.classList.remove('hidden');
            hideSpinner();

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'Error al reproducir el contenido.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR DE REPRODUCCIÓN';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', videoId: currentVid, code: code, message: msg });
        }

        function reportDurationNow() {
            const dur = (player && Number(player.duration) > 0) ? Number(player.duration) : 0;
            if (dur > 0) {
                postToParent({ type: 'duration', videoId: currentVid, duration: dur });
                return true;
            }
            return false;
        }

        function reportReady() {
            if (reportedReady) return;
            reportedReady = true;
            const dur = (player && Number(player.duration) > 0) ? Number(player.duration) : 0;
            const pos = (player && Number(player.currentTime) > 0) ? Number(player.currentTime) : 0;
            postToParent({ type: 'ready', videoId: currentVid, duration: dur, time: pos });
        }

        function triggerPlaybackStarted() {
            if (hasActiveError) return;
            
            const wasAlreadyActive = isRealPlaybackActive;
            
            if (endedReported) {
                endedReported = false;
            }
            isRealPlaybackActive = true;
            lastReportedState = true;
            
            hideSpinner();
            videoCover.classList.add('hidden');
            errorView.classList.remove('active');

            reportReady();

            if (!wasAlreadyActive) {
                startProgressReport();
            }
        }

        function startProgressReport() {
            if (progressReportInterval) clearInterval(progressReportInterval);
            progressReportInterval = setInterval(function () {
                if (hasActiveError || endedReported) {
                    clearInterval(progressReportInterval);
                    progressReportInterval = null;
                    return;
                }
                const t = (player && Number(player.currentTime)) || 0;
                const d = (player && Number(player.duration)) || 0;
                const playing = !player.paused;

                const timeChanged = Math.abs(t - lastReportedTime) > 0.5;
                const stateChanged = playing !== lastReportedState;

                if (timeChanged || stateChanged) {
                    lastReportedTime = Math.floor(t * 2) / 2;
                    lastReportedState = playing;
                    postToParent({
                        type: 'progress',
                        videoId: currentVid,
                        time: t,
                        duration: d,
                        playing: playing
                    });
                }
            }, 250);
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function safePlay() {
            if (!player || hasActiveError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function (err) {
                        autoplayBlocked = true;
                        pendingAutoplay = true;
                        console.log('[Player] Autoplay blocked, will retry on visibility change');
                        postToParent({ 
                            type: 'autoplay_blocked', 
                            videoId: currentVid,
                            message: 'Autoplay bloqueado por el navegador'
                        });
                    });
                }
            } catch (e) {
                autoplayBlocked = true;
                pendingAutoplay = true;
            }
        }

        function attemptAutoplay() {
            if (!document.hidden && pendingAutoplay && wantsAutoplay && !hasActiveError) {
                pendingAutoplay = false;
                autoplayBlocked = false;
                safePlay();
            }
        }

        function forceSeekAudioAndVideo(targetSec) {
            if (!player) return;
            try {
                player.currentTime = targetSec;
            } catch (e) {}

            try {
                const internalIframe = (ytIframe && ytIframe.contentWindow) 
                    ? ytIframe 
                    : player.querySelector('iframe');
                if (internalIframe && internalIframe.contentWindow) {
                    internalIframe.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: 'seekTo',
                        args: [targetSec, true]
                    }), '*');
                }
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') {
                player.removeAttribute('autoplay');
                wantsAutoplay = false;
            } else {
                wantsAutoplay = true;
            }

            player.addEventListener('can-play', function () {
            });

            if (videoId) {
                showSpinner();
                videoCover.classList.remove('hidden');
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                }
                if (startTime > 0) {
                    const onInitialReady = function () {
                        player.removeEventListener('can-play', onInitialReady);
                        forceSeekAudioAndVideo(startTime);
                    };
                    player.addEventListener('can-play', onInitialReady);
                }
                
                const onInitialCanPlay = function () {
                    player.removeEventListener('can-play', onInitialCanPlay);
                    reportReady();
                    if (autoplay === '1' && !document.hidden) {
                        safePlay();
                    } else if (autoplay === '1' && document.hidden) {
                        pendingAutoplay = true;
                    }
                };
                player.addEventListener('can-play', onInitialCanPlay);
            } else {
                hideSpinner();
            }

            player.addEventListener('playing', function(){ 
                triggerPlaybackStarted(); 
            });

            player.addEventListener('time-update', function() {
                if (!isRealPlaybackActive && player.currentTime > 0) {
                    triggerPlaybackStarted();
                }
            });

            player.addEventListener('waiting', function() {
                if (!isRealPlaybackActive) {
                    showSpinner();
                }
            });

            player.addEventListener('error', function(event) {
                const detail = event && event.detail;
                const err = (detail && (detail.code || detail.message || detail.error)) || 'Playback Error';
                triggerError(err);
            });

            player.addEventListener('ended', function () {
                if (!endedReported) {
                    endedReported = true;
                    isRealPlaybackActive = false;
                    if (progressReportInterval) {
                        clearInterval(progressReportInterval);
                        progressReportInterval = null;
                    }
                    try { player.pause(); } catch (e) {}
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            player.addEventListener('durationchange', reportDurationNow);
            player.addEventListener('loaded-metadata', reportDurationNow);

            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) {
                    attemptAutoplay();
                }
            });

            window.addEventListener('message', function (ev) {
                if (typeof ev.data === 'string') {
                    if (ev.data.includes('onError')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            if (ytData.event === 'onError' && ytData.info) triggerError(ytData.info);
                        } catch (e) {}
                    }
                    if (ev.data.includes('onStateChange') || ev.data.includes('infoDelivery')) {
                        try {
                            const ytData = JSON.parse(ev.data);
                            const state = ytData.info && ytData.info.playerState !== undefined ? ytData.info.playerState : ytData.info;
                            if (state === 1) triggerPlaybackStarted();
                        } catch (e) {}
                    }
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                if (currentVid === data.videoId && !hasActiveError && player.src) {
                                    endedReported = false;
                                    if (data.autoplay) {
                                        wantsAutoplay = true;
                                        safePlay();
                                    } else {
                                        try { player.pause(); } catch (e) {}
                                    }
                                    if (typeof data.time !== 'undefined' && Number(data.time) >= 0) {
                                        forceSeekAudioAndVideo(Number(data.time));
                                    }
                                    break;
                                }

                                hasActiveError = false;
                                isRealPlaybackActive = false;
                                endedReported = false;
                                reportedReady = false;
                                autoplayBlocked = false;
                                pendingAutoplay = false;
                                wantsAutoplay = !!data.autoplay;
                                if (progressReportInterval) {
                                    clearInterval(progressReportInterval);
                                    progressReportInterval = null;
                                }
                                
                                videoCover.classList.remove('hidden');
                                errorView.classList.remove('active');
                                
                                currentVid = data.videoId;
                                
                                console.log('[Player] Loading video:', data.videoId, 'autoplay:', data.autoplay);
                                
                                showSpinner();
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                } else {
                                    player.removeAttribute('autoplay');
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (typeof data.time !== 'undefined' && Number(data.time) >= 0) {
                                        forceSeekAudioAndVideo(Number(data.time));
                                    }
                                    reportDurationNow();
                                    reportReady();
                                    if (data.autoplay && !hasActiveError && !document.hidden) {
                                        safePlay();
                                    } else if (data.autoplay && document.hidden) {
                                        pendingAutoplay = true;
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                            }
                            break;
                        case 'play':
                            if (!hasActiveError) {
                                endedReported = false;
                                lastReportedState = true;
                                wantsAutoplay = true;
                                if (!document.hidden) {
                                    safePlay();
                                } else {
                                    pendingAutoplay = true;
                                }
                                postToParent({
                                    type: 'progress',
                                    videoId: currentVid,
                                    time: Number(player.currentTime) || 0,
                                    duration: Number(player.duration) || 0,
                                    playing: true
                                });
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            try { 
                                player.pause();
                                isRealPlaybackActive = false;
                                lastReportedState = false;
                                postToParent({
                                    type: 'progress',
                                    videoId: currentVid,
                                    time: Number(player.currentTime) || 0,
                                    duration: Number(player.duration) || 0,
                                    playing: false
                                });
                            } catch (e) {}
                            break;
                        case 'seek':
                            if (typeof data.time !== 'undefined') {
                                endedReported = false;
                                forceSeekAudioAndVideo(Math.max(0, Number(data.time) || 0));
                            }
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
