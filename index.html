<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Voice Eva Player</title>
  <link rel="icon" href="data:," />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #player, iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }

    #msg {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #msg.show {
      display: grid;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="player"></div>
    <div id="msg">
      Falta el parámetro <code>?v=VIDEO_ID</code> en la URL.
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialVideoId = (params.get("v") || "").trim();
    const initialAutoplay = params.get("autoplay") !== "0";
    const initialTime = Math.max(0, Number(params.get("t")) || 0);

    const msg = document.getElementById("msg");

    let player = null;
    let isApiReady = false;
    let currentVideoId = "";
    let wantsAutoplay = true;
    let pendingSeek = 0;
    let endedReported = false;
    let timeInterval = null;

    function post(m) {
      try {
        window.parent.postMessage(
          Object.assign({ source: "x-player" }, m),
          "*"
        );
      } catch {}
    }

    function startTimeTracker() {
      stopTimeTracker();
      timeInterval = setInterval(() => {
        if (player && typeof player.getCurrentTime === "function") {
          try {
            post({
              type: "time-update",
              videoId: currentVideoId,
              time: Number(player.getCurrentTime()) || 0,
              duration: Number(player.getDuration()) || 0
            });
          } catch {}
        }
      }, 250);
    }

    function stopTimeTracker() {
      if (timeInterval) {
        clearInterval(timeInterval);
        timeInterval = null;
      }
    }

    window.onYouTubeIframeAPIReady = function() {
      isApiReady = true;
      if (initialVideoId) {
        loadVideo(initialVideoId, initialAutoplay, initialTime);
      } else {
        msg.classList.add("show");
      }
    };

    function createPlayer(videoId) {
      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          autoplay: wantsAutoplay ? 1 : 0,
          controls: 1, // Interfaz nativa con engranaje de calidad
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1
        },
        events: {
          onReady: (event) => {
            if (pendingSeek > 0) {
              try { event.target.seekTo(pendingSeek, true); } catch {}
              pendingSeek = 0;
            }

            post({ type: "ready", videoId: currentVideoId });

            if (wantsAutoplay) {
              try { event.target.playVideo(); } catch {}
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              endedReported = false;
              startTimeTracker();
              post({
                type: "state",
                state: "playing",
                videoId: currentVideoId,
                time: Number(player.getCurrentTime()) || 0
              });
            } else if (event.data === YT.PlayerState.PAUSED) {
              stopTimeTracker();
              post({
                type: "state",
                state: "paused",
                videoId: currentVideoId,
                time: Number(player.getCurrentTime()) || 0
              });
            } else if (event.data === YT.PlayerState.ENDED) {
              stopTimeTracker();
              if (!endedReported) {
                endedReported = true;
                post({
                  type: "ended",
                  videoId: currentVideoId,
                  time: Number(player.getDuration()) || 0
                });
              }
            }
          },
          onError: (event) => {
            post({
              type: "error",
              videoId: currentVideoId,
              code: event.data,
              message: "Error al reproducir el video."
            });
          }
        }
      });
    }

    function loadVideo(id, autoplay, time) {
      if (!id) return;
      currentVideoId = String(id).trim();
      wantsAutoplay = autoplay !== undefined ? !!autoplay : true;
      pendingSeek = Math.max(0, Number(time) || 0);
      endedReported = false;

      if (!isApiReady) return;

      if (!player) {
        createPlayer(currentVideoId);
      } else {
        if (wantsAutoplay) {
          player.loadVideoById({
            videoId: currentVideoId,
            startSeconds: pendingSeek
          });
        } else {
          player.cueVideoById({
            videoId: currentVideoId,
            startSeconds: pendingSeek
          });
        }
      }
    }

    // Receptor de mensajes desde la app padre
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || data.source !== "voice-eva" || !player) return;

      switch (data.type) {
        case "load":
          loadVideo(data.videoId, data.autoplay !== undefined ? !!data.autoplay : true, Number(data.time) || 0);
          break;
        case "play":
          try { player.playVideo(); } catch {}
          break;
        case "pause":
          try { player.pauseVideo(); } catch {}
          break;
        case "stop":
          try {
            player.stopVideo();
            endedReported = false;
          } catch {}
          break;
        case "seek":
          if (Number.isFinite(Number(data.time))) {
            try { player.seekTo(Number(data.time), true); } catch {}
          }
          break;
        case "mute":
          try { player.mute(); } catch {}
          break;
        case "unmute":
          try { player.unMute(); } catch {}
          break;
        case "setVolume": {
          const v = Number(data.volume);
          if (Number.isFinite(v)) {
            try { player.setVolume(Math.min(100, Math.max(0, v))); } catch {}
          }
          break;
        }
      }
    });
  </script>
</body>
</html>
