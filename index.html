<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Mitigación estricta para Error 153 de YouTube (Envío de Referer requerido) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Vidstack Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    <script type="module" src="https://cdn.vidstack.io/icons"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin="true">
    <link rel="preconnect" href="https://static.doubleclick.net" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
            font-family: "Roboto", "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            color: #fff;
        }

        #playerHost,
        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            position: relative;
        }

        /* --- Overlay Profesional Estilo YouTube --- */
        .rm-yt-error-overlay {
            position: absolute;
            inset: 0;
            z-index: 99999;
            background: #181818;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.2s ease-out;
        }

        .rm-yt-error-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        .rm-yt-error-container {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            max-width: 680px;
            width: 100%;
        }

        .rm-yt-icon {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
            color: #aaaaaa;
        }

        .rm-yt-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rm-yt-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .rm-yt-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .rm-yt-code-tag {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e0e0e0;
        }

        .rm-yt-reason {
            font-size: 0.92rem;
            line-height: 1.45;
            color: #e2e2e2;
            margin: 0;
        }

        .rm-yt-link {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
            margin-top: 2px;
            width: fit-content;
        }

        .rm-yt-link:hover {
            color: #3ea6ff;
        }

        /* Barra de salto automático */
        .rm-yt-countdown-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            width: fit-content;
        }

        .rm-yt-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff4e4e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .rm-yt-countdown-text {
            font-size: 0.85rem;
            color: #b0b0b0;
        }

        .rm-yt-countdown-text strong {
            color: #ff6b6b;
            font-size: 0.95rem;
        }

        .rm-yt-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .rm-yt-btn {
            background: #ffffff;
            color: #0f0f0f;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .rm-yt-btn:hover {
            background: #e0e0e0;
        }

        .rm-yt-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 600px) {
            .rm-yt-error-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 16px;
            }
            .rm-yt-header-row {
                justify-content: center;
            }
            .rm-yt-countdown-box {
                margin: 10px auto 0;
            }
            .rm-yt-actions {
                justify-content: center;
            }
            .rm-yt-link {
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="warn" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player" data-orientation="landscape">
            <media-provider keep-alive="" data-media-provider="">
                <iframe tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
            <media-controls class="vds-controls" role="group" style="pointer-events: none;">
                <media-controls-group class="vds-controls-group top-right" style="pointer-events: auto;">
                    <media-menu class="vds-menu" data-root="" data-disabled="" style="display: contents;">
                        <media-menu-button class="vds-menu-button vds-button" aria-label="Calidad de video" tabindex="0" role="button" id="media-menu-button-1" aria-haspopup="menu" aria-expanded="false" data-root="" aria-disabled="true" type="button">
                            <media-icon class="vds-icon" type="settings"></media-icon>
                        </media-menu-button>
                    </media-menu>
                </media-controls-group>
            </media-controls>
        </media-player>

        <!-- Overlay Estilo Nativo YouTube de Bloqueo -->
        <div id="rmErrorOverlay" class="rm-yt-error-overlay">
            <div class="rm-yt-error-container">
                <svg class="rm-yt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div class="rm-yt-content">
                    <div class="rm-yt-header-row">
                        <h2 class="rm-yt-title" id="rmErrorTitle">Video no disponible</h2>
                        <span class="rm-yt-code-tag" id="rmErrorCodeLabel">ERROR 150</span>
                    </div>
                    <p class="rm-yt-reason" id="rmErrorReason">
                        Este video contiene restricciones de derechos de autor o el creador ha desactivado su reproducción en sitios externos.
                    </p>
                    <a class="rm-yt-link" id="rmWatchOnYoutube" href="#" target="_blank" rel="noopener noreferrer">
                        Mirar en YouTube
                    </a>

                    <div class="rm-yt-countdown-box">
                        <div class="rm-yt-spinner"></div>
                        <span class="rm-yt-countdown-text">
                            Saltando al próximo video en cola en <strong id="rmCountdownNumber">5</strong> s
                        </span>
                        <div class="rm-yt-actions">
                            <button class="rm-yt-btn" id="rmSkipNowBtn">Saltar ahora</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const startTime = parseFloat(params.get('t')) || 0;
        const player = document.getElementById('rmExternalPlayer');

        // Overlay Elements
        const errorOverlay = document.getElementById('rmErrorOverlay');
        const errorTitle = document.getElementById('rmErrorTitle');
        const errorCodeLabel = document.getElementById('rmErrorCodeLabel');
        const errorReason = document.getElementById('rmErrorReason');
        const watchOnYoutube = document.getElementById('rmWatchOnYoutube');
        const countdownNumber = document.getElementById('rmCountdownNumber');
        const skipNowBtn = document.getElementById('rmSkipNowBtn');

        let countdownTimer = null;
        let countdownSec = 5;
        let currentVid = videoId || null;
        let lastExpectedAutoplay = autoplay === '1';
        let endedThisVideo = false;
        let endedReported = false;
        let reportedReady = false;

        const YT_ERROR_DICTIONARY = {
            2: {
                title: 'Parámetro no válido',
                reason: 'El enlace o identificador de este video contiene un formato no válido.'
            },
            5: {
                title: 'Error de reproducción HTML5',
                reason: 'El reproductor HTML5 no puede procesar el contenido de este video.'
            },
            100: {
                title: 'Video no disponible',
                reason: 'El video ha sido eliminado o marcado como privado por su autor.'
            },
            101: {
                title: 'Video no disponible',
                reason: 'El titular de los derechos de autor ha bloqueado la reproducción de este video en sitios o aplicaciones externas.'
            },
            150: {
                title: 'Video no disponible',
                reason: 'Este video contiene contenido con derechos de autor protegidos (LatinAutor / discográfica) y se ha bloqueado su inserción externa.'
            },
            153: {
                title: 'Error de configuración del reproductor',
                reason: 'YouTube rechazó la conexión por políticas de origen o cabecera Referer ausente.'
            },
            155: {
                title: 'Restricción de seguridad',
                reason: 'El entorno de ejecución bloqueó las directivas del reproductor de YouTube.'
            }
        };

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function hideOverlay() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            errorOverlay.classList.remove('active');
        }

        function triggerCustomError(code) {
            code = Number(code) || 150;
            const errInfo = YT_ERROR_DICTIONARY[code] || {
                title: 'Video no disponible',
                reason: 'No se pudo reproducir este video debido a restricciones de la plataforma o derechos de autor.'
            };

            errorTitle.textContent = errInfo.title;
            errorCodeLabel.textContent = 'ERROR ' + code;
            errorReason.textContent = errInfo.reason;
            watchOnYoutube.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(currentVid || '');

            countdownSec = 5;
            countdownNumber.textContent = countdownSec;
            errorOverlay.classList.add('active');

            // Pausar y reportar error al padre
            try { player.pause(); } catch (e) {}
            postToParent({ type: 'error', code: code, videoId: currentVid });

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(function () {
                countdownSec--;
                countdownNumber.textContent = countdownSec;
                if (countdownSec <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    skipVideo();
                }
            }, 1000);
        }

        function skipVideo() {
            hideOverlay();
            postToParent({ type: 'skip_fatal', videoId: currentVid });
        }

        skipNowBtn.onclick = function () {
            skipVideo();
        };

        // --- INTERCEPCIÓN DIRECTA DE MENSAJES DE YOUTUBE ---
        window.addEventListener('message', function (ev) {
            try {
                let data = ev.data;
                if (typeof data === 'string') {
                    data = JSON.parse(data);
                }
                if (data && (data.event === 'onError' || data.info === 150 || data.info === 101 || data.info === 153 || data.info === 100 || data.info === 2 || data.info === 5)) {
                    const code = data.info || (data.data && data.data.code) || 150;
                    triggerCustomError(code);
                }
            } catch (err) {}
        });

        function safePlay() {
            if (!player) return;
            try {
                const playPromise = player.play();
                if (playPromise !== undefined && typeof playPromise.catch === 'function') {
                    playPromise.catch(function () {});
                }
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
                if (startTime > 0) {
                    const onReadySeek = function () {
                        player.removeEventListener('can-play', onReadySeek);
                        try { player.currentTime = startTime; } catch (e) {}
                    };
                    player.addEventListener('can-play', onReadySeek);
                }
            }

            function markReady() {
                if (reportedReady) return;
                reportedReady = true;
                postToParent({ type: 'ready' });
            }
            player.addEventListener('can-play', function () {
                hideOverlay();
                markReady();
            });
            player.addEventListener('playing', function () {
                hideOverlay();
                markReady();
            });
            setTimeout(markReady, 2500);

            // Escucha del evento de error de Vidstack
            player.addEventListener('error', function (ev) {
                const detail = ev.detail || ev;
                let ytCode = 150;
                if (detail) {
                    if (typeof detail.code === 'number') ytCode = detail.code;
                    else if (typeof detail.data === 'number') ytCode = detail.data;
                    else if (detail.cause && typeof detail.cause.data === 'number') ytCode = detail.cause.data;
                }
                triggerCustomError(ytCode);
            });

            player.addEventListener('ended', function () {
                endedThisVideo = true;
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            function reportDuration() {
                const d = player.duration;
                if (d && isFinite(d) && d > 0) {
                    postToParent({ type: 'duration', videoId: currentVid, duration: d });
                    return true;
                }
                return false;
            }

            let durRetry = 0;
            let reportInterval = null;
            function scheduleReportDuration() {
                durRetry = 0;
                if (reportInterval) clearInterval(reportInterval);
                reportInterval = setInterval(function () {
                    if (reportDuration()) {
                        clearInterval(reportInterval);
                        reportInterval = null;
                    } else {
                        durRetry++;
                        if (durRetry > 30) {
                            clearInterval(reportInterval);
                            reportInterval = null;
                        }
                    }
                }, 1000);
            }

            player.addEventListener('durationchange', reportDuration);
            player.addEventListener('duration-change', reportDuration);
            player.addEventListener('loadedmetadata', reportDuration);
            player.addEventListener('can-play', scheduleReportDuration);

            // Verificador de auto-play y fin de pista
            setInterval(function () {
                if (endedThisVideo || errorOverlay.classList.contains('active')) {
                    lastExpectedAutoplay = false;
                    return;
                }

                try {
                    if (player.duration && player.currentTime >= player.duration - 1) {
                        endedThisVideo = true;
                        if (!endedReported) {
                            endedReported = true;
                            postToParent({ type: 'ended', videoId: currentVid });
                        }
                        lastExpectedAutoplay = false;
                        return;
                    }
                } catch (e) {}

                if (lastExpectedAutoplay && player.paused) {
                    safePlay();
                }
            }, 2500);

            // Mensajes recibidos desde room-music.js
            window.addEventListener('message', function (ev) {
                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                hideOverlay();
                                currentVid = data.videoId;
                                endedThisVideo = false;
                                endedReported = false;
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const loadStart = Math.max(0, Number(data.time) || 0);
                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    if (loadStart > 0) {
                                        try { player.currentTime = loadStart; } catch (e) {}
                                    }
                                    if (lastExpectedAutoplay) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                                scheduleReportDuration();
                            }
                            break;
                        case 'play':
                            hideOverlay();
                            lastExpectedAutoplay = true;
                            safePlay();
                            break;
                        case 'pause':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'seek':
                            player.currentTime = Math.max(0, Number(data.time) || 0);
                            break;
                        case 'stop':
                            hideOverlay();
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            player.currentTime = 0;
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
