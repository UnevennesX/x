<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Eva Player</title>
    <link rel="icon" href="data:,">
    
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://i.ytimg.com">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #playerHost {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000000;
        }
        #ytWrapper {
            position: absolute; top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            border: 0; pointer-events: none;
        }
        #ytWrapper iframe {
            width: 100% !important; height: 100% !important;
            border: 0;
        }
        .video-cover {
            position: absolute; inset: 0; background: #000000;
            z-index: 10; pointer-events: none; opacity: 1;
            transition: opacity 0.25s ease;
        }
        .video-cover.hidden { opacity: 0 !important; }
        .minimal-spinner {
            position: absolute; z-index: 50; width: 34px; height: 34px;
            border: 2.5px solid rgba(255, 255, 255, 0.12); border-top-color: #4c6ef5;
            border-radius: 50%; animation: spin 0.75s linear infinite;
            pointer-events: none; display: none; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .minimal-spinner.active { display: block !important; opacity: 1 !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .minimal-error {
            position: absolute; inset: 0; z-index: 100; background: #000000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .minimal-error.active { opacity: 1 !important; pointer-events: auto !important; }
        .error-tag {
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fa5252; margin-bottom: 8px;
        }
        .error-msg {
            font-size: 13px; font-weight: 400; color: #b0b0b0;
            max-width: 320px; line-height: 1.5; margin: 0;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <div id="videoCover" class="video-cover"></div>
        <div id="loadingSpinner" class="minimal-spinner active"></div>

        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR DE REPRODUCCIÓN</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
        </div>

        <div id="ytWrapper">
            <div id="ytPlayerTarget"></div>
        </div>
    </div>

    <!-- YouTube IFrame API oficial -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Evita que YouTube detecte que la pestaña está en segundo plano
        try {
            Object.defineProperty(document, 'hidden', { get: () => false });
            Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        } catch (e) {}

        window.addEventListener('visibilitychange', (e) => {
            e.stopImmediatePropagation();
        }, true);

        const params = new URLSearchParams(window.location.search);
        const initialVid = params.get('v');
        const wantsAutoplay = params.get('autoplay') === '1';
        const startTime = Number(params.get('t')) || 0;

        const videoCover = document.getElementById('videoCover');
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');

        let ytPlayer = null;
        let isApiReady = false;
        let currentVid = initialVid || null;
        let hasActiveError = false;
        let isReadyReported = false;
        let userWantsPlayback = wantsAutoplay;
        let targetVolume = 100;
        let progressInterval = null;

        const ERRORS_MAP = {
            150: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            101: 'El autor bloqueó la reproducción externa o tiene restricciones de copyright.',
            100: 'El video fue eliminado o configurado como privado.',
            2: 'Identificador de video de YouTube no válido.',
            5: 'Error de decodificación en el reproductor HTML5.'
        };

        function postToParent(data) {
            try {
                window.parent.postMessage(Object.assign({ source: 'x-player', videoId: currentVid }, data), '*');
            } catch (e) {}
        }

        function showSpinner() {
            if (!hasActiveError) spinner.classList.add('active');
        }

        function hideSpinner() {
            spinner.classList.remove('active');
        }

        function triggerError(code) {
            if (hasActiveError) return;
            hasActiveError = true;
            hideSpinner();
            videoCover.classList.remove('hidden');

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'No se pudo reproducir este video.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR';
            errText.textContent = msg;
            errorView.classList.add('active');

            postToParent({ type: 'error', code: code, message: msg });
        }

        function clearError() {
            hasActiveError = false;
            errorView.classList.remove('active');
        }

        function startProgressTracker() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
                try {
                    const curTime = ytPlayer.getCurrentTime() || 0;
                    const dur = ytPlayer.getDuration() || 0;
                    const state = ytPlayer.getPlayerState();
                    const isPlaying = (state === 1); // 1 = PLAYING

                    if (curTime > 0) hideSpinner();

                    postToParent({
                        type: 'progress',
                        time: curTime,
                        duration: dur,
                        playing: isPlaying
                    });
                } catch (e) {}
            }, 500);
        }

        // Se ejecuta automáticamente cuando YouTube IFrame API termina de cargar
        window.onYouTubeIframeAPIReady = function() {
            isApiReady = true;
            ytPlayer = new YT.Player('ytPlayerTarget', {
                width: '100%',
                height: '100%',
                videoId: currentVid || '',
                playerVars: {
                    autoplay: wantsAutoplay ? 1 : 0,
                    start: startTime,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: (event) => {
                        event.target.setVolume(targetVolume);
                        startProgressTracker();
                        if (currentVid && wantsAutoplay) {
                            event.target.playVideo();
                        } else {
                            hideSpinner();
                        }
                    },
                    onStateChange: (event) => {
                        // 1 = PLAYING
                        if (event.data === 1) {
                            hideSpinner();
                            videoCover.classList.add('hidden');
                            clearError();

                            if (!isReadyReported) {
                                isReadyReported = true;
                                postToParent({
                                    type: 'ready',
                                    duration: ytPlayer.getDuration() || 0,
                                    time: ytPlayer.getCurrentTime() || 0
                                });
                            }
                        }
                        // 2 = PAUSED
                        else if (event.data === 2) {
                            // Si el navegador intentó pausar en segundo plano pero el usuario quería reproducción:
                            if (userWantsPlayback && !hasActiveError) {
                                setTimeout(() => {
                                    if (userWantsPlayback && ytPlayer && ytPlayer.getPlayerState() === 2) {
                                        ytPlayer.playVideo();
                                    }
                                }, 50);
                            }
                        }
                        // 0 = ENDED
                        else if (event.data === 0) {
                            userWantsPlayback = false;
                            postToParent({ type: 'ended' });
                        }
                    },
                    onError: (event) => {
                        triggerError(event.data);
                    }
                }
            });
        };

        // CARGA CONTINUA SIN RECARGAR EL IFRAME
        function loadVideoDirectly(vid, timeSec, autoplay) {
            currentVid = vid;
            clearError();
            isReadyReported = false;
            userWantsPlayback = !!autoplay;
            showSpinner();
            videoCover.classList.remove('hidden');

            const t = Number(timeSec) || 0;

            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                if (autoplay) {
                    ytPlayer.loadVideoById({
                        videoId: vid,
                        startSeconds: t
                    });
                } else {
                    ytPlayer.cueVideoById({
                        videoId: vid,
                        startSeconds: t
                    });
                    hideSpinner();
                }
            }
        }

        // Listener de mensajes que llegan desde room-music.js
        window.addEventListener('message', (ev) => {
            const data = ev.data;
            if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;

            const action = data.cmd || data.type;

            switch (action) {
                case 'load':
                    if (data.videoId) {
                        loadVideoDirectly(data.videoId, data.time, data.autoplay);
                    }
                    break;

                case 'play':
                case 'keepalive':
                    userWantsPlayback = true;
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function' && !hasActiveError) {
                        ytPlayer.playVideo();
                    }
                    break;

                case 'pause':
                    userWantsPlayback = false;
                    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                        ytPlayer.pauseVideo();
                    }
                    hideSpinner();
                    break;

                case 'seek':
                    if (typeof data.time !== 'undefined' && ytPlayer && typeof ytPlayer.seekTo === 'function') {
                        ytPlayer.seekTo(Number(data.time), true);
                    }
                    break;

                case 'setVolume':
                    if (typeof data.volume !== 'undefined') {
                        targetVolume = Math.max(0, Math.min(100, Number(data.volume)));
                        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                            ytPlayer.setVolume(targetVolume);
                        }
                    }
                    break;

                case 'mute':
                    if (ytPlayer && typeof ytPlayer.mute === 'function') {
                        ytPlayer.mute();
                    }
                    break;

                case 'unmute':
                    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
                        ytPlayer.unMute();
                    }
                    break;

                case 'stop':
                    userWantsPlayback = false;
                    if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                        ytPlayer.stopVideo();
                    }
                    clearError();
                    hideSpinner();
                    videoCover.classList.remove('hidden');
                    break;
            }
        });
    </script>
</body>
</html>
