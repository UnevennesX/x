<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css">
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css">
    <script type="module" src="https://cdn.vidstack.io/player"></script>
    
    <link rel="preconnect" href="https://www.google.com" crossorigin="true">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin="true">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #playerHost {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #rmExternalPlayer {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            --media-font-family: inherit;
        }

        /* --- Spinner Minimalista --- */
        .minimal-spinner {
            position: absolute;
            z-index: 50;
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .minimal-spinner.visible {
            opacity: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Error Minimalista --- */
        .minimal-error {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .minimal-error.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .error-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 8px;
        }

        .error-msg {
            font-size: 14px;
            font-weight: 400;
            color: #e5e5e5;
            max-width: 340px;
            line-height: 1.5;
            margin: 0;
        }

        .error-link {
            display: inline-block;
            margin-top: 14px;
            font-size: 12px;
            color: #999;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s ease;
        }

        .error-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="playerHost">
        <!-- Spinner -->
        <div id="loadingSpinner" class="minimal-spinner visible"></div>

        <!-- Pantalla de Error -->
        <div id="errorView" class="minimal-error">
            <span id="errCode" class="error-tag">ERROR</span>
            <p id="errText" class="error-msg">No se pudo reproducir este video.</p>
            <a id="errAction" class="error-link" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">Ver en YouTube</a>
        </div>

        <!-- Reproductor sin controles innecesarios -->
        <media-player id="rmExternalPlayer" class="vds-player" load="eager" view-type="video" stream-type="on-demand" log-level="warn" crossorigin="" playsinline="" data-media-player="" tabindex="0" role="region" aria-label="Video Player">
            <media-provider keep-alive="" data-media-provider="">
                <iframe tabindex="-1" data-no-controls="" class="vds-youtube" aria-hidden="true" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; accelerometer; gyroscope"></iframe>
            </media-provider>
        </media-player>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const autoplay = params.get('autoplay');
        const player = document.getElementById('rmExternalPlayer');

        // Elementos UI
        const spinner = document.getElementById('loadingSpinner');
        const errorView = document.getElementById('errorView');
        const errCode = document.getElementById('errCode');
        const errText = document.getElementById('errText');
        const errAction = document.getElementById('errAction');

        let isFatalError = false;
        let currentVid = videoId || null;
        let lastExpectedAutoplay = autoplay === '1';
        let endedReported = false;
        let reportedReady = false;

        const ERRORS_MAP = {
            150: 'El autor del video no permite reproducirlo fuera de YouTube.',
            101: 'El autor del video no permite reproducirlo fuera de YouTube.',
            100: 'El video no existe o fue configurado como privado.',
            2: 'El enlace o identificador de video no es válido.',
            5: 'Error de compatibilidad con el reproductor.'
        };

        function showSpinner(show) {
            if (show && !isFatalError) {
                spinner.classList.add('visible');
            } else {
                spinner.classList.remove('visible');
            }
        }

        function displayError(code) {
            isFatalError = true;
            lastExpectedAutoplay = false;
            showSpinner(false);

            const num = Number(code);
            const msg = (!isNaN(num) && ERRORS_MAP[num]) ? ERRORS_MAP[num] : String(code || 'Error al reproducir el contenido.');

            errCode.textContent = !isNaN(num) ? `ERROR ${num}` : 'ERROR DE REPRODUCCIÓN';
            errText.textContent = msg;

            if (currentVid && (num === 150 || num === 101 || num === 5)) {
                errAction.href = 'https://www.youtube.com/watch?v=' + currentVid;
                errAction.style.display = 'inline-block';
            } else {
                errAction.style.display = 'none';
            }

            errorView.classList.add('visible');

            console.error(`[Player Error] Code: ${code} | Video: ${currentVid}`);
            postToParent({ type: 'error', videoId: currentVid, code: code, message: msg });
        }

        function clearError() {
            isFatalError = false;
            errorView.classList.remove('visible');
            errAction.style.display = 'none';
        }

        function postToParent(m) {
            try { window.parent.postMessage(Object.assign({ source: 'x-player' }, m), '*'); } catch (e) {}
        }

        function safePlay() {
            if (!player || isFatalError) return;
            try {
                const p = player.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } catch (e) {}
        }

        if (player) {
            if (autoplay !== '1') player.removeAttribute('autoplay');

            if (videoId) {
                showSpinner(true);
                player.src = 'youtube/' + videoId;
                if (autoplay === '1') {
                    player.setAttribute('autoplay', '');
                    lastExpectedAutoplay = true;
                }
            } else {
                showSpinner(false);
            }

            function markReady() {
                if (reportedReady || isFatalError) return;
                reportedReady = true;
                showSpinner(false);
                postToParent({ type: 'ready' });
            }

            player.addEventListener('can-play', function() {
                showSpinner(false);
                markReady();
            });

            player.addEventListener('playing', function() {
                showSpinner(false);
                markReady();
            });

            player.addEventListener('waiting', function() {
                showSpinner(true);
            });

            player.addEventListener('error', function(event) {
                const detail = event && event.detail;
                const err = (detail && (detail.code || detail.message || detail.error)) || 'Playback Error';
                displayError(err);
            });

            player.addEventListener('ended', function () {
                if (!endedReported) {
                    endedReported = true;
                    postToParent({ type: 'ended', videoId: currentVid });
                }
            });

            // Reintento limpio de autoplay
            setInterval(function () {
                if (lastExpectedAutoplay && !isFatalError && player.paused) {
                    safePlay();
                }
            }, 2500);

            // Escuchar mensajes (Parent & YouTube iframe)
            window.addEventListener('message', function (ev) {
                // Interceptar error directo de YouTube
                if (typeof ev.data === 'string' && ev.data.includes('onError')) {
                    try {
                        const ytData = JSON.parse(ev.data);
                        if (ytData.event === 'onError' && ytData.info) {
                            displayError(ytData.info);
                        }
                    } catch (e) {}
                }

                const data = ev.data;
                if (!data || typeof data !== 'object' || data.source !== 'voice-eva') return;
                try {
                    switch (data.type) {
                        case 'load':
                            if (data.videoId) {
                                clearError();
                                currentVid = data.videoId;
                                endedReported = false;
                                reportedReady = false;
                                showSpinner(true);
                                player.src = 'youtube/' + data.videoId;

                                if (data.autoplay) {
                                    player.setAttribute('autoplay', '');
                                    lastExpectedAutoplay = true;
                                } else {
                                    player.removeAttribute('autoplay');
                                    lastExpectedAutoplay = false;
                                }

                                const onCanPlay = function () {
                                    player.removeEventListener('can-play', onCanPlay);
                                    showSpinner(false);
                                    if (lastExpectedAutoplay && !isFatalError) {
                                        safePlay();
                                    }
                                };
                                player.addEventListener('can-play', onCanPlay);
                            }
                            break;
                        case 'play':
                            if (!isFatalError) {
                                lastExpectedAutoplay = true;
                                safePlay();
                            }
                            break;
                        case 'pause':
                        case 'stop':
                            lastExpectedAutoplay = false;
                            try { player.pause(); } catch (e) {}
                            break;
                        case 'mute':
                            player.muted = true;
                            break;
                        case 'unmute':
                            player.muted = false;
                            break;
                        case 'setVolume':
                            player.volume = Math.max(0, Math.min(1, (Number(data.volume) || 0) / 100));
                            break;
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
